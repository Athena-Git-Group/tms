# TMS 本機開發環境：Postgres + Kafka + 照片儲存模擬服務（＋選用的 Conduktor Console 看 Kafka）
#
# 啟動：  docker compose up -d
#
# 連 Conduktor（看 Kafka topic、訊息、consumer group 的網頁工具）一起起：
#   docker compose --profile conduktor up -d
#   打開 http://localhost:8088 登入。
#
#   登入帳密（預設，只供本機使用）：
#     帳號 admin@tms.local
#     密碼 Tms_local1!
#   想換帳密或填 Conduktor 授權碼：cp .env.example .env 後修改 .env，
#   再跑一次上面的 up 指令。.env 不進版控；沒有 .env 就用上面的預設值，
#   沒填授權碼就以免費的社群版執行。
#
# 停止：  docker compose down          （保留資料）
# 重置：  docker compose down -v      （連資料一起清掉，下次啟動 Flyway 重建）
#
# 注意：本機 5432 已被 Langfuse 的 Postgres 佔用，所以這裡的 Postgres
# 對外開在 5433。啟動 app 時要覆寫 DB URL（Flyway 共用同一個變數）：
#
#   TMS_DB_URL=jdbc:postgresql://localhost:5433/tms ./mvnw -f tms/pom.xml spring-boot:run
#
# 帳號密碼都用 application.properties 的預設值：
#   Flyway 管理帳號 tms / tms（下面 POSTGRES_USER 建的就是它）
#   應用帳號 tms_app / tms_app（V1 migration 會自己建立並授權，不用手動處理）
# Kafka 在預設的 localhost:9092，topic 開 auto-create，app 直接用預設值即可。
#
# 照片存放（模擬雲端儲存）：工務單照片存在 fake-gcs-server（localhost:4443），
# 它模擬 Google Cloud Storage，後端用的是跟正式環境同一套官方程式庫，只差連線位址。
# 後端啟動時自己建立儲存空間，預設名稱 tms-repair-photos-local（TMS_STORAGE_BUCKET 可改）；
# 這個服務沒起來，後端會啟動失敗。照片存在 tms-fake-gcs-data volume，down -v 會一起清掉。

services:
  postgres:
    image: postgres:16-alpine
    container_name: tms-postgres
    environment:
      POSTGRES_DB: tms
      POSTGRES_USER: tms
      POSTGRES_PASSWORD: tms
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - tms-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tms -d tms"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.9.1
    container_name: tms-kafka
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      # 單節點 KRaft（新版 Kafka 不需要 ZooKeeper）
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # 兩個對外入口：宿主機上的 app 連 localhost:9092；
      # 同一個 docker 網路裡的容器（例如 Conduktor）連 kafka:29092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      # 單 broker，所有內部 topic 的複本數只能是 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - tms-kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  fake-gcs:
    image: fsouza/fake-gcs-server:1.56.1
    container_name: tms-fake-gcs
    command: ["-scheme", "http", "-port", "4443", "-public-host", "localhost:4443", "-external-url", "http://localhost:4443"]
    ports:
      - "127.0.0.1:4443:4443"
    volumes:
      - tms-fake-gcs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:4443/storage/v1/b || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 以下兩個服務只在 --profile conduktor 時啟動，平常的 docker compose up 不會帶起來
  conduktor-postgres:
    image: postgres:16-alpine
    container_name: tms-conduktor-postgres
    profiles: [conduktor]
    environment:
      POSTGRES_DB: conduktor
      POSTGRES_USER: conduktor
      POSTGRES_PASSWORD: conduktor
    volumes:
      - tms-conduktor-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conduktor -d conduktor"]
      interval: 5s
      timeout: 3s
      retries: 10

  conduktor-console:
    image: conduktor/conduktor-console:1.48.1
    container_name: tms-conduktor-console
    profiles: [conduktor]
    depends_on:
      conduktor-postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped
    ports:
      # 8080 是後端，所以 Console 開在 8088
      - "127.0.0.1:8088:8080"
    volumes:
      - tms-conduktor-data:/var/conduktor
    environment:
      CDK_DATABASE_URL: "postgresql://conduktor:conduktor@conduktor-postgres:5432/conduktor"
      CDK_ORGANIZATION_NAME: "tms-local"
      CDK_ADMIN_EMAIL: "${CDK_ADMIN_EMAIL:-admin@tms.local}"
      # 密碼至少 8 碼且要有大小寫、數字、符號，不然 Console 起不來
      CDK_ADMIN_PASSWORD: "${CDK_ADMIN_PASSWORD:-Tms_local1!}"
      # 沒有授權碼時以社群版執行
      CDK_LICENSE: "${CDK_LICENSE:-}"
      # 開機就登記好這座 Kafka，走容器網路的 INTERNAL 入口
      CDK_CLUSTERS_0_ID: tms-kafka
      CDK_CLUSTERS_0_NAME: "tms-kafka"
      CDK_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:29092"

volumes:
  tms-pgdata:
  tms-kafka-data:
  tms-conduktor-pgdata:
  tms-conduktor-data:
  tms-fake-gcs-data:
