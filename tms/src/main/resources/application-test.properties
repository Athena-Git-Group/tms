spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

tms.outbox.relay.poll-interval=200ms

# 測試收尾容器先停時，Hikari 別拿預設 30s 等連線——surefire 會以為 fork 掛了強殺
spring.datasource.hikari.connection-timeout=3000

tms.auth.jwt.secret=test-only-secret-0123456789abcdef0123456789abcdef
tms.auth.jwt.ttl=12h

# 推播重試間隔維持秒級：重試若擋住分區，排在後面的推播會晚到超過一秒，測試才分得出來
tms.push.retry.initial-interval=1s

# 測試的 topic 由測試先建成 1 個分區，宣告也維持 1 個，同一個 topic 的訊息才有確定的先後
tms.kafka.topic.partitions=1
