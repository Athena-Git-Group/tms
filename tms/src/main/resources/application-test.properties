# test profile：datasource／Kafka 的實際位址由各測試以 Testcontainers 注入
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

tms.outbox.relay.poll-interval=200ms
# 每輪撈取上限調小，積壓的情境才測得到「一輪撈不完、分幾輪送完」
tms.outbox.relay.batch-size=20

# 測試收尾容器先停時，Hikari 別拿預設 30s 等連線——surefire 會以為 fork 掛了強殺
spring.datasource.hikari.connection-timeout=3000

tms.auth.jwt.secret=test-only-secret-0123456789abcdef0123456789abcdef
tms.auth.jwt.ttl=12h

# 推播消費者重試間隔縮短，暫時性錯誤不要讓情境等太久
tms.push.retry.initial-interval=50ms
