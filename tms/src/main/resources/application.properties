spring.application.name=tms

spring.datasource.url=${TMS_DB_URL:jdbc:postgresql://localhost:5433/tms}
spring.datasource.username=${TMS_DB_USER:tms_app}
spring.datasource.password=${TMS_DB_PASSWORD:tms_app}

# schema 由 Flyway 管；Hibernate 只驗證對映、不建表
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.url=${TMS_DB_URL:jdbc:postgresql://localhost:5432/tms}
spring.flyway.user=${TMS_DB_ADMIN_USER:tms}
spring.flyway.password=${TMS_DB_ADMIN_PASSWORD:tms}

spring.kafka.bootstrap-servers=${TMS_KAFKA_BOOTSTRAP:localhost:9092}
tms.kafka.topic.task-events=tms.task-events
tms.kafka.topic.push=tms.push
tms.kafka.topic.push-dead-letter=tms.push.DLT
# 上面每個 topic 啟動時都照這兩個值建立；既有 topic 分區不足會被加到這個數。正式環境複本數設 3
tms.kafka.partitions=12
tms.kafka.replication-factor=${TMS_KAFKA_REPLICATION_FACTOR:}

# acks=all 等全部同步複本確認寫入才算送成功，
# enable.idempotence=true 讓 client 對同一筆訊息的重送（例如逾時後自動重試)，不會在 broker 端變成兩筆
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.request.timeout.ms=9000
spring.kafka.producer.properties.delivery.timeout.ms=10000
spring.kafka.consumer.auto-offset-reset=latest
tms.outbox.relay.poll-interval=2s
tms.outbox.relay.send-timeout=10s
tms.outbox.relay.claim-lease=60s
# 每輪每個租戶最多撈幾筆；積壓更多就分幾輪送完
tms.outbox.relay.batch-size=500
# 同時處理幾個租戶；每條執行緒查資料庫時各佔一條連線，不要超過連線池大小
tms.outbox.relay.tenant-parallelism=8
tms.outbox.sent-retention=3d
tms.idempotency.retention=7d

spring.task.scheduling.pool.size=4

tms.auth.jwt.secret=${TMS_JWT_SECRET:dev-only-insecure-secret-0123456789abcdef0123456789abcdef}
tms.auth.jwt.ttl=12h

# 推播送出：填 Firebase service account JSON 的檔案路徑即啟用 FCM；留空只寫日誌與送達紀錄、不打 FCM
tms.push.fcm.credentials-path=
tms.push.retry.initial-interval=1s
tms.push.retry.max-attempts=3
tms.push.consumer-concurrency=3

# 可撥動的測試時鐘：設 true 時「現在」可由 POST/DELETE /api/v1/test/clock 撥動與回復，給 App 端到端測試用。
# 正式環境一律不開；本機用環境變數 TMS_TEST_CLOCK_ENABLED=true 啟動即可。
tms.test-clock.enabled=${TMS_TEST_CLOCK_ENABLED:false}
