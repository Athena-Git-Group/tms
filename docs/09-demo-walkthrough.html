<title>一天十六步</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@500;600&display=swap">

<style>
:root{
  --ground:#F2F4F3; --surface:#FFFFFF; --surface-2:#E9EEED; --surface-3:#DCE4E3;
  --ink:#16292B; --ink-2:#4B5D5E; --ink-3:#849494;
  --rule:#D6DEDD; --rule-strong:#B6C1C0;
  --brass:#8B6317; --brass-tint:#F4E9D2;
  --crit:#94362A; --crit-tint:#F8E6E2;
  --warn:#986F1E; --warn-tint:#F7EDD5;
  --ok:#2A6857; --ok-tint:#DBEBE5;
  --frame:#1D2628; --chat:#E4EAE9;
  --shadow:0 1px 3px rgba(22,41,43,.06), 0 12px 32px -20px rgba(22,41,43,.22);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0E1415; --surface:#182122; --surface-2:#212C2C; --surface-3:#2A3636;
    --ink:#E9EEEC; --ink-2:#A9B8B7; --ink-3:#7E8E8E;
    --rule:#2B3636; --rule-strong:#3E4B4B;
    --brass:#DFB055; --brass-tint:#352A11;
    --crit:#DC8975; --crit-tint:#3C221C;
    --warn:#DFB055; --warn-tint:#352A11;
    --ok:#67B29A; --ok-tint:#19302A;
    --frame:#000; --chat:#1E2727;
    --shadow:0 1px 3px rgba(0,0,0,.4), 0 12px 32px -20px rgba(0,0,0,.75);
  }
}
:root[data-theme="dark"]{
  --ground:#0E1415; --surface:#182122; --surface-2:#212C2C; --surface-3:#2A3636;
  --ink:#E9EEEC; --ink-2:#A9B8B7; --ink-3:#7E8E8E;
  --rule:#2B3636; --rule-strong:#3E4B4B;
  --brass:#DFB055; --brass-tint:#352A11;
  --crit:#DC8975; --crit-tint:#3C221C;
  --warn:#DFB055; --warn-tint:#352A11;
  --ok:#67B29A; --ok-tint:#19302A;
  --frame:#000; --chat:#1E2727;
  --shadow:0 1px 3px rgba(0,0,0,.4), 0 12px 32px -20px rgba(0,0,0,.75);
}

*{box-sizing:border-box}
body{
  margin:0;background:var(--ground);color:var(--ink);
  font-family:"Source Serif 4","Songti TC","Noto Serif TC",Georgia,serif;
  font-size:17px;line-height:1.68;-webkit-font-smoothing:antialiased;
}
.wrap{max-width:1040px;margin:0 auto;padding:0 22px 140px}
h1,h2,h3,.ui{font-family:"Archivo","PingFang TC","Noto Sans TC",system-ui,sans-serif}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace}
p{margin:0}

header{padding:64px 0 26px}
.kick{font-family:"IBM Plex Mono",monospace;font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3);margin-bottom:16px}
h1{font-size:clamp(2.1rem,5.4vw,3.4rem);line-height:1.03;font-weight:700;letter-spacing:-.025em;margin:0}
.sub{margin-top:18px;max-width:46ch;font-size:1.1rem;line-height:1.6;color:var(--ink-2)}
.sub b{color:var(--ink);font-weight:600}

/* chapters */
.chaps{display:flex;gap:8px;flex-wrap:wrap;margin-top:28px}
.chap{
  font-family:"Archivo","PingFang TC",sans-serif;font-size:.84rem;font-weight:600;
  background:var(--surface);border:1px solid var(--rule-strong);color:var(--ink-2);
  padding:8px 14px;cursor:pointer;display:flex;align-items:center;gap:8px;
}
.chap:hover{background:var(--surface-3)}
.chap .n{font-family:"IBM Plex Mono",monospace;font-size:.68rem;color:var(--ink-3)}
.chap[aria-current="true"]{background:var(--ink);border-color:var(--ink);color:var(--ground)}
.chap[aria-current="true"] .n{color:var(--ground);opacity:.7}
.chap:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

/* stage */
.stage{
  margin-top:26px;background:var(--surface);border:1px solid var(--rule);box-shadow:var(--shadow);
  display:grid;grid-template-columns:minmax(320px,380px) 1fr;
}
@media (max-width:800px){.stage{grid-template-columns:1fr}}
.devcol{
  padding:30px 24px;background:var(--surface-2);border-right:1px solid var(--rule);
  display:flex;align-items:center;justify-content:center;min-height:560px;
}
@media (max-width:800px){.devcol{border-right:0;border-bottom:1px solid var(--rule);min-height:0}}
.narr{padding:30px 28px;display:flex;flex-direction:column;gap:18px}
.narr .who{
  font-family:"IBM Plex Mono",monospace;font-size:.66rem;letter-spacing:.15em;
  text-transform:uppercase;color:var(--brass);
}
.narr h2{font-size:clamp(1.25rem,2.6vw,1.7rem);font-weight:700;letter-spacing:-.02em;line-height:1.24;margin:0;text-wrap:balance}
.narr .say{font-size:1.04rem;line-height:1.68;color:var(--ink-2)}
.narr .say b{color:var(--ink);font-weight:600}
.why{
  margin-top:auto;padding:16px 18px;background:var(--brass-tint);font-size:.95rem;line-height:1.6;
}
.why > .k{
  display:block;font-family:"IBM Plex Mono",monospace;font-size:.62rem;letter-spacing:.14em;
  text-transform:uppercase;color:var(--brass);margin-bottom:7px;
}
.why > p{font-size:.95rem;line-height:1.6}
.why b{font-weight:600}

/* controls */
.ctl{
  position:sticky;bottom:0;z-index:20;margin-top:0;
  background:var(--surface);border:1px solid var(--rule);border-top:0;
  padding:14px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  box-shadow:0 -6px 20px -16px rgba(0,0,0,.3);
}
.bar{flex:1 1 140px;height:5px;background:var(--surface-3);position:relative;overflow:hidden;min-width:100px}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--brass);transition:width .18s}
.cnt{font-family:"IBM Plex Mono",monospace;font-size:.8rem;font-variant-numeric:tabular-nums;color:var(--ink-3);white-space:nowrap}
button{
  font-family:"Archivo","PingFang TC",sans-serif;font-size:.9rem;font-weight:600;
  background:var(--surface);color:var(--ink);border:1px solid var(--rule-strong);
  padding:9px 16px;cursor:pointer;transition:background .12s;
}
button:hover:not(:disabled){background:var(--surface-3)}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
button.pri{background:var(--brass);border-color:var(--brass);color:#fff}
button.pri:hover:not(:disabled){filter:brightness(1.1);background:var(--brass)}
.hintkey{font-size:.78rem;color:var(--ink-3)}

/* ============ device frames ============ */
.phone{
  width:290px;border:11px solid var(--frame);border-radius:36px;background:var(--surface);
  overflow:hidden;box-shadow:0 18px 40px -22px rgba(0,0,0,.5);flex:0 0 auto;
}
.pbar{
  background:var(--frame);color:#fff;padding:5px 16px 7px;display:flex;justify-content:space-between;
  font-family:"IBM Plex Mono",monospace;font-size:.6rem;letter-spacing:.04em;
}
.pbody{padding:16px 15px 22px;min-height:430px;display:flex;flex-direction:column;gap:12px}
.desk{
  width:100%;max-width:340px;border:1px solid var(--rule-strong);background:var(--surface);
  box-shadow:0 18px 40px -22px rgba(0,0,0,.4);
}
.dbar{
  background:var(--surface-3);padding:8px 11px;display:flex;align-items:center;gap:6px;
  border-bottom:1px solid var(--rule-strong);
}
.dbar i{width:9px;height:9px;border-radius:50%;background:var(--rule-strong);display:block}
.dbar span{
  margin-left:6px;font-family:"IBM Plex Mono",monospace;font-size:.6rem;color:var(--ink-3);
  background:var(--surface);padding:3px 8px;flex:1 1 auto;
}
.dbody{padding:15px 14px 20px;display:flex;flex-direction:column;gap:11px;min-height:380px}

/* ============ screen widgets ============ */
.s-hd{display:flex;align-items:baseline;gap:8px;padding-bottom:10px;border-bottom:1px solid var(--rule)}
.s-hd .t{font-family:"Archivo",sans-serif;font-weight:700;font-size:.98rem}
.s-hd .r{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:.72rem;color:var(--ink-3)}
.s-q{font-family:"Archivo",sans-serif;font-weight:600;font-size:1.05rem;text-align:center;padding:4px 0}
.langs{display:flex;gap:5px;justify-content:center}
.langs b{
  font-family:"IBM Plex Mono",monospace;font-size:.64rem;font-weight:600;padding:3px 8px;
  border:1px solid var(--rule-strong);color:var(--ink-3);
}
.langs b.on{background:var(--ink);border-color:var(--ink);color:var(--ground)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tl{
  border:1px solid var(--rule-strong);background:var(--surface);padding:14px 6px;
  display:flex;flex-direction:column;align-items:center;gap:5px;
}
.tl svg{width:24px;height:24px;stroke:var(--ink-2);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tl span{font-family:"Archivo","PingFang TC",sans-serif;font-size:.84rem;font-weight:600}
.tl.on{border-color:var(--brass);border-width:2px;background:var(--brass-tint)}
.tl.on svg{stroke:var(--brass)}
.tl.on span{color:var(--brass)}
.btn-f{
  padding:12px;text-align:center;font-family:"Archivo","PingFang TC",sans-serif;
  font-weight:700;font-size:.98rem;background:var(--brass);color:#fff;
}
.btn-f.ghost{background:var(--surface);color:var(--ink-3);border:1px solid var(--rule-strong)}
.btn-f.okb{background:var(--ok)}
.btn-f.dim{background:var(--surface-3);color:var(--ink-3)}
.center{display:flex;flex-direction:column;align-items:center;gap:11px;text-align:center;padding:18px 0 6px}
.ring{
  width:88px;height:88px;border-radius:50%;border:4px solid var(--rule-strong);
  display:grid;place-items:center;font-family:"IBM Plex Mono",monospace;font-size:1.1rem;font-weight:600;
}
.ring.b{border-color:var(--brass);color:var(--brass)}
.ring.o{border-color:var(--ok);color:var(--ok);background:var(--ok-tint);font-size:2rem}
.big-st{font-family:"Archivo",sans-serif;font-weight:700;font-size:1.5rem;letter-spacing:-.01em}
.sm-st{font-size:.9rem;color:var(--ink-2);line-height:1.45}
.tiny{font-size:.76rem;color:var(--ink-3);line-height:1.45}
.stars{display:flex;gap:4px;font-size:1.35rem;color:var(--brass)}
.stars s{text-decoration:none;color:var(--rule-strong)}

/* rows */
.rows{display:flex;flex-direction:column;gap:1px;background:var(--rule);border:1px solid var(--rule)}
.rw{background:var(--surface);padding:9px 11px;display:flex;align-items:center;gap:9px;font-size:.86rem}
.rw .no{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:.92rem;min-width:34px}
.rw .lb{flex:1 1 auto;min-width:0}
.rw .lb em{font-style:normal;color:var(--ink-3);font-size:.76rem;display:block}
.rw .pill{
  font-family:"IBM Plex Mono",monospace;font-size:.63rem;font-weight:600;padding:2px 6px;
  border:1px solid currentColor;white-space:nowrap;
}
.p-w{color:var(--brass)}.p-o{color:var(--ok)}.p-c{color:var(--crit)}.p-d{color:var(--ink-3)}
.rw.hi{background:var(--brass-tint)}
.rw.bad{background:var(--crit-tint)}
.sect{font-family:"IBM Plex Mono",monospace;font-size:.62rem;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);padding-top:4px}

/* chat */
.chat{display:flex;flex-direction:column;gap:9px}
.chat .day{text-align:center;font-family:"IBM Plex Mono",monospace;font-size:.6rem;color:var(--ink-3)}
.bub{
  background:var(--chat);padding:11px 12px;border-radius:3px 12px 12px 12px;font-size:.87rem;line-height:1.5;
  display:flex;flex-direction:column;gap:7px;
}
.bub.alert{background:var(--crit-tint);border-left:3px solid var(--crit)}
.bub .ttl{font-family:"Archivo",sans-serif;font-weight:700;font-size:.92rem}
.bub .kv{display:flex;gap:8px;font-size:.82rem}
.bub .kv b{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
.bub .acts{display:flex;gap:6px;margin-top:3px}
.bub .acts b{
  flex:1 1 0;text-align:center;font-family:"Archivo","PingFang TC",sans-serif;font-size:.82rem;
  font-weight:700;padding:8px;background:var(--brass);color:#fff;
}
.bub .acts b.gh{background:var(--surface);color:var(--ink-3);border:1px solid var(--rule-strong)}
.bub .tm{font-family:"IBM Plex Mono",monospace;font-size:.6rem;color:var(--ink-3);align-self:flex-end}

/* meter */
.mtr{display:flex;flex-direction:column;gap:6px}
.mtr .lbl{display:flex;font-size:.82rem;gap:8px}
.mtr .lbl b{margin-left:auto;font-family:"IBM Plex Mono",monospace}
.mtr .tr{height:12px;background:var(--surface-3);position:relative;overflow:hidden}
.mtr .tr i{position:absolute;inset:0 auto 0 0;background:var(--ok);display:block}
.mtr .tr i.over{background:var(--crit)}
.opts{display:flex;flex-direction:column;gap:6px}
.opts b{
  font-family:"Archivo","PingFang TC",sans-serif;font-size:.84rem;font-weight:600;
  padding:9px 11px;border:1px solid var(--rule-strong);background:var(--surface);
}
.timer{font-family:"IBM Plex Mono",monospace;font-size:2.6rem;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}

footer{margin-top:64px;font-size:.86rem;color:var(--ink-3);line-height:1.65;max-width:52ch}
footer a{color:var(--brass)}

@media (max-width:640px){body{font-size:16px}header{padding-top:44px}.narr{padding:22px 20px}.devcol{padding:22px 16px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">

<header>
  <p class="kick">TMS 產品 Demo · 可以自己點</p>
  <h1>一天十六步</h1>
  <p class="sub">
    從房客掃貼紙要一瓶水，到老闆早上收到三行數字。
    <b>十六個畫面，一步一步看完這套系統一天是怎麼跑的。</b>
    按下一步，或用鍵盤的左右鍵。
  </p>
  <div class="chaps" id="chaps"></div>
</header>

<div class="stage">
  <div class="devcol" id="dev"></div>
  <div class="narr">
    <p class="who" id="who"></p>
    <h2 id="ttl"></h2>
    <p class="say" id="say"></p>
    <div class="why"><span class="k">這一步在解決什麼</span><p id="why"></p></div>
  </div>
</div>

<div class="ctl">
  <button id="prev">← 上一步</button>
  <button id="next" class="pri">下一步 →</button>
  <div class="bar"><i id="bari" style="width:0%"></i></div>
  <span class="cnt" id="cnt">1 / 16</span>
  <span class="hintkey">← → 鍵也可以</span>
  <button id="restart" style="font-size:.78rem;padding:6px 11px">從頭開始</button>
</div>

<footer>
  這是我們自己產品的 demo 畫面，用來對內討論與對客戶說明——<b>不是任何競品的介面</b>。<br>
  競品的實機畫面幾乎都鎖在「預約 demo」後面；目前找到唯一公開的是
  <a href="https://www.youtube.com/channel/UC1Rr-bU5kc6v2xLleUXJZhg">Flexkeeping 的 YouTube 頻道</a>
  與其平台介紹片
  <a href="https://www.youtube.com/watch?v=Dbx8kvAwTaU">Meet Flexkeeping</a>
  （我只看到標題與連結，沒有逐格看過內容）。
</footer>

</div>

<script>
"use strict";
const $ = s => document.querySelector(s);

/* ---------- tiny icons ---------- */
const IC = {
  water:'<svg viewBox="0 0 24 24"><path d="M12 3 C12 3 6 10 6 14.5 A6 6 0 0 0 18 14.5 C18 10 12 3 12 3 z"/></svg>',
  towel:'<svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M9 4v16M4 9h16"/></svg>',
  brush:'<svg viewBox="0 0 24 24"><path d="M14 3l7 7-9 9H5v-7z"/><path d="M5 12l7 7"/></svg>',
  paper:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg>',
  fix:'<svg viewBox="0 0 24 24"><path d="M14 6a4 4 0 1 0 4 4l3 3-4 4-3-3a4 4 0 0 1-4-4z"/><path d="M9 12L4 17l3 3 5-5"/></svg>',
  more:'<svg viewBox="0 0 24 24"><circle cx="6" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="18" cy="12" r="1.4"/></svg>'
};

const phone = (time, body) => `
  <div class="phone">
    <div class="pbar"><span>${time}</span><span>▮▮▮ 5G</span></div>
    <div class="pbody">${body}</div>
  </div>`;

const desk = (url, body) => `
  <div class="desk">
    <div class="dbar"><i></i><i></i><i></i><span>${url}</span></div>
    <div class="dbody">${body}</div>
  </div>`;

const menu = (sel) => `
  <div class="s-hd"><span class="t">Grand Hotel</span><span class="r">305 房</span></div>
  <div class="langs"><b class="on">中文</b><b>EN</b><b>日本語</b><b>한국어</b></div>
  <p class="s-q">您需要什麼服務？</p>
  <div class="grid2">
    <div class="tl ${sel==='water'?'on':''}">${IC.water}<span>礦泉水</span></div>
    <div class="tl">${IC.towel}<span>毛巾</span></div>
    <div class="tl">${IC.brush}<span>牙刷</span></div>
    <div class="tl">${IC.paper}<span>衛生紙</span></div>
    <div class="tl">${IC.fix}<span>東西壞了</span></div>
    <div class="tl">${IC.more}<span>其他</span></div>
  </div>
  <div class="btn-f ${sel?'':'dim'}">送出</div>
  <p class="tiny" style="text-align:center">不需要下載 App · 不需要註冊</p>`;

/* ---------- steps ---------- */
const STEPS = [
{ ch:0, who:'房客 · 305 房', ttl:'房間裡有一張貼紙',
  say:'房客用手機拍一下桌上的貼紙，這個畫面就打開了。<b>不用下載 App，不用註冊，也不用自己輸入房號</b>——貼紙認得出這是 305 房。',
  why:'四五星的房客有中英日韓。<b>圖示選單比打字快，也不需要翻譯</b>。',
  dev:()=> phone('14:02', menu(null)) },

{ ch:0, who:'房客 · 305 房', ttl:'點一下「礦泉水」，按送出',
  say:'選好之後送出鈕才會亮起來。<b>備註欄放在最後面</b>，因為 9 成的需求選單裡都有。',
  why:'讓房客照選單點，系統才知道<b>這件事該送去哪個部門、幾分鐘內要做完</b>。自由打字做不到這件事。',
  dev:()=> phone('14:02', menu('water')) },

{ ch:0, who:'房客 · 305 房', ttl:'已經收到了',
  say:'送出之後畫面立刻換成這樣。中間那個圈圈是<b>已經過了幾分鐘</b>，會自己跳。',
  why:'房客最怕的是「按了之後不知道有沒有人看到」。<b>先給一個明確的回應和時間承諾。</b>',
  dev:()=> phone('14:03', `
    <div class="s-hd"><span class="t">Grand Hotel</span><span class="r">305 房</span></div>
    <div class="center">
      <div class="ring b">1′</div>
      <p class="big-st">已收到</p>
      <p class="sm-st">礦泉水 × 1</p>
      <p class="sm-st" style="color:var(--brass)">我們會在 10 分鐘內為您送達</p>
      <p class="tiny">這個畫面會自己更新<br>不用重新整理</p>
    </div>`) },

{ ch:1, who:'房務 · 8 樓 · 阿芳', ttl:'樓層服務員的手機響了',
  say:'這是 LINE 官方帳號的通知。<b>不是發到一個人的手機，是發給 8 樓所有在班的人</b>——誰有空誰按「我來」。',
  why:'如果指定給某一個人，<b>那個人請假、交班、去別樓層支援，這件事就卡住了</b>。發給一群人才不會斷。',
  dev:()=> phone('14:03', `
    <div class="s-hd"><span class="t">Grand Hotel 工作通知</span></div>
    <div class="chat">
      <p class="day">今天</p>
      <div class="bub">
        <span class="ttl">305 房 · 礦泉水 × 1</span>
        <span class="kv">說好時間 <b>10 分鐘內</b></span>
        <span class="kv">目前 <b>還沒有人接</b></span>
        <div class="acts"><b>我來</b><b class="gh">轉給別人</b></div>
      </div>

const CHAPS = [
  {n:'01', t:'房客'},
  {n:'02', t:'房務與查房'},
  {n:'03', t:'主管與櫃檯'},
  {n:'04', t:'老闆與業務'}
];

let i = 0;

function render(){
  const s = STEPS[i];
  $("#dev").innerHTML = s.dev();
  $("#who").textContent = s.who;
  $("#ttl").textContent = s.ttl;
  $("#say").innerHTML = s.say;
  $("#why").innerHTML = s.why;
  $("#cnt").textContent = (i+1) + " / " + STEPS.length;
  $("#bari").style.width = ((i+1)/STEPS.length*100) + "%";
  $("#prev").disabled = i === 0;
  $("#next").disabled = i === STEPS.length - 1;
  $("#next").textContent = i === STEPS.length - 1 ? "看完了" : "下一步 →";
  document.querySelectorAll(".chap").forEach((b, k) =>
    b.setAttribute("aria-current", k === s.ch ? "true" : "false"));
}

$("#chaps").innerHTML = CHAPS.map((c, k) =>
  `<button class="chap" data-ch="${k}" aria-current="false"><span class="n">${c.n}</span>${c.t}</button>`).join("");

$("#chaps").addEventListener("click", e => {
  const b = e.target.closest(".chap"); if(!b) return;
  const ch = +b.dataset.ch;
  const idx = STEPS.findIndex(s => s.ch === ch);
  if(idx >= 0){ i = idx; render(); }
});
$("#prev").addEventListener("click", () => { if(i > 0){ i--; render(); } });
$("#next").addEventListener("click", () => { if(i < STEPS.length-1){ i++; render(); } });
$("#restart").addEventListener("click", () => { i = 0; render(); window.scrollTo({top:0, behavior:'smooth'}); });
document.addEventListener("keydown", e => {
  if(e.target.tagName === "INPUT") return;
  if(e.key === "ArrowLeft" && i > 0){ i--; render(); }
  if(e.key === "ArrowRight" && i < STEPS.length-1){ i++; render(); }
});
render();
</script>
