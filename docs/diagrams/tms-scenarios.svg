<text x="640.0" y="342" font-size="13" fill="#495057" text-anchor="middle" font-weight="normal">與資料同一筆交易寫入</text>
<text x="640.0" y="361" font-size="13" fill="#495057" text-anchor="middle" font-weight="normal">→ 不會改了資料卻漏發</text>
