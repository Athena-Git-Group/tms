<text x="30" y="44" font-size="26" fill="#1e1e1e" text-anchor="start" font-weight="bold">TMS：三種使用者怎麼串在一起</text>
<text x="30" y="70" font-size="14" fill="#495057" text-anchor="start" font-weight="normal">寫入都走 REST API 進同一個資料庫；資料一改，事件經 Kafka 分頭送到櫃檯看板（SSE）與員工手機（推播）</text>
