<text x="385.0" y="241" font-size="13" fill="#495057" text-anchor="middle" font-weight="normal">（多飯店資料隔離）</text>
<text x="385.0" y="260" font-size="13" fill="#495057" text-anchor="middle" font-weight="normal"></text>
<text x="385.0" y="279" font-size="13" fill="#1971c2" text-anchor="middle" font-weight="normal">工單操作</text>
