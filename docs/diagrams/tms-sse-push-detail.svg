<text x="1055.0" y="216" font-size="13" fill="#1971c2" text-anchor="middle" font-weight="normal">① App 登入後登記裝置（PUT /me/push-token）</text>
<g filter="url(#rough)"><rect x="720.0" y="250" width="220" height="52" rx="14" fill="#fff4e6" stroke="#e8590c" stroke-width="1.6"/><rect x="722.0" y="248.5" width="217" height="54" rx="15" fill="none" stroke="#e8590c" stroke-width="1" opacity=".5"/></g>
<text x="830" y="272" font-size="13" fill="#e8590c" text-anchor="middle" font-weight="normal">② 從 tms.push 拿到一則</text>
<text x="830" y="291" font-size="13" fill="#e8590c" text-anchor="middle" font-weight="normal">收件人在派單當下已決定</text>
<g filter="url(#rough)"><rect x="720.0" y="312" width="220" height="33" rx="14" fill="#f8f9fa" stroke="#495057" stroke-width="1.6"/><rect x="722.0" y="310.5" width="217" height="35" rx="15" fill="none" stroke="#495057" stroke-width="1" opacity=".5"/></g>
<text x="830" y="334" font-size="13" fill="#495057" text-anchor="middle" font-weight="normal">③ 查送過沒？送過就跳過</text>
<g filter="url(#rough)"><rect x="720.0" y="355" width="220" height="52" rx="14" fill="#f8f9fa" stroke="#495057" stroke-width="1.6"/><rect x="722.0" y="353.5" width="217" height="54" rx="15" fill="none" stroke="#495057" stroke-width="1" opacity=".5"/></g>
