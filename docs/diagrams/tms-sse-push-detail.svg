<text x="30" y="44" font-size="26" fill="#1e1e1e" text-anchor="start" font-weight="bold">櫃檯看板（SSE）與手機推播：一步一步發生什麼？出錯時怎麼辦？</text>
<text x="30" y="72" font-size="14" fill="#495057" text-anchor="start" font-weight="normal">左邊是瀏覽器開著看板時的長連線；右邊是一則推播從 Kafka 到手機。紅色是出狀況時的處理</text>
<g filter="url(#rough)"><rect x="20" y="95" width="670" height="850" rx="14" fill="none" stroke="#0c8599" stroke-width="1.8" stroke-dasharray="8 6"/><rect x="22" y="93.5" width="667" height="852" rx="15" fill="none" stroke="#0c8599" stroke-width="1" opacity=".5" stroke-dasharray="8 6"/></g>
<text x="36" y="121" font-size="15" fill="#0c8599" text-anchor="start" font-weight="bold">櫃檯看板：SSE 長連線</text>
<g filter="url(#rough)"><rect x="70.0" y="135" width="200" height="58" rx="14" fill="#ebfbee" stroke="#2f9e44" stroke-width="2.2"/><rect x="72.0" y="133.5" width="197" height="60" rx="15" fill="none" stroke="#2f9e44" stroke-width="1" opacity=".5"/></g>
<text x="170.0" y="162" font-size="15" fill="#1e1e1e" text-anchor="middle" font-weight="bold">後端</text>
<text x="170.0" y="185" font-size="12" fill="#495057" text-anchor="middle" font-weight="normal">看板事件消費者＋串流端點</text>
<g filter="url(#rough)"><rect x="420.0" y="135" width="200" height="58" rx="14" fill="#e7f5ff" stroke="#1971c2" stroke-width="2.2"/><rect x="422.0" y="133.5" width="197" height="60" rx="15" fill="none" stroke="#1971c2" stroke-width="1" opacity=".5"/></g>
<text x="520.0" y="162" font-size="15" fill="#1e1e1e" text-anchor="middle" font-weight="bold">櫃檯瀏覽器</text>
<text x="520.0" y="185" font-size="12" fill="#495057" text-anchor="middle" font-weight="normal">看板頁</text>
<path d="M170 193 L170 845" stroke="#adb5bd" stroke-width="1.5" stroke-dasharray="6 6" filter="url(#rough)"/>
<path d="M520 193 L520 845" stroke="#adb5bd" stroke-width="1.5" stroke-dasharray="6 6" filter="url(#rough)"/>
<path d="M520 225 L178 225" fill="none" stroke="#1971c2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1971c2)" filter="url(#rough)"/>
<text x="345.0" y="216" font-size="13" fill="#1971c2" text-anchor="middle" font-weight="normal">① 連上 GET /staff/stream（帶登入憑證）</text>
<path d="M170 280 L512 280" fill="none" stroke="#0c8599" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m0c8599)" filter="url(#rough)"/>
<text x="345.0" y="271" font-size="13" fill="#0c8599" text-anchor="middle" font-weight="normal">② init ＋ resync：「先去讀整份看板」</text>
<g filter="url(#rough)"><rect x="425.0" y="300" width="190" height="33" rx="14" fill="#e7f5ff" stroke="#1971c2" stroke-width="1.6"/><rect x="427.0" y="298.5" width="187" height="35" rx="15" fill="none" stroke="#1971c2" stroke-width="1" opacity=".5"/></g>
<text x="520" y="322" font-size="13" fill="#1971c2" text-anchor="middle" font-weight="normal">讀 /api/v1/desk/board</text>
<path d="M170 380 L512 380" fill="none" stroke="#0c8599" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m0c8599)" filter="url(#rough)"/>
<text x="345.0" y="371" font-size="13" fill="#0c8599" text-anchor="middle" font-weight="normal">③ task 訊號 {task_id, seq, type}</text>
<text x="345.0" y="399" font-size="12" fill="#495057" text-anchor="middle" font-weight="normal">只說「哪張單變了」，不帶單的內容</text>
<path d="M520 445 L178 445" fill="none" stroke="#1971c2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1971c2)" filter="url(#rough)"/>
<text x="345.0" y="436" font-size="13" fill="#1971c2" text-anchor="middle" font-weight="normal">④ 重抓看板 GET /api/v1/desk/board</text>
<path d="M170 505 L512 505" fill="none" stroke="#0c8599" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7" marker-end="url(#m0c8599)" filter="url(#rough)"/>
<text x="345.0" y="496" font-size="13" fill="#0c8599" text-anchor="middle" font-weight="normal">⑤ 每 15 秒一次 heartbeat</text>
<text x="30" y="548" font-size="14" fill="#e03131" text-anchor="start" font-weight="bold">— 出狀況時 —</text>
<path d="M170 590 L512 590" fill="none" stroke="#e03131" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#me03131)" filter="url(#rough)"/>
<text x="345.0" y="581" font-size="13" fill="#e03131" text-anchor="middle" font-weight="normal">⑥ degraded：Kafka 落後超過 10 秒</text>
<g filter="url(#rough)"><rect x="370.0" y="605" width="300" height="52" rx="14" fill="#fff5f5" stroke="#e03131" stroke-width="1.6"/><rect x="372.0" y="603.5" width="297" height="54" rx="15" fill="none" stroke="#e03131" stroke-width="1" opacity=".5"/></g>
<text x="520" y="627" font-size="13" fill="#e03131" text-anchor="middle" font-weight="normal">顯示「連線異常」提醒列</text>
<text x="520" y="646" font-size="13" fill="#e03131" text-anchor="middle" font-weight="normal">改成每 5 秒自己重讀看板</text>
<path d="M170 695 L512 695" fill="none" stroke="#2f9e44" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m2f9e44)" filter="url(#rough)"/>
<text x="345.0" y="686" font-size="13" fill="#2f9e44" text-anchor="middle" font-weight="normal">⑦ recovered：恢復了</text>
<g filter="url(#rough)"><rect x="370.0" y="710" width="300" height="33" rx="14" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.6"/><rect x="372.0" y="708.5" width="297" height="35" rx="15" fill="none" stroke="#2f9e44" stroke-width="1" opacity=".5"/></g>
<text x="520" y="732" font-size="13" fill="#2f9e44" text-anchor="middle" font-weight="normal">重讀一次，回到等訊號</text>
<g filter="url(#rough)"><rect x="370.0" y="775" width="300" height="71" rx="14" fill="#fff5f5" stroke="#e03131" stroke-width="1.6"/><rect x="372.0" y="773.5" width="297" height="73" rx="15" fill="none" stroke="#e03131" stroke-width="1" opacity=".5"/></g>
<text x="520" y="797" font-size="13" fill="#e03131" text-anchor="middle" font-weight="normal">⑧ 35 秒什麼都沒收到 → 當作斷線</text>
<text x="520" y="816" font-size="13" fill="#e03131" text-anchor="middle" font-weight="normal">1 秒後重連，之後每 5 秒試一次</text>
<text x="520" y="835" font-size="13" fill="#e03131" text-anchor="middle" font-weight="normal">連上後從 ② 重來（整份重讀，不逐筆補）</text>
<g filter="url(#rough)"><rect x="45.0" y="862" width="250" height="71" rx="14" fill="#fff4e6" stroke="#e8590c" stroke-width="1.6"/><rect x="47.0" y="860.5" width="247" height="73" rx="15" fill="none" stroke="#e8590c" stroke-width="1" opacity=".5"/></g>
<text x="170" y="884" font-size="13" fill="#e8590c" text-anchor="middle" font-weight="normal">同一事件 Kafka 送兩次？</text>
<text x="170" y="903" font-size="13" fill="#e8590c" text-anchor="middle" font-weight="normal">後端記住每張單送過的</text>
<text x="170" y="922" font-size="13" fill="#e8590c" text-anchor="middle" font-weight="normal">最大 seq，舊的直接丟</text>
<g filter="url(#rough)"><rect x="345.0" y="862" width="250" height="71" rx="14" fill="#f8f9fa" stroke="#495057" stroke-width="1.6"/><rect x="347.0" y="860.5" width="247" height="73" rx="15" fill="none" stroke="#495057" stroke-width="1" opacity=".5"/></g>
<text x="470" y="884" font-size="13" fill="#495057" text-anchor="middle" font-weight="normal">誰收得到？同飯店的</text>
<text x="470" y="903" font-size="13" fill="#495057" text-anchor="middle" font-weight="normal">櫃檯／主管：全部單</text>
<text x="470" y="922" font-size="13" fill="#495057" text-anchor="middle" font-weight="normal">房務工務：自己部門或自己的</text>
<g filter="url(#rough)"><rect x="710" y="95" width="670" height="850" rx="14" fill="none" stroke="#495057" stroke-width="1.8" stroke-dasharray="8 6"/><rect x="712" y="93.5" width="667" height="852" rx="15" fill="none" stroke="#495057" stroke-width="1" opacity=".5" stroke-dasharray="8 6"/></g>
<text x="726" y="121" font-size="15" fill="#495057" text-anchor="start" font-weight="bold">手機推播：一則通知的旅程</text>
<g filter="url(#rough)"><rect x="735.0" y="135" width="190" height="58" rx="14" fill="#ebfbee" stroke="#2f9e44" stroke-width="2.2"/><rect x="737.0" y="133.5" width="187" height="60" rx="15" fill="none" stroke="#2f9e44" stroke-width="1" opacity=".5"/></g>
<text x="830.0" y="162" font-size="15" fill="#1e1e1e" text-anchor="middle" font-weight="bold">後端</text>
<text x="830.0" y="185" font-size="12" fill="#495057" text-anchor="middle" font-weight="normal">推播消費者</text>
