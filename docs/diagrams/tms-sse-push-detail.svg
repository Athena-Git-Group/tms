<text x="1065.0" y="185" font-size="12" fill="#495057" text-anchor="middle" font-weight="normal">Google 推播</text>
<g filter="url(#rough)"><rect x="1205.0" y="135" width="150" height="58" rx="14" fill="#e7f5ff" stroke="#1971c2" stroke-width="2.2"/><rect x="1207.0" y="133.5" width="147" height="60" rx="15" fill="none" stroke="#1971c2" stroke-width="1" opacity=".5"/></g>
<text x="1280.0" y="162" font-size="15" fill="#1e1e1e" text-anchor="middle" font-weight="bold">員工手機</text>
<text x="1280.0" y="185" font-size="12" fill="#495057" text-anchor="middle" font-weight="normal">Flutter App</text>
