<text x="830" y="396" font-size="13" fill="#495057" text-anchor="middle" font-weight="normal">沒有裝置 → 記「無裝置」結束</text>
<path d="M830 447 L1057 447" fill="none" stroke="#495057" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m495057)" filter="url(#rough)"/>
<text x="947.5" y="438" font-size="13" fill="#495057" text-anchor="middle" font-weight="normal">⑤ 送出：標題、內容、點了去哪</text>
<path d="M1065 502 L1272 502" fill="none" stroke="#495057" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m495057)" filter="url(#rough)"/>
<text x="1172.5" y="493" font-size="13" fill="#495057" text-anchor="middle" font-weight="normal">⑥ 手機跳通知</text>
<text x="1172.5" y="521" font-size="12" fill="#495057" text-anchor="middle" font-weight="normal">點開依目的地導頁</text>
<g filter="url(#rough)"><rect x="1195.0" y="527" width="170" height="52" rx="14" fill="#e7f5ff" stroke="#1971c2" stroke-width="1.6"/><rect x="1197.0" y="525.5" width="167" height="54" rx="15" fill="none" stroke="#1971c2" stroke-width="1" opacity=".5"/></g>
<text x="1280" y="549" font-size="13" fill="#1971c2" text-anchor="middle" font-weight="normal">工單／工務單</text>
<text x="1280" y="568" font-size="13" fill="#1971c2" text-anchor="middle" font-weight="normal">待認領池／首頁</text>
<g filter="url(#rough)"><rect x="720.0" y="537" width="220" height="33" rx="14" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.6"/><rect x="722.0" y="535.5" width="217" height="35" rx="15" fill="none" stroke="#2f9e44" stroke-width="1" opacity=".5"/></g>
<text x="830" y="559" font-size="13" fill="#2f9e44" text-anchor="middle" font-weight="normal">⑦ 記送達結果：sent</text>
<text x="720" y="622" font-size="14" fill="#e03131" text-anchor="start" font-weight="bold">— 出狀況時 —</text>
<path d="M1065 662 L838 662" fill="none" stroke="#e03131" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7" marker-end="url(#me03131)" filter="url(#rough)"/>
<text x="947.5" y="653" font-size="13" fill="#e03131" text-anchor="middle" font-weight="normal">Firebase 暫時錯誤（忙線、逾時）</text>
<g filter="url(#rough)"><rect x="735.0" y="677" width="280" height="52" rx="14" fill="#fff5f5" stroke="#e03131" stroke-width="1.6"/><rect x="737.0" y="675.5" width="277" height="54" rx="15" fill="none" stroke="#e03131" stroke-width="1" opacity=".5"/></g>
<text x="875" y="699" font-size="13" fill="#e03131" text-anchor="middle" font-weight="normal">退避 1 秒、2 秒重試（共 3 次）</text>
<text x="875" y="718" font-size="13" fill="#e03131" text-anchor="middle" font-weight="normal">仍失敗 → 丟進 tms.push.DLT 待查</text>
<path d="M1065 777 L838 777" fill="none" stroke="#e03131" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7" marker-end="url(#me03131)" filter="url(#rough)"/>
<text x="947.5" y="768" font-size="13" fill="#e03131" text-anchor="middle" font-weight="normal">裝置 token 失效（App 被移除）</text>
<g filter="url(#rough)"><rect x="735.0" y="792" width="280" height="52" rx="14" fill="#fff5f5" stroke="#e03131" stroke-width="1.6"/><rect x="737.0" y="790.5" width="277" height="54" rx="15" fill="none" stroke="#e03131" stroke-width="1" opacity=".5"/></g>
<text x="875" y="814" font-size="13" fill="#e03131" text-anchor="middle" font-weight="normal">撤銷這台裝置，不再重試</text>
<text x="875" y="833" font-size="13" fill="#e03131" text-anchor="middle" font-weight="normal">記 failed</text>
