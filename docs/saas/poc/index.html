<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SaaS 營運後台 POC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/*
 * SaaS 營運後台 POC
 *
 * 設計 token 沿用 docs/13-poc/shared/styles.css（同一套顏色與字體角色），
 * 但這份是單檔、自給自足，不引用 13-poc 的檔案，避免兩個 POC 互相綁死。
 * 顏色只在 token 層定義；元件一律吃 var(--color-*)。
 */
:root {
  --color-surface: #F7F9FA;
  --color-surface-raised: #FFFFFF;
  --color-surface-sunken: #EDF1F4;
  --color-ink: #1B2A33;
  --color-ink-muted: #56687A;
  --color-ink-faint: #8A96A0;
  --color-line: #C6D0D8;
  --color-line-strong: #AAB6BF;
  --color-accent: #15705A;
  --color-accent-strong: #0F5445;
  --color-accent-soft: #DFF2EC;
  --color-accent-ink: #FFFFFF;
  --color-success: #15705A;  --color-success-soft: #DFF2EC;
  --color-warning: #8A6210;  --color-warning-soft: #F7EDD3;
  --color-error: #B33D2B;    --color-error-soft: #FBE9E5;
  --color-info: #33608A;     --color-info-soft: #E4EDF5;
  --color-neutral-soft: #E0E6EA;
  --font-display: 'Fraunces', Georgia, serif;
  --font-body: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, 'PingFang TC', 'Microsoft JhengHei', sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  --radius-sm: 6px; --radius-md: 10px; --radius-lg: 16px;
  --shadow-card: 0 1px 2px rgba(27,42,51,.06), 0 6px 16px rgba(27,42,51,.06);
  --shadow-raised: 0 4px 10px rgba(27,42,51,.10), 0 16px 32px rgba(27,42,51,.08);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --color-surface: #0F171C; --color-surface-raised: #17222A; --color-surface-sunken: #0B1216;
    --color-ink: #E8EEF0; --color-ink-muted: #9FB0BA; --color-ink-faint: #71838D;
    --color-line: #2B3940; --color-line-strong: #3C4C55;
    --color-accent: #2FBE9B; --color-accent-strong: #52D6B5; --color-accent-soft: #163029; --color-accent-ink: #06221B;
    --color-success: #3FCBA0; --color-success-soft: #113028;
    --color-warning: #D9A94B; --color-warning-soft: #332710;
    --color-error: #E07A62;   --color-error-soft: #391C16;
    --color-info: #6FA3D1;    --color-info-soft: #1C2B38;
    --color-neutral-soft: #202B33;
    --shadow-card: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
    --shadow-raised: 0 6px 16px rgba(0,0,0,.4), 0 20px 40px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"] {
  --color-surface: #0F171C; --color-surface-raised: #17222A; --color-surface-sunken: #0B1216;
  --color-ink: #E8EEF0; --color-ink-muted: #9FB0BA; --color-ink-faint: #71838D;
  --color-line: #2B3940; --color-line-strong: #3C4C55;
  --color-accent: #2FBE9B; --color-accent-strong: #52D6B5; --color-accent-soft: #163029; --color-accent-ink: #06221B;
  --color-success: #3FCBA0; --color-success-soft: #113028;
  --color-warning: #D9A94B; --color-warning-soft: #332710;
  --color-error: #E07A62;   --color-error-soft: #391C16;
  --color-info: #6FA3D1;    --color-info-soft: #1C2B38;
  --color-neutral-soft: #202B33;
  --shadow-card: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
  --shadow-raised: 0 6px 16px rgba(0,0,0,.4), 0 20px 40px rgba(0,0,0,.35);
}

*, *::before, *::after { box-sizing: border-box; }
html { color-scheme: light dark; }
body { margin: 0; background: var(--color-surface); color: var(--color-ink); font-family: var(--font-body); font-size: 14.5px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4 { margin: 0 0 .4em; font-weight: 700; text-wrap: balance; }
p { margin: 0 0 .8em; }
a { color: var(--color-accent); }
code, .mono { font-family: var(--font-mono); font-size: .92em; }
.num { font-family: var(--font-display); font-variant-numeric: tabular-nums; }
button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }

/* ── 版面 ─────────────────────────────── */
.topbar { position: sticky; top: 0; z-index: 20; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 18px; padding: 10px 20px; background: var(--color-surface-raised); border-bottom: 1px solid var(--color-line); }
.brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; }
.brand-mark { font-family: var(--font-display); font-size: 20px; font-weight: 600; }
.brand-sub { font-size: 12.5px; color: var(--color-ink-muted); padding: 2px 9px; border: 1px solid var(--color-line); border-radius: 999px; }
.top-ctl { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--color-ink-muted); }
.top-ctl select, .top-ctl input { padding: 6px 8px; border-radius: var(--radius-sm); border: 1px solid var(--color-line-strong); background: var(--color-surface-raised); font-weight: 600; }
.shell { display: grid; grid-template-columns: 216px 1fr; min-height: calc(100vh - 57px); }
.sidenav { border-right: 1px solid var(--color-line); background: var(--color-surface-raised); padding: 14px 10px; display: flex; flex-direction: column; gap: 2px; }
.sidenav a { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: var(--radius-sm); color: var(--color-ink-muted); text-decoration: none; font-weight: 500; }
.sidenav a:hover { background: var(--color-surface-sunken); color: var(--color-ink); }
.sidenav a.is-active { background: var(--color-accent-soft); color: var(--color-accent-strong); font-weight: 700; }
.sidenav .nav-count { margin-left: auto; font-size: 11.5px; font-weight: 700; padding: 0 7px; border-radius: 999px; background: var(--color-error-soft); color: var(--color-error); }
.sidenav .nav-sep { height: 1px; background: var(--color-line); margin: 10px 6px; }
.sidenav .nav-label { font-size: 11.5px; color: var(--color-ink-faint); padding: 2px 12px; letter-spacing: .04em; }
main { padding: 22px 26px 60px; min-width: 0; max-width: 1240px; }
.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px 16px; margin-bottom: 16px; }
.page-head h1 { font-size: 22px; margin: 0; }
.page-head .sub { color: var(--color-ink-muted); font-size: 13.5px; margin: 2px 0 0; }
.page-head .actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .sidenav { flex-direction: row; overflow-x: auto; border-right: none; border-bottom: 1px solid var(--color-line); padding: 8px 12px; }
  .sidenav a { white-space: nowrap; }
  .sidenav .nav-sep, .sidenav .nav-label { display: none; }
  main { padding: 16px 16px 60px; }
  .topbar { padding: 10px 16px; }
}

/* ── 元件 ─────────────────────────────── */
.panel { background: var(--color-surface-raised); border: 1px solid var(--color-line); border-radius: var(--radius-md); box-shadow: var(--shadow-card); padding: 16px 18px; margin-bottom: 16px; min-width: 0; overflow-x: auto; }
.panel h2 { font-size: 15.5px; margin-bottom: 2px; }
.panel .panel-sub { font-size: 12.5px; color: var(--color-ink-muted); margin: 0 0 12px; }
.panel-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 12px; margin-bottom: 10px; }
.panel-head .actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr)); gap: 16px; }
.grid-2 > .panel { margin-bottom: 0; }

.btn { appearance: none; border: 1px solid transparent; border-radius: var(--radius-sm); padding: 7px 13px; font-size: 13.5px; font-weight: 600; cursor: pointer; white-space: nowrap; }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
.btn-primary { background: var(--color-accent); border-color: var(--color-accent); color: var(--color-accent-ink); }
.btn-primary:hover:not(:disabled) { background: var(--color-accent-strong); border-color: var(--color-accent-strong); }
.btn-secondary { background: var(--color-surface-raised); border-color: var(--color-line-strong); }
.btn-secondary:hover:not(:disabled) { border-color: var(--color-accent); color: var(--color-accent); }
.btn-danger { background: var(--color-surface-raised); border-color: var(--color-error); color: var(--color-error); }
.btn-sm { padding: 4px 9px; font-size: 12.5px; }
.btn-link { background: none; border: none; color: var(--color-accent); padding: 0; font-weight: 600; cursor: pointer; }
.btn.locked { opacity: .5; }
.btn.locked::after { content: ' 🔒'; font-size: 11px; }

.pill { display: inline-flex; align-items: center; gap: 5px; padding: 1px 9px; border-radius: 999px; font-size: 12px; font-weight: 700; white-space: nowrap; background: var(--color-neutral-soft); color: var(--color-ink-muted); }
.pill::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.ok { background: var(--color-success-soft); color: var(--color-success); }
.pill.warn { background: var(--color-warning-soft); color: var(--color-warning); }
.pill.err { background: var(--color-error-soft); color: var(--color-error); }
.pill.info { background: var(--color-info-soft); color: var(--color-info); }
.pill.plain::before { display: none; }

table.tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.tbl th { text-align: left; font-size: 12px; font-weight: 600; color: var(--color-ink-muted); padding: 7px 10px; border-bottom: 1px solid var(--color-line-strong); white-space: nowrap; }
.tbl td { padding: 9px 10px; border-bottom: 1px solid var(--color-line); vertical-align: top; }
.tbl tr:last-child td { border-bottom: none; }
.tbl tr.indent td:first-child { padding-left: 30px; }
.tbl tr.group-row td { background: var(--color-surface-sunken); font-weight: 700; }
.tbl .muted, .muted { color: var(--color-ink-muted); }
.faint { color: var(--color-ink-faint); font-size: 12.5px; }
.table-wrap { overflow-x: auto; }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
.kpi { background: var(--color-surface-raised); border: 1px solid var(--color-line); border-radius: var(--radius-md); padding: 12px 14px; box-shadow: var(--shadow-card); }
.kpi .k-label { font-size: 12.5px; color: var(--color-ink-muted); }
.kpi .k-value { font-family: var(--font-display); font-size: 28px; font-weight: 600; line-height: 1.2; }
.kpi.warn .k-value { color: var(--color-warning); }
.kpi.err .k-value { color: var(--color-error); }

.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--color-line); margin-bottom: 16px; overflow-x: auto; }
.tabs a { padding: 8px 14px; text-decoration: none; color: var(--color-ink-muted); font-weight: 600; border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs a.is-active { color: var(--color-accent-strong); border-bottom-color: var(--color-accent); }

.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px 16px; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field.full { grid-column: 1 / -1; }
.field > span { font-size: 12.5px; font-weight: 600; color: var(--color-ink-muted); }
.field input, .field select, .field textarea, .inline-select { padding: 7px 9px; border-radius: var(--radius-sm); border: 1px solid var(--color-line-strong); background: var(--color-surface-raised); min-width: 0; }
.field textarea { min-height: 64px; resize: vertical; }
.field .hint { font-size: 12px; color: var(--color-ink-faint); }
.checks { display: flex; flex-wrap: wrap; gap: 8px; }
.check { display: flex; align-items: center; gap: 7px; padding: 6px 10px; border: 1px solid var(--color-line); border-radius: var(--radius-sm); cursor: pointer; font-size: 13.5px; }
.check input { accent-color: var(--color-accent); width: 15px; height: 15px; }

.note { border-left: 3px solid var(--color-info); background: var(--color-info-soft); padding: 9px 12px; border-radius: 0 var(--radius-sm) var(--radius-sm) 0; font-size: 13px; margin: 0 0 12px; }
.note.warn { border-color: var(--color-warning); background: var(--color-warning-soft); }
.note.err { border-color: var(--color-error); background: var(--color-error-soft); }
.note b { font-weight: 700; }

.progress { height: 7px; border-radius: 999px; background: var(--color-surface-sunken); overflow: hidden; min-width: 80px; }
.progress > i { display: block; height: 100%; background: var(--color-accent); }

.timeline { position: relative; height: 34px; margin: 20px 4px 28px; }
.timeline .seg { position: absolute; top: 12px; height: 10px; }
.timeline .seg.active { background: var(--color-success); border-radius: 999px 0 0 999px; }
.timeline .seg.expiring { background: var(--color-warning); }
.timeline .seg.grace { background: var(--color-error); opacity: .55; border-radius: 0 999px 999px 0; }
.timeline .tick { position: absolute; top: 26px; transform: translateX(-50%); font-size: 11px; color: var(--color-ink-muted); white-space: nowrap; }
.timeline .tick.top { top: -8px; }
.timeline .today { position: absolute; top: 4px; width: 2px; height: 26px; background: var(--color-ink); }
.timeline .today span { position: absolute; top: -18px; left: 50%; transform: translateX(-50%); font-size: 11px; font-weight: 700; white-space: nowrap; }

pre.json { font-family: var(--font-mono); font-size: 12.5px; background: var(--color-surface-sunken); border: 1px solid var(--color-line); border-radius: var(--radius-sm); padding: 10px 12px; overflow: auto; max-height: 420px; margin: 0; white-space: pre; }
.diff { font-family: var(--font-mono); font-size: 12px; display: grid; grid-template-columns: max-content 1fr 1fr; gap: 2px 10px; margin-top: 6px; }
.diff .d-key { color: var(--color-ink-muted); }
.diff .d-old { color: var(--color-error); text-decoration: line-through; word-break: break-all; }
.diff .d-new { color: var(--color-success); word-break: break-all; }

.brand-preview { border: 1px solid var(--color-line); border-radius: var(--radius-md); overflow: hidden; max-width: 320px; }
.brand-preview .bp-head { padding: 14px; display: flex; align-items: center; gap: 10px; color: #FFFFFF; }
.brand-preview .bp-head img { max-height: 36px; max-width: 120px; background: rgba(255,255,255,.9); border-radius: 4px; padding: 2px; }
.brand-preview .bp-body { padding: 12px 14px; font-size: 13px; color: var(--color-ink-muted); }
.brand-preview .bp-btn { display: inline-block; margin-top: 8px; padding: 6px 12px; border-radius: 6px; color: #FFFFFF; font-weight: 700; font-size: 12.5px; }

.empty { text-align: center; color: var(--color-ink-faint); padding: 24px; font-size: 13.5px; }
.sim-switch { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; cursor: pointer; }
.sim-switch input { accent-color: var(--color-error); width: 16px; height: 16px; }

/* ── 服務狀態 ─────────────────────────── */
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--color-line-strong); flex-shrink: 0; }
.dot.ok { background: var(--color-success); }
.dot.warn { background: var(--color-warning); }
.dot.err { background: var(--color-error); }
.platform-bar { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.platform-item { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border: 1px solid var(--color-line); border-radius: var(--radius-sm); background: var(--color-surface); }
.platform-item .dot { margin-top: 6px; }
.platform-item b { display: block; font-size: 13.5px; }
.platform-item span { font-size: 12px; color: var(--color-ink-muted); }
.signal-cell { display: flex; align-items: center; gap: 6px; white-space: nowrap; font-size: 12.5px; }
.src-tag { font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 999px; white-space: nowrap; }
.src-tag.own { background: var(--color-accent-soft); color: var(--color-accent-strong); }
.src-tag.tms { background: var(--color-warning-soft); color: var(--color-warning); }
.signal-row { display: grid; grid-template-columns: 14px 150px 1fr auto; gap: 10px; align-items: start; padding: 10px 0; border-top: 1px dashed var(--color-line); }
.signal-row:first-child { border-top: none; }
.signal-row .dot { margin-top: 6px; }
.signal-row .s-why { font-size: 12px; color: var(--color-ink-faint); }
@media (max-width: 640px) { .signal-row { grid-template-columns: 14px 1fr; } .signal-row > :nth-child(n+3) { grid-column: 2; } }

/* ── Modal ／ Toast ───────────────────── */
.modal-backdrop { position: fixed; inset: 0; z-index: 50; background: rgba(15,23,28,.45); display: flex; align-items: flex-start; justify-content: center; padding: 6vh 16px; overflow-y: auto; }
.modal { background: var(--color-surface-raised); border-radius: var(--radius-lg); box-shadow: var(--shadow-raised); width: 100%; max-width: 560px; border: 1px solid var(--color-line); }
.modal.wide { max-width: 780px; }
.modal header { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--color-line); }
.modal header h3 { margin: 0; font-size: 16px; }
.modal .modal-body { padding: 16px 18px; }
.modal footer { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--color-line); }
.icon-btn { background: none; border: none; font-size: 20px; cursor: pointer; color: var(--color-ink-muted); line-height: 1; }
.toast-host { position: fixed; right: 16px; bottom: 16px; z-index: 60; display: flex; flex-direction: column; gap: 8px; max-width: min(380px, calc(100vw - 32px)); }
.toast { background: var(--color-surface-raised); border: 1px solid var(--color-line); border-left: 4px solid var(--color-info); border-radius: var(--radius-sm); box-shadow: var(--shadow-raised); padding: 10px 14px; font-size: 13.5px; }
.toast.success { border-left-color: var(--color-success); }
.toast.error { border-left-color: var(--color-error); }
.toast.warning { border-left-color: var(--color-warning); }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="brand-mark">Ops Console</span><span class="brand-sub">SaaS 營運後台 · POC</span></div>
  <label class="top-ctl">模擬 SSO 身分 <select id="user-select"></select></label>
  <label class="top-ctl">模擬今天 <input type="date" id="today-input"></label>
  <button class="btn btn-secondary btn-sm" id="reset-btn">重置示範資料</button>
</header>
<div class="shell">
  <nav class="sidenav" id="sidenav"></nav>
  <main id="main"></main>
</div>
<div id="modal-host"></div>
<div class="toast-host" id="toast-host"></div>

<script>
/**
 * SaaS 營運後台 POC —— 單檔、無框架、狀態存 localStorage。
 *
 * 依據 docs/saas/SaaS營運後台-需求共識.md 的 MVP 六個模組，並把審閱時提出的修正直接做進來：
 * - 對產品端（TMS）的寫入一律先進「同步佇列」（outbox），同一租戶串行、失敗可重試，
 *   不在後台 commit 後直接呼叫 API（docs/11 §4 第一題的雙寫問題）。
 * - 產品端 API 叫 Platform API（/platform/v1/...），不跟 TMS 主管用的 /admin/* 撞名。
 * - 「從範本複製」複製的是 TMS 的 tenant_config key，並明列哪些不複製。
 * - License API 回傳後台算好的最終狀態（有效／即將到期／寬限期／已關閉），產品端不自己算。
 *
 * 不做：真 SSO、真 API、檔案儲存、匯出 Excel（以 CSV 代替）。
 */
(function () {
  'use strict';

  var KEY = 'saas_ops_poc_v1';
  var DAY = 86400000;

  // ── 常數 ─────────────────────────────────────────────
  var ROLES = {
    admin:   { label: '管理員', group: 'OPS-Admin' },
    sales:   { label: '業務',   group: 'OPS-Sales' },
    impl:    { label: '實施',   group: 'OPS-Implementation' },
    support: { label: '客服',   group: 'OPS-Support' },
    manager: { label: '主管',   group: 'OPS-Manager' }
  };
  var PERMS = {
    admin:   ['*'],
    sales:   ['contract.write'],
    impl:    ['tenant.write', 'brand.write', 'checklist.write', 'config.copy', 'account.create', 'account.disable', 'approval.request'],
    support: ['account.reset'],
    manager: ['grace.extend', 'approval.decide']
  };
  var PERM_LABELS = {

  // ── 狀態 ─────────────────────────────────────────────
  var S = load();

  }
  // 舊版存檔沒有服務狀態相關欄位，補上即可，不用叫使用者重置
  function migrate(s) {
    if (!s.health) s.health = seedHealth();
    if (!s.heartbeat) s.heartbeat = { lastAt: null, calls: [] };
    if (s.sim.productSilent == null) s.sim.productSilent = false;
    if (s.sim.kafkaLag == null) s.sim.kafkaLag = false;
    return s;
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
  function nid(p) { S.seq += 1; return p + '_' + S.seq; }

  // ── 工具 ─────────────────────────────────────────────
  function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function $(s, r) { return (r || document).querySelector(s); }
  function d(s) { return Date.parse(s + 'T00:00:00Z'); }
  function diffDays(a, b) { return Math.round((d(a) - d(b)) / DAY); }
  function addDays(s, n) { return new Date(d(s) + n * DAY).toISOString().slice(0, 10); }
  function nowTs() { var t = new Date(); var p = function (n) { return String(n).padStart(2, '0'); }; return S.today + 'T' + p(t.getHours()) + ':' + p(t.getMinutes()) + ':' + p(t.getSeconds()); }
  function fmtTs(ts) { return ts ? ts.replace('T', ' ').slice(0, 16) : '—'; }
  function money(n) { return 'NT$ ' + Number(n || 0).toLocaleString('en-US'); }
  function rand(n) { var s = ''; var a = 'abcdefghjkmnpqrstuvwxyzABCDEFGHJKMNPQRSTUVWXYZ23456789'; for (var i = 0; i < n; i++) s += a[Math.floor(Math.random() * a.length)]; return s; }
  function me() { return S.users.find(function (u) { return u.id === S.currentUser; }); }
  function userName(id) { var u = S.users.find(function (x) { return x.id === id; }); return u ? u.name : id; }
  function hotel(id) { return S.hotels.find(function (h) { return h.id === id; }); }

  function guard(p) {
    if (can(p)) return true;

  // 密碼一律遮蔽，logo 只記大小——稽核紀錄不存敏感值，也不塞大檔
  function maskForAudit(o) {
    if (o == null || typeof o !== 'object') return o;
    var out = Array.isArray(o) ? [] : {};
    Object.keys(o).forEach(function (k) {
      var v = o[k];
      if (/password/i.test(k)) out[k] = '••••••';
      else if (k === 'logo' && typeof v === 'string') out[k] = '[image ' + Math.round(v.length * 0.75 / 1024) + ' KB]';
      else if (v && typeof v === 'object') out[k] = maskForAudit(v);
      else out[k] = v;
    });
    return out;
  }

  // ── 同步佇列（outbox）─────────────────────────────────
  // 後台先在自己的 DB 落帳＋入佇列（同一次 save），再由 pump 逐筆送出。
  // 同一租戶（key）串行：前一筆沒送成功，後面的不送——建租戶拿到 tenant_id 之前，
  // 後續寫設定的路徑根本組不出來，這就是串行的必要性。
  function enqueue(hotelId, method, path, body) {
    S.outbox.push({ id: nid('ob'), key: 'tenant:' + hotelId, hotelId: hotelId, method: method, path: path, body: maskForAudit(body), idem: 'idem-' + rand(8).toLowerCase(), status: 'pending', attempts: 0, error: null, createdAt: nowTs(), sentAt: null, actor: S.currentUser });
  }
  function blockedBy(job) {
    return S.outbox.find(function (j) { return j.key === job.key && j !== job && j.status !== 'sent' && S.outbox.indexOf(j) < S.outbox.indexOf(job); });
  }
  // 每一輪送出「每個租戶隊伍的第一筆」——不同租戶互不等待
  function pump() {
    var heads = S.outbox.filter(function (j) { return j.status === 'pending' && !blockedBy(j); });
    if (!heads.length) return;
    heads.forEach(send);
    save();
    refreshAfterSync();
  }
  function send(job) {
    job.attempts += 1;
    if (S.sim.apiDown) {
      job.status = 'failed';
      job.error = '503 Service Unavailable（模擬產品端故障）';
    } else {
      var h = hotel(job.hotelId);
      if (job.path === '/platform/v1/tenants' && h && !h.tenantId) {
        h.tenantId = S.nextTenantId++;
        job.response = { tenantId: h.tenantId };
      }
      job.status = 'sent';
      job.error = null;
      job.sentAt = nowTs();
    }
  }
  function failedCount() { return S.outbox.filter(function (j) { return j.status === 'failed'; }).length; }
  function resolvedPath(job) {
    var h = hotel(job.hotelId);
    return job.path.replace('{tenantId}', h && h.tenantId ? h.tenantId : '{tenantId}');
  }

  // ── 授權計算 ─────────────────────────────────────────
  function contractState(c, today) {
    today = today || S.today;
    if (diffDays(c.start, today) > 0) return 'pending';
    var left = diffDays(c.end, today);
    if (left > 30) return 'active';
    if (left >= 0) return 'expiring';
    if (-left <= GRACE_DAYS + (c.graceExtDays || 0)) return 'grace';
    return 'expired';
  }
  function graceEnd(c) { return addDays(c.end, GRACE_DAYS + (c.graceExtDays || 0)); }
  function contractFor(h) {
    var cs = S.contracts.filter(function (c) { return c.hotelIds.indexOf(h.id) >= 0; });
    // 多份合約時：優先挑今天生效中的，否則挑最晚到期的
    cs.sort(function (a, b) {
      var sa = contractState(a) === 'pending' ? 1 : 0, sb = contractState(b) === 'pending' ? 1 : 0;
      return sa - sb || d(b.end) - d(a.end);
    });
    return cs[0] || null;
  }
  function licenseFor(h) {
    var c = contractFor(h);
    if (!c) return { state: 'none', contract: null, modules: {} };
    var st = contractState(c);
    var on = st === 'active' || st === 'expiring' || st === 'grace';
    var mods = {};
    MODULES.forEach(function (m) { mods[m.id] = on && c.modules.indexOf(m.id) >= 0; });
    return { state: st, contract: c, modules: mods };
  }
  function scopeLabel(c) {
    if (c.scopeType === 'group') { var g = group(c.scopeId); return (g ? g.name : '?') + '（集團）'; }
    var h = hotel(c.scopeId); return h ? h.name : '?';
  }
  function licensePayload() {
    return {
      generatedAt: nowTs(),
      etag: 'W/"' + rand(10) + '"',
      tenants: S.hotels.filter(function (h) { return h.tenantId; }).map(function (h) {
        var L = licenseFor(h);
        return {
          tenantId: h.tenantId,
          state: L.state,
          modules: L.modules,
          validUntil: L.contract ? L.contract.end : null,
          graceUntil: L.contract ? graceEnd(L.contract) : null,
          limits: L.contract ? L.contract.limits : null,
          timezone: h.timezone
        };
      })
    };
  }

  // ── 服務狀態 ─────────────────────────────────────────
  // POC 把時間壓縮：15 秒沒收到 License 呼叫，代表正式環境的 30 分鐘
  var HEARTBEAT_STALE_MS = 15000;
  var LEVEL_RANK = { none: 0, ok: 1, warn: 2, err: 3 };

  // License API 是「一次拉全部租戶」，所以心跳是以產品為單位，不是以租戶為單位
  function heartbeatAgeMs() { return S.heartbeat.lastAt ? Date.now() - S.heartbeat.lastAt : null; }
  function heartbeatLevel() {
    var age = heartbeatAgeMs();
    if (age == null) return 'warn';
    return age > HEARTBEAT_STALE_MS ? 'err' : 'ok';
  }
  function productPull() {
    if (S.sim.licenseDown) {
      // 後台的 License API 掛了：產品端拉不到，後台也收不到這次呼叫
      if (S.productCache) S.productCache.stale = true;
      return false;
    }
    var payload = licensePayload();
    var sig = JSON.stringify(payload.tenants);
    var notModified = S.productCache && S.productCache.sig === sig;
    S.productCache = { fetchedAt: nowTs(), payload: payload, stale: false, sig: sig };
    S.heartbeat.lastAt = Date.now();
    S.heartbeat.calls.unshift({ at: Date.now(), status: notModified ? '304 Not Modified' : '200 OK' });
    S.heartbeat.calls = S.heartbeat.calls.slice(0, 8);
    return true;
  }

  function platformComponents() {
    var hb = heartbeatLevel();
    var age = heartbeatAgeMs();
    return [
      { name: 'TMS 應用', level: 'ok', text: '錯誤率 0.02%' },
      { name: '背景 worker', level: 'ok', text: 'relay 正常' },
      { name: 'Postgres', level: 'ok', text: '連線 38／200' },
      { name: 'Kafka（代管）', level: S.sim.kafkaLag ? 'warn' : 'ok', text: S.sim.kafkaLag ? '消費延遲 4 分鐘' : '消費延遲 < 5 秒' },
      { name: 'TMS License 心跳', level: hb, text: age == null ? '還沒收到呼叫' : '最後一次 ' + Math.round(age / 1000) + ' 秒前', own: true }
    ];
  }

  // source：own＝後台自己就有的資料（MVP 可做）｜tms＝需要 TMS 提供（第二階段，POC 為模擬值）
  function tenantSignals(h) {
    var out = [];
    var failed = S.outbox.filter(function (j) { return j.hotelId === h.id && j.status === 'failed'; }).length;
    var waiting = S.outbox.filter(function (j) { return j.hotelId === h.id && j.status === 'pending'; }).length;
    out.push({ key: 'sync', label: '後台 → TMS 同步', source: 'own',
      level: failed ? 'err' : waiting ? 'warn' : 'ok',
      text: failed ? failed + ' 筆失敗' + (waiting ? '，後面還有 ' + waiting + ' 筆在等' : '') : waiting ? waiting + ' 筆送出中' : '正常',
      why: '後台寫入產品端的請求。失敗時這家飯店後續的設定變更都會卡住' });
    var hb = heartbeatLevel();
    out.push({ key: 'license', label: '授權快取', source: 'own',
      level: hb === 'err' ? 'warn' : hb,
      text: hb === 'err' ? 'TMS 沒來拉授權，飯店可能還在用舊的授權狀態' : hb === 'ok' ? '產品端有定期來拉' : '還沒收到呼叫',
      why: '由 License API 的呼叫紀錄推得；心跳是全產品共用，不是這家飯店獨有' });

    var H = S.health[h.id];
    if (!H) {
      out.push({ key: 'tms', label: 'TMS 健康資料', source: 'tms', level: 'none', text: '剛開通，尚無資料', why: '' });
      return out;
    }
    var pms;
    if (H.pmsMode === 'excel') pms = { level: 'warn', text: 'PMS 已斷線 ' + H.pmsSyncAgoMin + ' 分鐘，正用 Excel 匯入頂替' };
    else if (H.pmsSyncAgoMin > 30) pms = { level: 'err', text: '同步中斷 ' + H.pmsSyncAgoMin + ' 分鐘' };
    else if (H.pmsSyncAgoMin > 10) pms = { level: 'warn', text: H.pmsSyncAgoMin + ' 分鐘前同步' };
    else pms = { level: 'ok', text: H.pmsSyncAgoMin + ' 分鐘前同步（' + (H.pmsMode === 'event' ? '事件訂閱' : '輪詢') + '）' };
    out.push({ key: 'pms', label: 'PMS 同步', source: 'tms', level: pms.level, text: pms.text,
      why: '斷線時當天新入住的房查不到訂單，住客一掃碼就是「請洽櫃檯」' });
    out.push({ key: 'writeback', label: '房況回寫', source: 'tms',
      level: H.writebackFailed ? 'err' : 'ok',
      text: H.writebackFailed ? H.writebackFailed + ' 筆回寫失敗，等人工處理' : '正常',
      why: 'outbox 裡 status＝failed 的 pms_status。查房通過卻沒回寫，房間就賣不出去' });
    out.push({ key: 'realtime', label: '即時推送', source: 'tms',
      level: S.sim.kafkaLag ? 'warn' : H.lagSec > 60 ? 'warn' : 'ok',
      text: S.sim.kafkaLag ? '平台 Kafka 延遲，看板已切成輪詢（所有租戶都受影響）' : '延遲 ' + H.lagSec + ' 秒',
      why: '延遲超過門檻時 TMS 會推 degraded，看板改成每 5 秒輪詢' });
    out.push({ key: 'push', label: '推播', source: 'tms',
      level: H.pushMissingPct >= 30 ? 'warn' : 'ok',
      text: H.pushMissingPct + '% 員工沒開推播',
      why: 'staff_devices.push_token 為空的比例。比例高代表員工收不到派單通知' });
    var live = h.lifecycle === 'live';
    out.push({ key: 'usage', label: '使用活躍度', source: 'tms',
      level: live && H.todayTasks < 10 ? 'warn' : 'ok',
      text: '今日 ' + H.todayTasks + ' 張單・' + H.activeStaff + ' 位員工・' + H.guestScans + ' 次掃碼',
      why: '正式營運卻幾乎沒在用，業務要注意續約風險' });
    out.push({ key: 'scan', label: '掃碼安全', source: 'tms',
      level: H.scanFailures >= 50 ? 'err' : 'ok',
      text: H.scanFailures >= 50 ? '掃碼失敗 ' + H.scanFailures + ' 次，可能有人在猜 QR token' : '失敗 ' + H.scanFailures + ' 次',
      why: '/guest/scan 的失敗次數。暴增代表不是手滑，是有人在試' });
    return out;
  }
  function worst(signals) {
    return signals.reduce(function (acc, s) { return LEVEL_RANK[s.level] > LEVEL_RANK[acc] ? s.level : acc; }, 'none');
  }
  function monitoredHotels() { return S.hotels.filter(function (h) { return h.tenantId && h.lifecycle !== 'suspended'; }); }
  function errTenantCount() { return monitoredHotels().filter(function (h) { return worst(tenantSignals(h)) === 'err'; }).length; }
  function dot(level) { return '<span class="dot ' + (level === 'none' ? '' : level) + '"></span>'; }
  var LEVEL_LABEL = { none: '無資料', ok: '正常', warn: '注意', err: '異常' };
  var LEVEL_PILL = { none: '', ok: 'ok', warn: 'warn', err: 'err' };

  // ── Checklist helpers ───────────────────────────────
  function stepOf(h, key) { return h.checklist.find(function (s) { return s.key === key; }); }
  function markStep(h, key) {
    var s = stepOf(h, key);
    if (s && s.status !== 'done') { s.status = 'done'; s.doneAt = nowTs(); }
  }
  function progress(h) {
    var done = h.checklist.filter(function (s) { return s.status === 'done'; }).length;
    return { done: done, total: h.checklist.length, pct: Math.round(done * 100 / h.checklist.length) };
  }

  // ── Modal ────────────────────────────────────────────
  function openModal(opt) {
    var host = $('#modal-host');
    host.innerHTML = '<div class="modal-backdrop"><form class="modal' + (opt.wide ? ' wide' : '') + '" novalidate>' +
      '<header><h3>' + esc(opt.title) + '</h3><button type="button" class="icon-btn" data-close aria-label="關閉">×</button></header>' +
      '<div class="modal-body">' + opt.body + '</div>' +
      '<footer><button type="button" class="btn btn-secondary" data-close>' + (opt.onSubmit ? '取消' : '關閉') + '</button>' +
      (opt.onSubmit ? '<button type="submit" class="btn ' + (opt.danger ? 'btn-danger' : 'btn-primary') + '">' + esc(opt.submitLabel || '儲存') + '</button>' : '') +
      '</footer></form></div>';
    var form = $('form', host);
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      if (!opt.onSubmit) return;
      var r = opt.onSubmit(form);
      if (r !== false) { closeModal(); save(); render(); }
    });
    host.querySelectorAll('[data-close]').forEach(function (b) { b.addEventListener('click', closeModal); });
    $('.modal-backdrop', host).addEventListener('mousedown', function (e) { if (e.target.classList.contains('modal-backdrop')) closeModal(); });
    if (opt.afterOpen) opt.afterOpen(form);
    var first = form.querySelector('input:not([type=hidden]), select, textarea');
    if (first) first.focus();
  }
  function closeModal() { $('#modal-host').innerHTML = ''; }
  function val(form, name) { var e = form.elements[name]; return e ? String(e.value).trim() : ''; }

  // ── Router ───────────────────────────────────────────
  function route() {
    var parts = (location.hash || '#/dashboard').slice(2).split('/');
    return { page: parts[0] || 'dashboard', id: parts[1], tab: parts[2] };
  }

  function renderNav() {
    var r = route();
    var expiring = S.contracts.filter(function (c) { var st = contractState(c); return st === 'expiring' || st === 'grace'; }).length;
    var approvals = S.approvals.filter(function (a) { return a.status === 'pending'; }).length;
    var items = [
      ['dashboard', '總覽', approvals],

      ['status', '服務狀態', errTenantCount()],
      ['audit', '稽核紀錄', 0],
      ['sep'],

      ['sync', '同步佇列', failedCount()],
      ['license-api', 'License API', 0],
      ['sep'],

    ];
    $('#sidenav').innerHTML = items.map(function (it) {

      if (it[0] === 'label') return '<div class="nav-label">' + it[1] + '</div>';
      var active = r.page === it[0] || (it[0] === 'tenants' && r.page === 'tenant');
      return '<a href="#/' + it[0] + '" class="' + (active ? 'is-active' : '') + '">' + it[1] + (it[2] ? '<span class="nav-count">' + it[2] + '</span>' : '') + '</a>';
    }).join('');
  }

  function renderTop() {
    $('#user-select').innerHTML = S.users.map(function (u) {
      return '<option value="' + u.id + '"' + (u.id === S.currentUser ? ' selected' : '') + '>' + esc(u.name) + '・' + ROLES[u.role].label + '（AD：' + ROLES[u.role].group + '）</option>';
    }).join('');
    $('#today-input').value = S.today;
  }

  function render() {
    renderTop();
    renderNav();
    var r = route();
    var view = VIEWS[r.page] || VIEWS.dashboard;
    $('#main').innerHTML = view(r);
  }

  // 同步佇列推進時只在「不會打斷輸入」的情況下重繪
  function refreshAfterSync() {
    renderNav();
    var r = route();
    var busy = $('#modal-host').innerHTML || (document.activeElement && /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName) && $('#main').contains(document.activeElement));
    if (!busy && ['sync', 'tenant', 'dashboard', 'tenants', 'license-api', 'status'].indexOf(r.page) >= 0) {
      $('#main').innerHTML = (VIEWS[r.page])(r);

  function wireContractForm(f, c) {
    var renderGroupHotels = function () {
      var s = f.elements.scope.value.split(':');

      if (s[0] !== 'group') { box.innerHTML = ''; return; }
      var hs = S.hotels.filter(function (h) { return h.groupId === s[1]; });
      var chosen = c && c.scopeType === 'group' ? c.hotelIds : hs.map(function (h) { return h.id; });
      box.innerHTML = '<span>涵蓋哪些飯店</span><div class="checks">' + hs.map(function (h) { return '<label class="check"><input type="checkbox" name="hotelIds" value="' + h.id + '"' + (chosen.indexOf(h.id) >= 0 ? ' checked' : '') + '> ' + esc(h.name) + '</label>'; }).join('') + '</div>';
    };
    f.elements.scope.addEventListener('change', renderGroupHotels);
    f.elements.plan.addEventListener('change', function () {
      var mods = PLANS[f.elements.plan.value].modules;
      f.querySelectorAll('input[name=modules]').forEach(function (i) { i.checked = mods.indexOf(i.value) >= 0; });
    });
    renderGroupHotels();
  }

  };
  ACTIONS['open-monitor'] = function (el) {
    toast('（示意）會開啟監控工具' + (el.dataset.tenant ? '，並以 tenant_id=' + el.dataset.tenant + ' 篩選' : ''), 'info');
  };
  ACTIONS['sim-event'] = function () {
    var id = $('#main [name=simHotel]').value;
    var ev = $('#main [name=simEvent]').value;
    var H = S.health[id];
    if (!H) H = S.health[id] = { pmsMode: 'event', pmsSyncAgoMin: 1, writebackFailed: 0, lagSec: 2, pushMissingPct: 0, todayTasks: 0, activeStaff: 0, guestScans: 0, scanFailures: 0 };
    if (ev === 'pms_down') { H.pmsMode = H.pmsMode === 'excel' ? 'polling' : H.pmsMode; H.pmsSyncAgoMin = 45; }
    if (ev === 'writeback') H.writebackFailed += 2;
    if (ev === 'scan_attack') H.scanFailures = 240;
    if (ev === 'low_usage') { H.todayTasks = 3; H.guestScans = 0; }
    save(); render();
    toast('已對「' + hotel(id).name + '」觸發事件', 'warning');
  };
  ACTIONS['sim-restore'] = function () {
    S.health = seedHealth();
    // 心跳和同步也受其他頁的模擬開關影響，一併關掉才算「還原」
    S.sim = { apiDown: false, licenseDown: false, productSilent: false, kafkaLag: false };
    save(); render();
    toast('已還原預設情境', 'info');
  };

  // ── 事件委派 ─────────────────────────────────────────
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-action]');
    if (!el || !ACTIONS[el.dataset.action]) return;
    e.preventDefault();
    ACTIONS[el.dataset.action](el);
  });
  document.addEventListener('change', function (e) {
    var el = e.target;
    var kind = el.dataset && el.dataset.change;
    if (!kind) {
      if (el.id === 'user-select') { S.currentUser = el.value; save(); render(); toast('已切換為 ' + me().name + '（' + ROLES[me().role].label + '）', 'info'); }
      else if (el.id === 'today-input' && el.value) { S.today = el.value; save(); render(); }
      else if (el.id === 'color-input' || el.id === 'logo-input') updateBrandPreview();
      return;
    }
    if (kind === 'step-status' || kind === 'step-owner') {
      if (!guard('checklist.write')) { render(); return; }
      var h = hotel(el.dataset.hotel);
      var s = stepOf(h, el.dataset.step);
      var label = STEPS.find(function (x) { return x.key === s.key; }).label;
      if (kind === 'step-status') {
        var before = s.status;
        s.status = el.value;
        s.doneAt = el.value === 'done' ? nowTs() : null;
        audit('更新上線清單', h.id, label, { status: before }, { status: s.status });
      } else {
        var bo = s.owner;
        s.owner = el.value;
        audit('更新上線清單負責人', h.id, label, { owner: userName(bo) }, { owner: userName(s.owner) });
      }
      save(); render();
    } else if (kind === 'audit-filter') {
      auditFilter[el.dataset.key] = el.value;
      render();
    } else if (kind === 'sim-api') {
      S.sim.apiDown = el.checked; save(); render();
      toast(el.checked ? '產品端 API 模擬故障中' : '產品端 API 已恢復，失敗的請求要按「重試」', el.checked ? 'warning' : 'info');
    } else if (kind === 'sim-license') {
      S.sim.licenseDown = el.checked; save(); render();
    } else if (kind === 'sim-silent') {
      S.sim.productSilent = el.checked; save(); render();
      if (el.checked) toast('TMS 停止拉授權，約 15 秒後心跳轉紅', 'warning');
    } else if (kind === 'sim-kafka') {
      S.sim.kafkaLag = el.checked; save(); render();
    }
  });
  function updateBrandPreview() {
    var r = route();
    var h = hotel(r.id);
    if (!h) return;
    var color = $('#color-input').value;
    var file = $('#logo-input').files[0];
    if (!file) { $('#brand-preview').innerHTML = brandPreview(h.name, h.brand.logo, color); return; }
    var rd = new FileReader();
    rd.onload = function () { $('#brand-preview').innerHTML = brandPreview(h.name, rd.result, color); };
    rd.readAsDataURL(file);
  }

  $('#reset-btn').addEventListener('click', function () {
    if (!confirm('重置所有示範資料？')) return;
    S = seed(); save(); auditFilter = { tenant: '', actor: '', from: '', to: '' };
    location.hash = '#/dashboard'; render();
    toast('已重置', 'info');
  });
  window.addEventListener('hashchange', render);
  window.addEventListener('storage', function (e) { if (e.key === KEY) { S = load(); render(); } });
  setInterval(pump, 900);
  // 模擬產品端每 5 秒來拉一次授權（正式環境是 5 到 10 分鐘）；同時讓心跳秒數跟著跳
  // 只重繪「看狀態」的頁面——表單頁每 5 秒重繪會吃掉使用者還沒存的輸入
  function tick() {
    if (!S.sim.productSilent && productPull()) save();
    renderNav();
    var r = route();
    var live = r.page === 'status' || r.page === 'license-api' || (r.page === 'tenant' && r.tab === 'health');
    if (live && !$('#modal-host').innerHTML && !(document.activeElement && /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))) {
      $('#main').innerHTML = VIEWS[r.page](r);
    }
  }
  setInterval(tick, 5000);
  tick();
  render();
})();
</script>
</body>
</html>
