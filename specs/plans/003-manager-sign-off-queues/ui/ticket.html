<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>工務單詳情</title>
<link rel="stylesheet" href="manager.css">
</head>
<body>
<div class="phone" id="phone">
  <div class="statusbar"><span>10:22</span><span>▮▮▮ ▰</span></div>
  <div class="navbar"><button class="back" id="back"></button><span id="navtitle">工務單詳情</span></div>
  <div class="content">
    <div class="tickethead">
      <div class="no" id="no"></div>
      <div class="room" id="room"></div>
      <div class="title" id="title"></div>
      <div class="sub" id="sub"></div>
      <div class="steps" id="steps"></div>
    </div>
    <div class="offlinebar"><span>目前離線</span><span>待同步 0 筆</span></div>
    <div class="statusline" id="status"></div>
    <div class="sectionlabel"><span>報修內容</span></div>
    <div class="card">
      <div class="photos" id="photos"></div>
      <div class="kv"><span class="k">類別</span><span class="v" id="category"></span></div>
      <div class="kv"><span class="k">說明</span><span class="v" id="desc"></span></div>
      <div class="kv"><span class="k">報修人</span><span class="v" id="reporter"></span></div>
      <div class="kv"><span class="k">報修時間</span><span class="v" id="created"></span></div>
    </div>
    <div id="completion"></div>
  </div>
  <div class="actionbar" id="actionbar" style="display:none"><div class="actions" id="actions"></div></div>

  <div class="sheetscrim" id="rejectSheet">
    <div class="sheet">
      <div class="grab"></div>
      <div class="t" id="rejectTitle">退回給報修人</div>
      <div class="s">報修人會在工務單詳情看到這段話，補資料後可以再送出</div>
      <textarea id="reason" placeholder="寫下退回原因，例如：照片看不出哪裡鬆" oninput="onReason()"></textarea>
      <div class="actions"><button class="pill outlined" onclick="hideDialog('rejectSheet')">取消</button><button class="pill" id="rejectSubmit" disabled onclick="doReject()">送出退回</button></div>
    </div>
  </div>
  <div class="scrim" id="offlineDialog"><div class="dialog"><div class="t">目前離線，只能完成進行中的單</div><div class="s">這個動作不會留在手機上補送，恢復連線後請再做一次。</div><button class="ok" onclick="hideDialog('offlineDialog')">知道了</button></div></div>
  <div class="scrim" id="handledDialog"><div class="dialog"><div class="t">這張單已被處理</div><div class="s">可能是另一位主管剛處理過，或報修人撤回了這張單。</div><button class="ok" id="handledOk">知道了</button></div></div>
</div>
<script src="manager.js"></script>
<script>
if (isOffline()) document.getElementById('phone').classList.add('offline');
function go(url) { location.href = carryOffline(url); }
const TICKETS = {
  'W-0201': { room: '202', title: '窗簾掛勾鬆脫', category: '家具設備', desc: '窗簾左側第二個掛勾鬆了，拉的時候會掉', reporter: '阿芳', created: '11/10 09:12', photos: 1, state: 'pending_review', pendingSince: '11/10 09:12', from: 'review' },
  'W-0108': { room: '301', title: '門鎖電池更換', category: '門鎖', desc: '門鎖低電量警示', reporter: '阿芳', created: '11/09 15:30', photos: 1, state: 'done', verified: false, result: '已修好', note: '更換四顆三號電池，刷卡測試三次正常', fixer: '阿強', doneAt: '11/10 09:48', completionPhotos: 1, from: 'verify' },
  'W-0110': { room: '208', title: '水龍頭滴水', category: '水電', desc: '浴室洗手台水龍頭關不緊，一直滴', reporter: '小美', created: '11/09 10:05', photos: 2, state: 'done', verified: false, result: '暫時處理', note: '先鎖緊止水閥，已另開追蹤單換墊片', fixer: '阿強', doneAt: '11/09 16:10', completionPhotos: 1, conflictOnAction: true, from: 'verify' },
  'W-0111': { room: '5 樓製冰機', title: '定期保養', category: '其他', desc: '每月定期保養：清洗濾網、檢查製冰量', reporter: '系統排程', created: '11/10 08:00', photos: 0, scheduled: true, state: 'done', verified: false, result: '已修好', note: '濾網已清洗，製冰量正常', fixer: '阿強', doneAt: '11/10 11:05', completionPhotos: 1, from: 'verify' },
  'W-0202': { room: '306', title: '冷氣不冷', category: '冷氣', desc: '冷氣開到 18 度還是不冷，住客抱怨', reporter: '阿芳', created: '11/10 09:40', photos: 1, urgent: true, state: 'pool' },
  'W-0112': { room: '210', title: '燈管閃爍', category: '水電', desc: '浴室燈管一直閃', reporter: '小林', created: '11/10 08:50', photos: 1, state: 'doing', fixer: '阿強' },
  'W-0204': { room: '211', title: '椅子搖晃', category: '家具設備', desc: '書桌椅左後腳鬆動', reporter: '阿芳', created: '11/10 08:20', photos: 1, state: 'rejected', rejectReason: '照片看不出哪裡鬆' },
  'W-0109': { room: '405', title: '電視遙控器失靈', category: '其他', desc: '遙控器沒反應', reporter: '阿芳', created: '11/08 14:10', photos: 1, state: 'done', verified: true, result: '已修好', note: '更換遙控器', fixer: '阿強', doneAt: '11/08 16:20', completionPhotos: 1, verifiedBy: '王主管', verifiedAt: '11/08 17:02' },
};
const no = TICKETS[Q.get('no')] ? Q.get('no') : 'W-0201';
const t = TICKETS[no];
const backTarget = t.from === 'review' ? 'queue.html?kind=review' : t.from === 'verify' ? 'queue.html?kind=verify' : 'index.html';
const back = document.getElementById('back');
back.textContent = t.from === 'review' ? '待審核' : t.from === 'verify' ? '待驗收' : '首頁';
back.onclick = () => go(backTarget);
document.getElementById('handledOk').onclick = () => go(backTarget);
document.title = `${no} 工務單詳情`;
document.getElementById('no').textContent = no;
document.getElementById('room').textContent = t.room;
document.getElementById('title').textContent = `${t.room} ${t.title}`;
document.getElementById('sub').innerHTML = `${t.urgent ? '<span class="chip urgent">急件</span>' : ''}${t.scheduled ? '<span class="chip scheduled">定期保養</span>' : ''}<span>${t.scheduled ? '系統排程' : t.reporter + ' 報修'}</span><span>·</span><span>${t.category}</span>`;
document.getElementById('category').textContent = t.category;
document.getElementById('desc').textContent = t.desc;
document.getElementById('reporter').textContent = t.reporter;
document.getElementById('created').textContent = t.created;
document.getElementById('photos').innerHTML = t.photos ? Array.from({ length: t.photos }, () => `<div class="photo" data-stamp="${t.created}"></div>`).join('') : '<div class="note" style="padding:0;color:var(--tertiary-label)">沒有報修照片</div>';

/* 步驟條：待開始、維修中、完修、驗收 */
const STEP = ['待開始', '維修中', '完修', '驗收'];
const current = t.state === 'accepted' ? 0 : t.state === 'doing' ? 1 : t.state === 'done' ? (t.verified ? 4 : 3) : -1;
document.getElementById('steps').innerHTML = STEP.map((s, i) => {
  const done = i < current, cur = i === current, pend = i > current || current < 0;
  const dot = done ? '<div class="dot">✓</div>' : cur ? '<div class="dot current"></div>' : '<div class="dot pending"></div>';
  return `<div class="step ${pend && !cur ? 'pending' : ''}">${dot}<span>${s}</span></div>` + (i < 3 ? `<div class="bar ${i < current - 1 || (done && i < current) ? '' : 'pending'}"></div>` : '');
}).join('');

/* 狀態列與動作 */
const status = document.getElementById('status');
const actions = document.getElementById('actions'), bar = document.getElementById('actionbar');
const S = {
  pending_review: () => { status.className = 'statusline warn'; status.textContent = `等主管審核 · ${t.reporter} ${t.pendingSince} 送出`; bar.style.display = ''; actions.innerHTML = `<button class="pill outlined" onclick="openReject()">退回</button><button class="pill" onclick="approve()">核准</button>`; },
  rejected: () => { status.className = 'statusline warn'; status.textContent = `主管未核准 · 退回原因：${t.rejectReason}`; },
  pool: () => { status.className = 'statusline neutral'; status.textContent = '等工務接單'; },
  accepted: () => { status.className = 'statusline neutral'; status.textContent = `已接單 · ${t.fixer}`; },
  doing: () => { status.className = 'statusline'; status.textContent = `維修中 · ${t.fixer}`; },
  done: () => {
    if (t.verified) { status.className = 'statusline'; status.textContent = `已驗收 · ${t.verifiedBy} · ${t.result}`; }
    else { status.className = 'statusline'; status.textContent = `已完修 · 等主管驗收 · ${t.result}`; bar.style.display = ''; actions.innerHTML = `<button class="pill" onclick="verify()">驗收</button>`; }
    document.getElementById('completion').innerHTML = `
      <div class="sectionlabel"><span>完修回報</span></div>
      <div class="card">
        <div class="photos">${Array.from({ length: t.completionPhotos }, () => `<div class="photo" data-stamp="${t.doneAt}"></div>`).join('')}</div>
        <div class="kv"><span class="k">處理結果</span><span class="v">${t.result}</span></div>
        <div class="note">${t.note}</div>
        <div class="kv"><span class="k">完修人</span><span class="v">${t.fixer}</span></div>
        <div class="kv"><span class="k">完修時間</span><span class="v">${t.doneAt}</span></div>
        ${t.verified ? `<div class="kv"><span class="k">驗收</span><span class="v">${t.verifiedBy} · ${t.verifiedAt}</span></div>` : ''}
      </div>`;
  },
};
S[t.state]();

function guard() {
  if (isOffline()) { showDialog('offlineDialog'); return false; }
  if (t.conflictOnAction) { Done.add(no); showDialog('handledDialog'); return false; }
  return true;
}
function approve() { if (!guard()) return; Done.add(no); go('queue.html?kind=review'); }
function verify() { if (!guard()) return; Done.add(no); go('queue.html?kind=verify'); }
function openReject() { document.getElementById('rejectTitle').textContent = `退回給 ${t.reporter}`; showDialog('rejectSheet'); setTimeout(() => document.getElementById('reason').focus(), 50); }
function onReason() { document.getElementById('rejectSubmit').disabled = !document.getElementById('reason').value.trim(); }
function doReject() { if (!guard()) return; Done.add(no); go('queue.html?kind=review'); }
</script>
</body>
</html>
