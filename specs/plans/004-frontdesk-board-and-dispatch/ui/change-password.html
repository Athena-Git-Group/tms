<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>設定新密碼 · TMS 櫃檯</title>
  <link rel="stylesheet" href="desk.css" />
</head>
<body data-page="password">
  <main class="auth">
    <div class="auth-top">
      <button class="lang-btn" id="langBtn" data-t-label="語言" aria-label="語言" aria-haspopup="menu" aria-expanded="false">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>
        <span id="langName">繁體中文</span>
      </button>
      <div class="menu" id="langMenu" role="menu" data-t-label="語言" aria-label="語言" hidden></div>
    </div>
    <div class="auth-body">
      <form class="auth-col" id="form" novalidate>
        <div class="auth-head">
          <span class="app-mark" aria-hidden="true">
            <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5"/><circle cx="12" cy="10.5" r="2.2"/><path d="M8 16.5a4 4 0 0 1 8 0"/></svg>
          </span>
          <div>
            <h1 class="auth-title" style="margin:0">設定新密碼</h1>
            <div class="auth-note">你是用臨時密碼登入的，先改成自己的密碼才能繼續。</div>
          </div>
        </div>
        <div class="stack-8">
          <div class="field-card">
            <div class="field">
              <label for="nw" data-t="新密碼">新密碼</label>
              <input id="nw" type="password" autocomplete="off" maxlength="32" />
              <button type="button" class="eye" id="eye1" aria-label="顯示密碼"></button>
            </div>
            <div class="field">
              <label for="cf" data-t="確認密碼">確認密碼</label>
              <input id="cf" type="password" autocomplete="off" maxlength="32" />
              <button type="button" class="eye" id="eye2" aria-label="顯示密碼"></button>
            </div>
          </div>
          <span class="form-err" id="err" role="alert" hidden></span>
          <ul class="rules" id="rules">
            <li data-t="至少 8 碼">至少 8 碼</li>
            <li data-t="包含英文字母">包含英文字母</li>
            <li data-t="包含數字">包含數字</li>
            <li data-t="兩次輸入相同">兩次輸入相同</li>
          </ul>
        </div>
        <div class="stack-4">
          <button type="submit" class="btn-primary" id="submit" data-t="更新密碼" disabled>更新密碼</button>
          <button type="button" class="btn-link" id="logout" data-t="登出">登出</button>
        </div>
      </form>
    </div>
  </main>
  <script src="desk.js"></script>
</body>
</html>
