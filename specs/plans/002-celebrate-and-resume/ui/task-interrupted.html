<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>308 的任務頁</title>
<link rel="stylesheet" href="celebrate.css">
</head>
<body>
<div class="phone">
  <div class="statusbar"><span>10:22</span><span>▮▮▮ ▰</span></div>
  <div class="navbar"><button class="back">&lsaquo;</button>308 的任務頁<button class="trailing">報修</button></div>
  <div class="taskbody"><div class="taskscroll">
    <div class="taskhead">
      <div class="roomno"><span>308</span><span class="elapsed">已做 15 分</span></div>
      <div class="tasktitle">308 補備品</div>
      <div class="tasksub">住客掃碼</div>
      <div class="steps">
        <div class="step"><div class="dot">✓</div><span>已接</span></div>
        <div class="bar"></div>
        <div class="step"><div class="dot current"></div><span>進行中</span></div>
        <div class="bar pending"></div>
        <div class="step pending"><div class="dot pending"></div><span>送達</span></div>
      </div>
    </div>
    <span class="chip">已中斷</span>
    <div class="infocard">備品車缺枕頭套，等補貨</div>
    <div class="sectionlabel">這間房的資訊</div>
    <div class="infocard">工務單詳情</div>
    </div>
    <div class="actionbar"><button class="pill" onclick="resume()">恢復處理</button></div>
  </div>
  <script>
  function resume(){
    document.querySelector('.chip').remove();
    document.querySelector('.infocard').remove();
    document.querySelector('.actionbar').innerHTML =
      '<button class="pill outlined">中斷</button><button class="pill">完成</button>';
  }
  </script>
</div>
</body>
</html>
