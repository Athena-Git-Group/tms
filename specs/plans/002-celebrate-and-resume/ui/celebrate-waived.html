<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>310 完成</title>
<link rel="stylesheet" href="celebrate.css">
</head>
<body>
<div class="phone">
  <div class="statusbar"><span>10:22</span><span>▮▮▮ ▰</span></div>
  <div class="navbar"><button class="back">&lsaquo;</button>310 的任務頁<button class="trailing">報修</button></div>
  <div class="taskbody"><div class="taskscroll">
    <div class="taskhead">
      <div class="roomno"><span>310</span><span class="elapsed">已做 18 分</span></div>
      <div class="tasktitle">310 續住整理</div>
      <div class="tasksub">自動化規則 · 預估 20 分</div>
      <div class="steps">
        <div class="step"><div class="dot">✓</div><span>已接</span></div>
        <div class="bar"></div>
        <div class="step"><div class="dot">✓</div><span>進行中</span></div>
        <div class="bar"></div>
        <div class="step"><div class="dot">✓</div><span>完成</span></div>
        <div class="bar"></div>
        <div class="step"><div class="dot current"></div><span>免查房</span></div>
      </div>
    </div>
    <span class="chip">免查房</span>
    <div class="sectionlabel">這間房的資訊</div>
    <div class="infocard">工務單詳情</div>
    </div>
  </div>
  <div class="scrim">
    <div class="dialog">
      <div class="banner"></div>
      <span class="confetti" style="left:34px;top:92px;width:10px;height:10px;border-radius:3px;background:var(--brand-accent-vivid);animation-delay:0s"></span>
      <span class="confetti" style="left:72px;top:110px;width:8px;height:8px;border-radius:999px;background:var(--brand-primary);animation-delay:.3s"></span>
      <span class="confetti" style="right:48px;top:100px;width:10px;height:10px;border-radius:999px;background:var(--brand-accent-soft);animation-delay:.6s"></span>
      <span class="confetti" style="right:86px;top:116px;width:8px;height:8px;border-radius:2px;background:var(--system-green);animation-delay:.9s"></span>
      <div class="check"><svg width="48" height="48" viewBox="0 0 24 24" fill="none"><path d="M7 12.25 10.25 15.5 17 8.75" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <h1 class="headline">310 完成！</h1>
      <p class="subline">免查房，直接完成</p>
      <div class="tiles">
        <div class="tile time"><div class="cap">實際／預估</div><div class="val">18<span class="est"> / 20 分</span></div></div>
        <div class="tile today"><div class="cap">今日進度</div><div class="val">第 5 單</div></div>
      </div>
      <button class="primary" onclick="location.href='index.html'">下一間：311</button>
      <button class="ghost" onclick="location.href='index.html'">回到首頁</button>
    </div>
  </div>
