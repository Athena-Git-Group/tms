<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>302 完成</title>
<link rel="stylesheet" href="celebrate.css">
</head>
<body>
<div class="phone">
  <div class="statusbar"><span>10:22</span><span>▮▮▮ ▰</span></div>
  <div class="navbar"><button class="back">&lsaquo;</button>302 的任務頁<button class="trailing">報修</button></div>
  <div class="taskbody"><div class="taskscroll">
    <div class="taskhead">
      <div class="roomno"><span>302</span><span class="elapsed">已做 25 分</span></div>
      <div class="tasktitle">302 退房打掃</div>
      <div class="tasksub">自動化規則 · 預估 30 分</div>
      <div class="steps">
        <div class="step"><div class="dot">✓</div><span>已接</span></div>
        <div class="bar"></div>
        <div class="step"><div class="dot">✓</div><span>進行中</span></div>
        <div class="bar"></div>
        <div class="step"><div class="dot current"></div><span>完成</span></div>
        <div class="bar pending"></div>
        <div class="step pending"><div class="dot pending"></div><span>查房</span></div>
      </div>
    </div>
    <span class="chip">待查房</span>
    <div class="sectionlabel">這間房的資訊</div>
    <div class="infocard">工務單詳情</div>
    </div>
  </div>
  <div class="scrim">
    <div class="dialog quiet">
      <h1 class="headline">302 完成！</h1>
      <p class="subline">已通知主管查房</p>
      <div class="tiles single">
        <div class="tile time"><div class="cap">實際／預估</div><div class="val">25<span class="est"> / 30 分</span></div></div>
      </div>
      <button class="primary" onclick="location.href='index.html'">下一間：303</button>
      <button class="ghost" onclick="location.href='index.html'">回到首頁</button>
    </div>
  </div>
</div>
