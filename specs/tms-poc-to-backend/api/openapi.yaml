components:
  schemas:
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          example: VALIDATION_FAILED
        message:
          type: string
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              issue:
                type: string
    tenants:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: 即各表 tenant_id（docs/12 例外二：集中開設、量少，8 bytes 省索引）
        name:
          type: string
          description: 飯店名
        createdAt:
          type: string
          format: date-time
      description: 租戶（飯店）主檔。v1 由營運人工開設。
      required:
      - id
      - name
      - createdAt
    tenantsRequest:
      type: object
      properties:
        name:
          type: string
          description: 飯店名
      required:
      - name
    tenant_config:
      type: object
      properties:
        tenantId:
          type: integer
          format: int64
        key:
          type: string
          description: 封閉鍵集：standard_cleaning_minutes|shift_capacity|inspection_items|sop_items|guest_info_pages|request_menu|minutes_per_credit|classification_rules|scan_fail_threshold|low_rating_threshold|shift_times|retention_days
        value:
          type: string
          description: 結構依 key 而異
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          type: string
          format: uuid
          description: → staff_accounts；設定變更要能追
      description: 「什麼都可調」的落地。inspection_items/sop_items 兩鍵為 sop_items 表的門面（讀寫轉進表）。
      required:
      - tenantId
      - key
      - value
      - updatedAt
    tenant_configRequest:
      type: object
      properties:
        tenantId:
          type: integer
          format: int64
        key:
          type: string
          description: 封閉鍵集：standard_cleaning_minutes|shift_capacity|inspection_items|sop_items|guest_info_pages|request_menu|minutes_per_credit|classification_rules|scan_fail_threshold|low_rating_threshold|shift_times|retention_days
        value:
          type: string
          description: 結構依 key 而異
      required:
      - tenantId
      - key
      - value
    staff_accounts:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: integer
          format: int64
        name:
          type: string
          description: PII：離職去識別化換不可回推代號
        loginId:
          type: string
          description: PII；UNIQUE (tenant_id, login_id)
        passwordHash:
          type: string
          description: bcrypt/argon2，絕不存明文
        role:
          type: string
          description: 'CHECK: frontdesk|housekeeping|engineering|manager|owner'
        dept:
          type: string
          description: 'CHECK: housekeeping|engineering|frontdesk；主管/老闆可空'
        active:
          type: boolean
          description: 停用=不能登入，歷史保留
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      description: 員工帳號。角色×動作矩陣在程式/設定，不在表裡（docs/11 需求 15）。
      required:
      - id
      - tenantId
      - name
      - loginId
      - passwordHash
      - role
      - active
      - createdAt
      - updatedAt
    staff_accountsRequest:
      type: object
      properties:
        tenantId:
          type: integer
          format: int64
        name:
          type: string
          description: PII：離職去識別化換不可回推代號
        loginId:
          type: string
          description: PII；UNIQUE (tenant_id, login_id)
        passwordHash:
          type: string
          description: bcrypt/argon2，絕不存明文
        role:
          type: string
          description: 'CHECK: frontdesk|housekeeping|engineering|manager|owner'
        dept:
          type: string
          description: 'CHECK: housekeeping|engineering|frontdesk；主管/老闆可空'
        active:
          type: boolean
          description: 停用=不能登入，歷史保留
      required:
      - tenantId
      - name
      - loginId
      - passwordHash
      - role
      - active
    staff_devices:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: integer
          format: int64
        staffId:
          type: string
          format: uuid
        deviceFingerprint:
          type: string
          description: 只做去重，不做綁定（docs/11 不在範圍內）
        pushToken:
          type: string
          description: APNS/FCM 地址；權限被關即空
        registeredAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
          description: 登出或推播服務回報失效時標記
      description: 推播地址簿：一列=一台裝置。登入不驗裝置、多機合法。
      required:
      - id
      - tenantId
      - staffId
      - deviceFingerprint
      - registeredAt
    staff_devicesRequest:
      type: object
      properties:
        tenantId:
          type: integer
          format: int64
        staffId:
          type: string
          format: uuid
        deviceFingerprint:
          type: string
          description: 只做去重，不做綁定（docs/11 不在範圍內）
        pushToken:
          type: string
          description: APNS/FCM 地址；權限被關即空
        registeredAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
          description: 登出或推播服務回報失效時標記
      required:
      - tenantId
      - staffId
      - deviceFingerprint
      - registeredAt
    rooms:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: integer
          format: int64
        roomNo:
          type: string
          description: 房號「305」
        floor:
          type: integer
          format: int32
          description: v1 排房演算法排序鍵
        roomType:
          type: string
          description: 平均打掃分鐘按它統計
        hkState:
          type: string
          description: 'TMS 擁有。CHECK: dirty|cleaned|inspected|out_of_order'
        occupancy:
          type: string
