openapi: 3.0.3
info:
  title: TMS 任務交辦系統 API
  version: 1.0.0
servers:
- url: /api/v1
tags:
- name: 主管手動上報 API
  description: 「出事才響」的第二個來源：主管手動上報，排 owner 推播進 outbox。無持久化實體（事件與推播留痕）。
- name: 排房計畫 API
  description: 查當日計畫、手動調整（If-Match 版本，衝突 409 附最新）、發佈（同交易切換＋任務對帳）、重產（新草稿與現行並存）、人力缺口試算。
- name: 老闆儀表板 API
  description: 讀 worker 預算好的每日數字卡片與摘要，API 只讀不現算；取消單一律排除。
- name: 住客掃碼 API
  description: 掃房間 QR 換住客 session。空房或 token 已作廢回 409 room_vacant；驗證=未過期且未撤銷。
- name: 交班單 API
  description: 查看凍結快照（班末排程產生、之後任務再變快照不變）與簽收。
- name: 查房 API
  description: 主管逐項判定（items 須涵蓋租戶查房項目全集）。全過→inspected＋排 PMS 回寫；任一不過→退回 accepted（redo+1、清計時與 SOP）；自清自查 403；原清房者已下班→連動退池。
- name: 請假 API
  description: 登記請假即觸發連鎖：該員 accepted 單自動退池、doing 單標中斷並回傳受影響清單給主管收尾。
- name: 遺失物 API
  description: 櫃檯登記拾獲（拾獲人留痕；照片外存、事件只記 hasPhoto）與歸還結案。
- name: 通知板 API
  description: 櫃檯發通知（部門/個人混選，推播經 outbox 展開一人一封）、收件人開啟即記已讀、發送者查已讀名單。
- name: 訂房檔副本與房態匯入 API
  description: PMS 唯讀快取查詢＋Excel/CSV 今日房態匯入（入住＋退房；逐列驗房號；reservation_ref 合成 excel:日期:房號）。
- name: 房間記憶與問一下 API
  description: 查這間房的往事（修過什麼、偏好）；ask 為 MVP 降級版（room_memory＋SOP 關鍵字比對，LLM 留椿）。
- name: 房間 QR 憑證 API
  description: 列印現行 QR 與重產輪替。輪替同一交易作廢舊 token 並連坐撤銷該房全部住客 session（E-18）。
- name: 房間 API
  description: 房間主檔查詢（房況板）。hk_state 由任務引擎改、occupancy 由 PMS 同步改，本 API 只讀。
- name: SOP 與查房項目 API
  description: 唯讀清單（applies_to 區分 cleaning/inspection）；寫入走租戶設定門面，不另開寫入端點以免雙寫。
- name: 員工帳號與登入 API
  description: 帳密登入換 JWT（TTL 12h），同時登記推播裝置（同裝置去重）；帳號停用即不能登入但歷史保留。
- name: 任務事件流水帳 API
  description: 只進不改的事件歷程查詢（單任務歷程、全序排查）。增量訂閱一律走 Kafka，本 API 僅供查閱。
- name: 任務 API
  description: 任務建立、認領/開始/完成兩段回報、櫃檯判讀、住客收回與評分、主管改派/退池/延後/取消。所有狀態轉移經任務引擎守衛（非法轉移 409 state_conflict）。
- name: 租戶設定 API
  description: 封閉鍵集合的讀寫（含住客資訊頁 guest-home 的前台讀取面）；sop_items/inspection_items 兩鍵為 sop_items 表的門面。
