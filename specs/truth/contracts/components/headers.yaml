RateLimitLimit:
  description: 同一房在任何 10 分鐘內最多能送幾筆需求（目前是 3）。
  schema:
    type: integer
RateLimitRemaining:
  description: >-
    住客這次住宿還能送幾筆需求：3 減去這次住宿建立時間在現在往前 10 分鐘內的需求張數（已取消的也算）。
    櫃檯替這間房代開的單住客看不到，不從這裡扣；後端擋單時連它一起算，所以這裡不是 0 時再送仍可能回 429，
    是 0 時再送一定回 429。
  schema:
    type: integer
    minimum: 0
RateLimitReset:
  description: >-
    再過幾秒會釋出上面算進去的需求裡最早那一筆佔用的名額（無條件進位到整秒）；沒有名額被佔用時是 0。
    限流是滑動的 10 分鐘，名額一筆一筆釋出，不是到點一次重置。
  schema:
    type: integer
    minimum: 0
