DeskBoard:
  type: object
  description: >-
    櫃檯看板的一次讀取：全館看板範圍內的每一張單、飯店有哪些樓層、登入者自己今天的派單與當場回答張數，以及後端現在的時間。
    總覽看板、待派單頁、側欄徽章、數量卡、欄頭數量與警示、未結案張數都從這一份算，不另有統計介面。
  required:
  - serverTime
  - businessDate
  - floors
  - tasks
  - myToday
  properties:
    serverTime:
      type: string
      format: date-time
      description: >-
        後端產生這份回應的時間。畫面記下「這個時間 − 裝置時間」的差，之後所有「等 N 分」「N 分鐘前」都用校正後的現在去算，
        櫃檯電腦的時鐘不準也不會算錯。
    businessDate:
      type: string
      format: date
      description: >-
        後端認定的「今天」（飯店當地日期，目前等於伺服器時區的日期）。看板範圍、今日張數與頁副標的日期都以它為準。
        換日規則：後端拿自己的時鐘，換成伺服器時區的日曆日期，就是 businessDate；所以在伺服器時區的半夜 00:00 換到隔天，
        飯店沒有另外設定的換日時刻。serverTime 的時差（例如 +08:00）就是伺服器時區的時差。
        畫面據此自己算出下一次換日時刻：businessDate 的隔天 00:00，時差照 serverTime；用校正後的現在（見 serverTime）去等，
        到了就重抓整份看板，不必等訊號。讀回來的 businessDate 還是舊的（例如兩邊時鐘差了幾秒），一分鐘後再抓一次，直到換過去為止。
        每次讀到新的一份看板，就照它的 businessDate 與 serverTime 重新算下一次換日時刻。
    floors:
      type: array
      items:
        type: integer
        format: int32
      description: 這家飯店有的樓層，由低到高、不重複（取自房間主檔）。樓層泳道照它列出每一層，那一層沒有單也要有一列。
    tasks:
      type: array
      items:
        $ref: '#/DeskTask'
      description: >-
        看板範圍內的全部單，一次回完、不分頁。範圍＝還沒結束的單（tasks.ended_at 為空，不限日期）加上今天結束的單（ended_at 落在 businessDate）。
        備品、其他類的完成與當場回答在完成當下就算結束，所以昨天完成的備品單不會出現；等查房的打掃單與等驗收的工務單還沒結束，不限日期。
        回傳順序是建立時間新的在前，只為了讓每次回應穩定；各欄的顯示順序由畫面自己排。
    myToday:
      $ref: '#/DeskMyToday'
DeskMyToday:
  type: object
  description: 登入者本人今天的兩個張數，待派單頁的空狀態用。「今天」同 DeskBoard.businessDate。
  required:
  - assignedCount
  - answeredCount
  properties:
    assignedCount:
      type: integer
      format: int32
      minimum: 0
      description: 今天派出的張數：本人今天的 triaged 事件，扣掉緊接著被 triage_undone 復原的。同一張單派出、復原、再派出只算最後那一次。
    answeredCount:
      type: integer
      format: int32
      minimum: 0
      description: 今天當場回答的張數：本人今天的 answered 事件。
DeskTask:
  type: object
  description: >-
    櫃檯視角的一張單，看板卡片與待派單列用。時間一律是時刻，畫面自己換算成「等 N 分」「接 N 分」「做 N 分」「停 N 分」。
    不帶急件標記，櫃檯畫面不顯示急件、也不依急件改變任何規則。
  required:
  - id
  - displayNo
  - state
  - answered
  - dept
  - type
  - source
  - roomNo
  - floor
  - vip
  - title
  - guestTyped
  - createdAt
  - updatedAt
  - seq
  properties:
    id:
      type: string
      format: uuid
      description: 任務 id。開詳情、派單、復原、當場回答都用它。
    seq:
      type: integer
      format: int32
      minimum: 0
      description: >-
        這張卡片是這張單第幾步的樣子（讀取當下的 tasks.event_seq），每多一筆事件就加 1。
        櫃檯 Web 用它判斷員工事件串流送來的卡片比畫面上新還是舊：新的換上，一樣或舊的不理。
        看板讀取、單筆詳情、派單、復原、當場回答的回應都帶它，畫面拿到任何一份都可以用同一條規則更新那張卡片。
    displayNo:
      type: string
      description: 給人看的單號，一張單只有一個。type 為 repair 的單是工務單號（repair_tickets.ticket_no，例 W-0132），其餘類型是 tasks.task_no（例 T-1053）。
      example: T-1053
    state:
      type: string
      enum:
      - triage
      - pool
      - accepted
      - doing
      - done
      - inspected
      - closed
      - deferred
      - interrupted
      - cancelled
      description: >-
        任務的狀態，就是資料上的十個值。看板的 8 個欄與 13 種狀態標籤由畫面依 state、type、answered、inspection、endedAt 分組，不是新的狀態值。
        「已完成」欄只放完成了、還在等查房或等驗收的單（state 為 done 且 endedAt 為 null）；後端已經結束的單（endedAt 有值）一律放「已結案」欄，
        包括查房通過、免查房、工務單結案、當場回答、取消，以及完成的備品與其他類的單（state 還是 done，但完成當下就結束）。
    answered:
      type: boolean
      description: 這張單是不是櫃檯當場回答結案的（tasks.answer 有值）。true 時 state 一定是 done、endedAt 一定有值，畫面把它放進「已結案」欄、標成「已回答」。
    dept:
      type: string
      enum:
      - housekeeping
      - engineering
      - frontdesk
      description: 目前歸屬的部門。待派單與當場回答的單是 frontdesk，畫面顯示成「未分部門」。
    type:
      type: string
      enum:
      - amenity
      - repair
      - cleaning
      - other
    source:
      type: string
      enum:
      - guest
      - desk
      - system
      - staff
      description: 來源。guest 住客掃碼、desk 櫃檯開單、system 系統建立（排房或自動化規則）、staff 同仁報修。
    roomNo:
      type: string
      example: '305'
    floor:
      type: integer
      format: int32
    vip:
      type: boolean
      description: 這張單的住客是不是 VIP。住客的認定見 guestName。
    guestName:
      type: string
      nullable: true
      description: >-
        這張單的住客姓名。單有連結訂房（tasks.reservation_id）時取那筆訂房；沒有連結時取這間房現在住著的訂房
        （入住時間已到、退房時間未到、沒有被取代）。兩者都沒有就是 null，畫面顯示「空房」。
    title:
      type: string
      description: 任務標題（tasks.title）。住客打字的需求請看 guestText。
    guestTyped:
      type: boolean
      description: 是不是住客自己打字送出的需求（不是點選單）。true 時畫面把標題用「」包起來，並且一定帶 guestText。
    guestText:
      type: object
      nullable: true
      allOf:
      - $ref: '#/DeskGuestText'
    menuKey:
      type: string
      nullable: true
      description: >-
        這張單對應的品項鍵（tasks.note 的 menu_key），代開單面板的類似單提醒用它判斷「同一個品項」：兩張單的 menuKey 一字不差相等才算。
        住客在掃碼頁勾選的單是那個選單項目的鍵；櫃檯代開的品項單（含開成工務單的工務品項）是 DeskMenuKey 的鍵；
        住客打字、比對到帶品項鍵的分類規則的單是那條規則的品項鍵（派給工務、變成工務單之後照樣帶）。
        給其他需求的代開單、沒有對應到品項的住客打字單、系統建的單與同仁報修的工務單為 null。
        值不限於 DeskMenuKey 的 12 個：住客選單的項目（例如「衣架」「吹風機」或飯店自訂的項目）也會出現，畫面只拿它和 DeskMenuKey 比對。
        看板讀取、單筆詳情、派單、復原、當場回答、代開單的回應與員工事件串流的卡片都帶它。
      example: 毛巾
    assigneeId:
      type: string
      format: uuid
      nullable: true
    assigneeName:
      type: string
      nullable: true
      description: 負責人姓名；沒有負責人為 null。
    createdAt:
      type: string
      format: date-time
      description: 建立時間。待派單的等待時間從這裡起算。
    waitingSince:
      type: string
      format: date-time
      nullable: true
      description: >-
        等待時間的起算時刻，只有 triage 與 pool 有值。triage 等於 createdAt。pool 是這張單 created 與 returned_to_pool
        兩種事件中最新一筆的時間，與待認領清單（listDeptPool）、未接提醒同一把尺；櫃檯派單記的是 triaged、不在這兩種之內，
        所以櫃檯派出的單仍從住客送出起算。等待膠囊、逾時、欄頭警示、「等最久」與待認領欄的排序都用它。
    acceptedAt:
      type: string
      format: date-time
      nullable: true
      description: 這張單到目前負責人手上的時間（最近一筆 claimed、assigned 或 reassigned 事件的時間）。state 為 accepted 時必有值，「接 N 分」用它。
    acceptedVia:
      type: string
      nullable: true
      enum:
      - plan_assigned
      - self_claimed
      - manager_assigned
      - reassigned
      description: >-
        這張單怎麼到目前負責人手上，state 為 accepted 時必有值，依最近一筆 claimed、assigned 或 reassigned 事件判定：
        plan_assigned＝系統指派（assigned 事件的操作者是系統，例如班前排房），膠囊顯示「今日排房」；
        self_claimed＝同仁自己認領；manager_assigned＝主管從待認領指派給他；reassigned＝被轉派給他。後三種膠囊顯示「接 N 分」。
        不能用 source 是不是 system 來猜：系統建的單退回待認領後被人認領，就不是系統指派。
    startedAt:
      type: string
      format: date-time
      nullable: true
      description: 第一次開工的時間。進行中的「做 N 分」與「開始於 HH:mm」用它。
    doneAt:
      type: string
      format: date-time
      nullable: true
      description: 完成時間。「已完成」欄的膠囊與完成的備品、其他類單的狀態訊息用它。
    interruptedAt:
      type: string
      format: date-time
      nullable: true
      description: 最近一次中斷的時間，state 為 interrupted 時必有值，「停 N 分」用它。
    endedAt:
      type: string
      format: date-time
      nullable: true
      description: >-
        這張單走到終點的時間（tasks.ended_at）；還沒結束為 null。畫面用它分「已完成」與「已結案」兩欄：有值就在「已結案」欄。
        「已結案」欄的膠囊與取消時間也用它。
    updatedAt:
      type: string
      format: date-time
      description: 最後更新時間。待派單、待認領以外的欄用它排序。
    inspection:
      type: string
      nullable: true
      enum:
      - passed
      - waived
      - failed
      description: 打掃單的查房結果。state 為 inspected 時，passed 顯示「查房通過」，waived 顯示「免查房」。
    sop:
      type: object
      nullable: true
      description: 清潔 SOP 的進度。只有 type 為 cleaning 且 state 為 accepted、doing 或 interrupted、飯店又有啟用的清潔 SOP 項目時有值，其餘為 null。
      required:
      - done
      - total
      properties:
        done:
          type: integer
          format: int32
          minimum: 0
          description: 已勾選的項數；跳過的不算。
        total:
          type: integer
          format: int32
          minimum: 0
          description: 這張單適用的清潔 SOP 總項數。
    interruption:
      type: object
      nullable: true
      description: 中斷的說明，state 為 interrupted 時必有值。
      required:
      - bySelf
      properties:
        bySelf:
          type: boolean
          description: true＝負責人自己暫停；false＝其他原因造成（例如請假）。
        reason:
          type: string
          nullable: true
          description: 停住原因（tasks.hold_reason）：本人填的原因，或系統記的「等工務：<類別>」「工務已修好：<類別>」。
        handoverNote:
          type: string
          nullable: true
          description: 交代做到哪（tasks.requeue_note）；沒有交代為 null，畫面顯示「—」。
    deferral:
      type: object
      nullable: true
      description: >-
        延後的說明，state 為 deferred 時必有值。主管延後只有「誰延後的」；不帶延後到幾點，也不帶主管延後的原因，
        膠囊一律是「待重排」。
      required:
      - bySelf
      properties:
        bySelf:
          type: boolean
          description: true＝負責人自己延後；false＝主管延後。
        byName:
          type: string
          nullable: true
          description: 延後的人的姓名（最近一筆 deferred 事件的操作者）。
        reason:
          type: string
          nullable: true
          description: 本人延後時填的原因（tasks.hold_reason）；主管延後為 null。
DeskGuestText:
  type: object
  description: 住客打字的需求原文，以及單上既有的翻譯內容。後端不產生翻譯，只把單上已經有的帶出來。
  required:
  - original
  properties:
    original:
      type: string
      description: 住客打的原文全文。
    lang:
      type: string
      nullable: true
      description: 原文的語言代碼，例如 ja、en；單上沒有記為 null。
      example: ja
    translated:
      type: string
      nullable: true
      description: >-
        翻譯後的文字，取自 tasks.note 裡既有的 llm_translated；單上沒有就是 null。有值時畫面用它當標題、
        另外顯示原文列與「已翻譯」；null 時只顯示原文。
DeskTaskDetail:
  description: 櫃檯視角的單筆詳情：卡片上已有的資料，加上詳情面板與當場回答面板才需要的內容與歷程。
  allOf:
  - $ref: '#/DeskTask'
  - type: object
    required:
    - serverTime
    - timeline
    properties:
      serverTime:
        type: string
        format: date-time
        description: 後端產生這份回應的時間，用途同 DeskBoard.serverTime。
      answer:
        type: string
        nullable: true
        description: 櫃檯當場回答的回覆全文（tasks.answer）；不是當場回答的單為 null。
      answeredByName:
        type: string
        nullable: true
        description: 當場回答的櫃檯人員姓名（answered 事件的操作者）。
      guest:
        type: object
        nullable: true
        description: 這張單的住客（認定方式同 DeskTask.guestName）；空房為 null。訂房資料沒有住客人數，所以不帶人數。
        required:
        - name
        - checkinDate
        - checkoutDate
        properties:
          name:
            type: string
          checkinDate:
            type: string
            format: date
          checkoutDate:
            type: string
            format: date
      createdByName:
        type: string
        nullable: true
        description: 開單人姓名（created 事件的操作者）。source 為 desk 或 staff 時有值，「櫃檯代開（姓名）」「同仁報修（姓名）」用它；住客與系統建的單為 null。
      accepted:
        type: object
        nullable: true
        description: 已接的說明要用的資料，state 為 accepted 時必有值；via 與 at 等於 DeskTask 的 acceptedVia、acceptedAt。
        required:
        - via
        - at
        properties:
          via:
            type: string
            enum:
            - plan_assigned
            - self_claimed
            - manager_assigned
            - reassigned
          at:
            type: string
            format: date-time
          byName:
            type: string
            nullable: true
            description: 指派或轉派的操作者姓名；via 為 manager_assigned 或 reassigned 時有值。
          previousAssigneeName:
            type: string
            nullable: true
            description: 轉派前的負責人姓名；via 為 reassigned 時有值。
      cancellation:
        type: object
        nullable: true
        description: 取消的說明，state 為 cancelled 時必有值。取消的時間是 endedAt。
        required:
        - reason
        properties:
          reason:
            type: string
            enum:
            - guest_withdrew
            - manager_void
            - plan_superseded
            - staff_withdrew
          byName:
            type: string
            nullable: true
            description: 取消的人的姓名（cancelled 事件的操作者）：主管作廢是那位主管，同仁撤回是報修人；住客收回與排房被取代為 null。
      repair:
        type: object
        nullable: true
        description: 工務單才有的兩項，type 為 repair 時有值。
        properties:
          resolutionType:
            type: string
            nullable: true
            enum:
            - fixed
            - temporary
            - cannot_fix
            - no_action_needed
            description: 完修結果；還沒完修為 null。closed 且為 no_action_needed 時顯示「已結案 · 不需處理」。
          verifiedByName:
            type: string
            nullable: true
            description: 驗收通過的主管姓名；還沒驗收通過為 null。closed 且有值時顯示「已結案 · {主管}驗收」。
      timeline:
        type: array
        items:
          $ref: '#/DeskTimelineEntry'
        description: >-
          這張單的歷程，由舊到新。來源是 task_events，但有兩種不回：被復原的派單與那一筆復原（triaged 與緊接其後的 triage_undone
          成對略過，讀起來就是派單前的樣子）；逐項勾 SOP 的 sop_checked（進度看 sop）。其餘事件照實回，畫面依 type 與 detail 組成各語言的句子；
          畫面沒有對應句子的事件種類就不顯示那一筆。
DeskTimelineEntry:
  type: object
  description: 歷程的一筆。句子由畫面組，後端只給組句子要的資料；住客與同仁輸入的文字原樣帶出。
  required:
  - seq
  - at
  - type
  - actor
  properties:
    seq:
      type: integer
      format: int32
      description: 這張單的第幾步（task_events.seq）。被略過的事件會留下跳號。
    at:
      type: string
      format: date-time
    type:
      type: string
      description: 事件種類，值同 task_events.type（例如 created、triaged、answered、claimed、started、completed、inspection_passed、cancelled）。
    actor:
      type: object
      required:
      - kind
      properties:
        kind:
          type: string
          enum:
          - guest
          - system
          - staff
          description: 操作者是住客、系統還是同仁。
        role:
          type: string
          nullable: true
          enum:
          - frontdesk
          - housekeeping
          - engineering
          - manager
          - duty_manager
          description: kind 為 staff 時是他當下的角色，其餘為 null。
        name:
          type: string
          nullable: true
          description: kind 為 staff 時是同仁姓名；guest 時是住客姓名（空房為 null）；system 為 null。
    detail:
      type: object
      description: 組句子要的內容，依事件種類帶其中幾項，用不到的不出現。
      properties:
        dept:
          type: string
          enum:
          - housekeeping
          - engineering
          - frontdesk
          description: created：建立後歸屬的部門。triaged：派去的部門。
        initialState:
          type: string
          enum:
          - triage
          - pool
          - accepted
          description: created：建立後落在哪個狀態。triage＝規則沒有命中、等櫃檯派單；pool＝直接進部門待認領；accepted＝建立時就指派給人。
        guestTyped:
          type: boolean
          description: created：是不是住客打字的需求。
        ruleLabel:
          type: string
          nullable: true
          description: created：住客打的字命中分類規則時，那條規則的說明文字；沒有命中或取不到為 null。
        via:
          type: string
          enum:
          - button
          - drag
          description: triaged：按鈕派單還是拖曳派單。事件上沒有記的舊資料視為 button。
        answer:
          type: string
          description: answered：回覆全文。
        assigneeName:
          type: string
          nullable: true
          description: assigned、claimed、reassigned：接手的人。
        previousAssigneeName:
          type: string
          nullable: true
          description: reassigned：原負責人。
        reason:
          type: string
          nullable: true
          description: interrupted、deferred：本人填的原因。returned_to_pool：退回的原因。repair_verification_failed：不通過原因。
        bySelf:
          type: boolean
          description: interrupted、deferred：是不是負責人自己做的。
        note:
          type: string
          nullable: true
          description: returned_to_pool：交代做到哪。inspection_failed：查房的說明。
        cancelReason:
          type: string
          enum:
          - guest_withdrew
          - manager_void
          - plan_superseded
          - staff_withdrew
          description: cancelled：取消原因。
        resolutionType:
          type: string
          enum:
          - fixed
          - temporary
          - cannot_fix
          - no_action_needed
          description: 工務單的 completed：完修結果。
        rating:
          type: integer
          format: int32
          description: rated：住客給的分數。
DeskQuickReply:
  type: object
  description: 當場回答面板的一則常用回覆，內容就是住客資訊頁的一頁。
  required:
  - key
  - title
  - body
  properties:
    key:
      type: string
      description: 這一頁在飯店設定裡的鍵，例如 breakfast。
    title:
      type: string
      description: 膠囊上的字，例如「早餐時間」。
    body:
      type: string
      description: 點了之後帶進回覆框的整段文字。超過 120 字時畫面只帶前 120 字。
DeskAssignRequest:
  type: object
  required:
  - dept
  properties:
    dept:
      type: string
      enum:
      - housekeeping
      - engineering
      description: 派給哪個部門。
    via:
      type: string
      enum:
      - button
      - drag
      default: button
      description: 怎麼派的：按鈕或在看板上拖曳。只影響歷程文字，狀態變化完全相同。
DeskAnswerRequest:
  type: object
  required:
  - answer
  properties:
    answer:
      type: string
      minLength: 1
      maxLength: 120
      description: 給住客的回覆。後端先去掉頭尾空白，之後必須是 1–120 字，否則回 422 answer_invalid。存下來與住客看到的都是去掉空白後的字。
DeskMenuKey:
  type: string
  description: >-
    代開單的品項鍵：櫃檯代開單面板固定的 12 個常用品項，鍵就是中文品名，與住客選單（tenant_config 的 request_menu）的 key、
    分類規則的 menu_key 是同一套值。這份清單寫在程式裡，不讀飯店設定；畫面照這 12 個鍵寫死，順序就是面板上的順序。
    每個鍵開出的單：
    毛巾、浴巾、礦泉水、拖鞋、牙刷組：房務（housekeeping、amenity），上限 9，標題「{品名} ×{數量}」。
    嬰兒床、加床：房務（housekeeping、amenity），上限 2，標題「{品名} ×{數量}」。
    冰塊：房務（housekeeping、amenity），上限 2，標題「冰塊 ×{數量} 桶」。
    冷氣：工務單（engineering、repair），上限 1，標題「冷氣有問題」，修繕分類 air_conditioning。
    熱水：工務單（engineering、repair），上限 1，標題「熱水有問題」，修繕分類 plumbing_electrical。
    燈具：工務單（engineering、repair），上限 1，標題「燈具有問題」，修繕分類 plumbing_electrical。
    電視：工務單（engineering、repair），上限 1，標題「電視有問題」，修繕分類 furniture_equipment。
  enum:
  - 毛巾
  - 浴巾
  - 礦泉水
  - 拖鞋
  - 牙刷組
  - 嬰兒床
  - 加床
  - 冰塊
  - 冷氣
  - 熱水
  - 燈具
  - 電視
DeskCreateRequestsRequest:
  type: object
  description: >-
    一次代開送出的內容：房號、選了的品項與數量、選填的其他需求。至少要有一個品項或其他需求，否則回 422 validation_failed。
    單的標題、部門、類型與修繕分類由後端依品項鍵決定，請求不帶；操作者從登入身分取。
  required:
  - roomNo
  - items
  properties:
    roomNo:
      type: string
      minLength: 1
      description: 房號，照飯店的寫法（例 305）。空白回 422 validation_failed；不是這家飯店的客房（含公共區域佔位房）回 404 not_found。
      example: '305'
    items:
      type: array
      maxItems: 12
      items:
        $ref: '#/DeskCreateRequestItem'
      description: >-
        選了的品項，只放數量大於 0 的；沒有選品項時是空陣列。同一個品項鍵只能出現一次（重複回 422）。
        回應的卡片依 DeskMenuKey 的順序排，與這裡的順序無關。
    other:
      type: object
      nullable: true
      allOf:
      - $ref: '#/DeskCreateRequestOther'
      description: 其他需求；沒有填（或只打了空白）時不帶或帶 null，畫面不送只有空白的文字。
DeskCreateRequestItem:
  type: object
  required:
  - menuKey
  - quantity
  properties:
    menuKey:
      $ref: '#/DeskMenuKey'
    quantity:
      type: integer
      format: int32
      minimum: 1
      maximum: 9
      description: 份數，1 到該品項的上限（見 DeskMenuKey：多數房務品項 9，嬰兒床、加床、冰塊 2，工務品項 1）。超過上限回 422 validation_failed。
DeskCreateRequestOther:
  type: object
  required:
  - text
  - dept
  properties:
    text:
      type: string
      minLength: 1
      maxLength: 60
      description: >-
        其他需求的文字，原文照存、不翻譯。後端先去掉頭尾空白，之後必須是 1–60 字，否則回 422 validation_failed；
        去掉空白後的文字就是這張單的標題。
      example: 住客明早 6 點要叫車
    dept:
      type: string
      enum:
      - housekeeping
      - engineering
      description: >-
        這段要給哪個部門。housekeeping 開一般單（type=other、T- 單號）；engineering 開工務單（type=repair、W- 單號、修繕分類 other）。
        給工務時文字只存在標題，工務單的說明（description）為空。
DeskCreateRequestsResult:
  type: object
  description: 代開單成功（或回放）的回應。
  required:
  - serverTime
  - tasks
  properties:
    serverTime:
      type: string
      format: date-time
      description: >-
        後端產生這份回應的時間，用途同 DeskBoard.serverTime。回放時是第一次執行時的時間，畫面不必用它重新校正時鐘。
    tasks:
      type: array
      minItems: 1
      maxItems: 13
      items:
        $ref: '#/DeskTask'
      description: >-
        這次開出的每一張單的看板卡片，形狀與看板讀取相同（含 menuKey、displayNo、waitingSince、seq）。
        順序：品項依 DeskMenuKey 的順序，其他需求那一張在最後。張數等於品項數加上有沒有其他需求，最多 13 張。
        每張的 state 為 pool、source 為 desk、沒有負責人、waitingSince 等於 createdAt。
DeskRoom:
  type: object
  description: 代開單面板的一間客房。
  required:
  - roomNo
  - occupied
  properties:
    roomNo:
      type: string
      description: 房號，照飯店的寫法（rooms.room_no）。
      example: '305'
    occupied:
      type: boolean
      description: 這間房現在有沒有在住的住客；等於 guest 不為 null。true 時出現住客卡、列入建議房號；false 時是空房提示。
    guest:
      type: object
      nullable: true
      allOf:
      - $ref: '#/DeskRoomGuest'
      description: 在住的住客；空房為 null。
DeskRoomGuest:
  type: object
  description: 在住訂房的住客（認定方式見 listDeskRooms）。訂房資料沒有人數、入住時刻與語言，所以不帶。
  required:
  - vip
  - checkinDate
  - checkoutDate
  properties:
    name:
      type: string
      nullable: true
      description: 住客姓名，照訂房資料原樣（含稱謂，例「王大明 先生」「Sato Yuki 様」）；訂房資料沒有姓名時為 null。
    vip:
      type: boolean
      description: 是不是 VIP（訂房的屬性），與看板卡片的 DeskTask.vip 同一個來源。
    checkinDate:
      type: string
      format: date
      description: 入住日期（飯店當地日期，口徑同 DeskBoard.businessDate）。
    checkoutDate:
      type: string
      format: date
      description: 退房日期（飯店當地日期）。
