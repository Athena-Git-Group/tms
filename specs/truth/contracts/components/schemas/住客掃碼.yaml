guest_sessions:
  type: object
  properties:
    id:
      type: string
      format: uuid
    tenantId:
      type: integer
      format: int64
    sessionToken:
      type: string
      description: 住客的權杖，格式是「飯店編號.隨機字串」，由伺服器產生，全域唯一。
    roomId:
      type: string
      format: uuid
    reservationId:
      type: string
      format: uuid
      description: 綁簽發當下訂單——換住客舊 session 自然失效
    expiresAt:
      type: string
      format: date-time
      description: >-
        session 到期時間，由後端決定：等於綁定訂單的退房時刻（reservations_cache.checkout_at）。
        住客掃房間 QR 與櫃檯替住客開 session 兩個入口用同一條規則。
    revokedAt:
      type: string
      format: date-time
      description: QR 輪替/提前退房/訂單取消時整批標上
    createdAt:
      type: string
      format: date-time
    lastSeenAt:
      type: string
      format: date-time
  description: 不變條件：驗證=expires_at > now() AND revoked_at IS NULL，缺一即 401（E-17）。
  required:
  - id
  - tenantId
  - sessionToken
  - roomId
  - reservationId
  - expiresAt
  - createdAt
guest_sessionsRequest:
  type: object
  description: >-
    飯店取自呼叫者登入的那家飯店，權杖由伺服器產生，到期時間由後端依綁定訂單的退房時刻決定，三者都不在請求裡；
    請求裡多帶了 expiresAt 也不採用。
  properties:
    roomId:
      type: string
      format: uuid
      description: 要開 session 的房間，必須屬於呼叫者的飯店。
    reservationId:
      type: string
      format: uuid
      description: 選填。要綁的訂單，必須屬於呼叫者的飯店而且是這間房的；不帶就用這間房目前入住中的訂單。
  required:
  - roomId
CreateGuestRequestRequest:
  type: object
  description: itemId 與 text 必須剛好擇一，兩者都有或都沒有時回 422。
  properties:
    itemId:
      type: string
      description: 勾選單品項，對應 tenant_config.request_menu。
    quantity:
      type: integer
      format: int32
      minimum: 1
      description: 勾選單數量，預設 1。
    text:
      type: string
      minLength: 1
      description: 自由文字需求。PII 去識別化範圍。
    lang:
      type: string
      description: 自由文字的語言，例如 en、ja。
GuestRequest:
  type: object
  description: >-
    住客視角的需求。不含員工姓名等內部資訊。住客頁實際呼叫的 /guest/requests 回的欄位包含這裡全部欄位，
    另外多 type、dept、rating 三欄（兩條路徑用同一個 GuestTaskView）。
  required:
  - id
  - title
  - state
  - endedAt
  - createdAt
  properties:
    id:
      type: string
      format: uuid
      description: 等於 tasks.id。
    title:
      type: string
      description: 例如「衣架 ×4」。
    state:
      type: string
      enum:
      - triage
      - pool
      - accepted
      - doing
      - done
      - inspected
      - closed
      - deferred
      - interrupted
      - cancelled
      description: >-
        任務的狀態，就是資料上的十個值。closed 只有工務單會出現：主管驗收通過、以不需處理結案，
        或飯店不需要工務主管驗收時完修即結案。done 不一定代表結束，要配合 endedAt 看。
    endedAt:
      type: string
      format: date-time
      nullable: true
      description: >-
        這張需求走到終點的時間（tasks.ended_at）；還沒結束為 null。住客頁用它決定要不要顯示「已完成」，
        規則與櫃檯看板分「已結案」欄相同：state 是 inspected、closed、cancelled，或 endedAt 有值，就是已經結束。
        state 是 done 而 endedAt 是 null 的單還在等主管把關（打掃單等房務主管查房、工務單等主管驗收），
        住客頁顯示「處理中」。備品、其他類的單與櫃檯當場回答的單完成當下就有值。
        評分也看它：後端只收已經結束、state 是 done、inspected 或 closed 的需求的評分；
        櫃檯當場回答的需求（answer 有值）住客頁不顯示評分卡，後端不另外擋。
    answer:
      type: string
      nullable: true
      description: >-
        櫃檯當場回答的回覆全文（tasks.answer）。有值表示櫃檯已經直接回覆這則需求並結案（state 為 done），
        住客的進度頁顯示這段文字；其他需求為 null。
    createdAt:
      type: string
      format: date-time
