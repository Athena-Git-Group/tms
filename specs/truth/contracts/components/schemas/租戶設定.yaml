tenant_config:
  type: object
  properties:
    tenantId:
      type: integer
      format: int64
    key:
      type: string
      description: 封閉鍵集：standard_cleaning_minutes|shift_capacity|inspection_items|sop_items|guest_info_pages|request_menu|minutes_per_credit|classification_rules|scan_fail_threshold|low_rating_threshold|shift_times|retention_days|inspection_waived_cleaning_types（免查房的打掃種類，預設 [stayover]；後端不讀這一鍵，免查房看 inspection_waived_enabled）|inspection_waived_enabled（免查房開關，值為 boolean，未設定或不是 true 時視為需要查房。true 時打掃單開工當下鎖成免查，不分打掃種類；櫃檯設定頁的「需要房務主管查房」是它的反向，見 DeskSettings.inspectionRequired）|repair_verification_required（需要工務主管驗收，值為 boolean，未設定或不是 false 時視為 true。false 時工務按完成就結案、不進待驗收；工務按完成那一刻才讀，見 DeskSettings.repairVerificationRequired）|pms.writeback.room_status|pms.provider|unclaimed_reminder_minutes|notification_retention_days（這四鍵的說明見 data-model.dbml 的 tenant_config.key）|completion_celebration_enabled（本輪新增：完成慶祝的氣氛呈現開關，值為 boolean，預設 true。false 時完成畫面仍出現、接續按鈕仍可用，只是不呈現飾帶、彩屑、入場動態與今日進度——關掉的是氣氛，不是接力；不影響 nextStep 與 cleaningDoneToday 的計算）|self_inspection_allowed（允許主管查自己清的房，值為 boolean，未設定時視為 true。true 時房務主管可以查自己清的房，查房送出與待查房清單都把它當一般的待查房，只有一位房務主管的飯店不必設定也查得到自己清的房；飯店設為 false 時清房者不能查自己清的房：查房送出回 403，自己清的房也不出現在自己的待查房清單與格數。這一鍵只管清房者與查房者是同一人這一條，沒有查房權限的角色不論設定如何都不能送出查房）
    value:
      type: string
      description: 結構依 key 而異
    updatedAt:
      type: string
      format: date-time
    updatedBy:
      type: string
      format: uuid
      description: → staff_accounts；設定變更要能追
  description: 「什麼都可調」的落地。inspection_items/sop_items 兩鍵為 sop_items 表的門面（讀寫轉進表）。
  required:
  - tenantId
  - key
  - value
  - updatedAt
tenant_configRequest:
  type: object
  properties:
    tenantId:
      type: integer
      format: int64
    key:
      type: string
      description: 封閉鍵集，與 tenant_config.key 相同，各鍵說明見 tenant_config.key。
    value:
      type: string
      description: 結構依 key 而異
  required:
  - tenantId
  - key
  - value
