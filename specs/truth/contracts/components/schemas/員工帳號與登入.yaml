staff_accounts:
  type: object
  properties:
    id:
      type: string
      format: uuid
    tenantId:
      type: integer
      format: int64
    name:
      type: string
      description: PII：離職去識別化換不可回推代號
    loginId:
      type: string
      description: PII；UNIQUE (tenant_id, login_id)
    passwordHash:
      type: string
      description: bcrypt/argon2，絕不存明文
    role:
      type: string
      description: 'CHECK: frontdesk|housekeeping|engineering|manager|owner'
    dept:
      type: string
      description: 'CHECK: housekeeping|engineering|frontdesk；主管/老闆可空'
    active:
      type: boolean
      description: 停用=不能登入，歷史保留
    mustChangePassword:
      type: boolean
      description: 臨時密碼登入成功後為 true；完成改密前不得用這組憑證呼叫其他需要身分的 API。本 plan 新增，待 /data-plan 補 staff_accounts.must_change_password 欄位。
    failedLoginCount:
      type: integer
      format: int32
      description: 連續輸入錯誤密碼的次數；登入成功即清零。本 plan 新增，待 /data-plan 補 staff_accounts.failed_login_count 欄位。
    lockedUntil:
      type: string
      format: date-time
      nullable: true
      description: 連續輸入錯誤密碼達 5 次時鎖定 15 分鐘的到期時間；未鎖定為 null。本 plan 新增，待 /data-plan 補 staff_accounts.locked_until 欄位。
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
  description: 員工帳號。角色×動作矩陣在程式/設定，不在表裡（docs/11 需求 15）。
  required:
  - id
  - tenantId
  - name
  - loginId
  - passwordHash
  - role
  - active
  - mustChangePassword
  - failedLoginCount
  - createdAt
  - updatedAt
staff_accountsRequest:
  type: object
  properties:
    tenantId:
      type: integer
      format: int64
    name:
      type: string
      description: PII：離職去識別化換不可回推代號
    loginId:
      type: string
      description: PII；UNIQUE (tenant_id, login_id)
    passwordHash:
      type: string
      description: bcrypt/argon2，絕不存明文
    role:
      type: string
      description: 'CHECK: frontdesk|housekeeping|engineering|manager|owner'
    dept:
      type: string
      description: 'CHECK: housekeeping|engineering|frontdesk；主管/老闆可空'
    active:
      type: boolean
      description: 停用=不能登入，歷史保留
  required:
  - tenantId
  - name
  - loginId
  - passwordHash
  - role
  - active
LoginRequest:
  type: object
  description: 登入專屬請求形狀，與「建立員工帳號」的 staff_accountsRequest 分開——明文密碼只用於登入比對，不落地存儲。
  required:
  - loginId
  - password
  properties:
    loginId:
      type: string
      description: 對應 staff_accounts.login_id；畫面與推播文案一律用「員工編號」。
    password:
      type: string
      description: 明文密碼，後端以 bcrypt/argon2 雜湊後比對 staff_accounts.passwordHash，絕不回傳或落地明文。
ChangePasswordRequest:
  type: object
  description: >-
    本人設定新密碼的請求形狀。明文密碼只用於這次比對與重新雜湊，不回傳也不落地存明文。
    兩種情境共用這個形狀：①臨時密碼登入後被強制改密（mustChangePassword=true），
    此時身分已由登入換得的 token 證明，不必再帶 currentPassword；
    ②自願變更密碼（mustChangePassword=false），必須帶 currentPassword 再確認一次本人。
  required:
  - newPassword
  properties:
    currentPassword:
      type: string
      nullable: true
      description: >-
        目前使用中的明文密碼。強制改密情境（mustChangePassword=true）不需要帶，帶了也會被忽略；
        自願變更情境必填，省略或空白回 422 current_password_required，
        比對不符回 401 current_password_invalid，提示「目前密碼不正確」。
    newPassword:
      type: string
      description: >-
        新的明文密碼，後端以 bcrypt/argon2 重新雜湊寫入 staff_accounts.passwordHash。
        與目前密碼相同回 422 new_password_invalid，message 為「新密碼不能和目前密碼相同」。
        密碼強度規則（長度下限、字元組成）truth 目前沒有定義，後端實作前需由 `/dsl-refine`
        補口徑；在那之前這條端點只擋「與目前密碼相同」這一種，不自行發明長度門檻。
LoginResponse:
  type: object
  description: 登入成功的回應形狀，銜接 techstack 已拍板的 JWT（TTL 12h）。
  required:
  - token
  - expiresAt
  - staffId
  - name
  - role
  - mustChangePassword
  properties:
    token:
      type: string
      description: JWT，後續請求帶 Authorization 標頭使用。
    expiresAt:
      type: string
      format: date-time
      description: token 到期時間，登入當下 + 12h。
    staffId:
      type: string
      format: uuid
    name:
      type: string
    dept:
      type: string
      nullable: true
      description: 'CHECK: housekeeping|engineering|frontdesk；主管/老闆可空'
    role:
      type: string
      description: 'CHECK: frontdesk|housekeeping|engineering|manager|owner'
    mustChangePassword:
      type: boolean
      description: true 表示這是臨時密碼登入，必須先設定新密碼才能繼續使用；完成改密前這組憑證呼叫其他需要身分的 API 一律被拒。
PushTokenRegisterRequest:
  type: object
  description: registerPushToken（PUT /me/push-token）的請求：App 回報這台手機的推播地址。
  required:
  - deviceFingerprint
  - pushToken
  - platform
  properties:
    deviceFingerprint:
      type: string
      description: App 自行產生並保存的裝置識別碼，對應 staff_devices.device_fingerprint；同一台手機每次都送同一個值。
    pushToken:
      type: string
      description: FCM 給的推播地址（iOS 也經 FCM 轉 APNS，一律送 FCM token），對應 staff_devices.push_token。
    platform:
      type: string
      enum:
      - ios
      - android
      description: 對應 staff_devices.platform；iOS 的推播會額外附 APNS 的 alert 與 content-available。
PushTokenRevokeRequest:
  type: object
  description: revokePushToken（DELETE /me/push-token）的請求：登出時解除這台手機。
  required:
  - deviceFingerprint
  properties:
    deviceFingerprint:
      type: string
