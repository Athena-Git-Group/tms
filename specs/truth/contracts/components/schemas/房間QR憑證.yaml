room_qr_tokens:
  type: object
  properties:
    id:
      type: string
      format: uuid
    tenantId:
      type: integer
      format: int64
    roomId:
      type: string
      format: uuid
    token:
      type: string
      description: ≥128 bit 隨機 base62 約 22 字元，不含房號資訊；全域 UNIQUE
    status:
      type: string
      description: 'CHECK: active|revoked'
    createdAt:
      type: string
      format: date-time
    revokedAt:
      type: string
      format: date-time
  required:
  - id
  - tenantId
  - roomId
  - token
  - status
  - createdAt
room_qr_tokensRequest:
  type: object
  properties:
    tenantId:
      type: integer
      format: int64
    roomId:
      type: string
      format: uuid
    token:
      type: string
      description: ≥128 bit 隨機 base62 約 22 字元，不含房號資訊；全域 UNIQUE
    status:
      type: string
      description: 'CHECK: active|revoked'
    revokedAt:
      type: string
      format: date-time
  required:
  - tenantId
  - roomId
  - token
  - status
