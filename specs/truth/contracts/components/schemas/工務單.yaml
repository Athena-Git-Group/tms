RepairCategory:
  type: string
  description: 冷氣、水電、家具／設備、門鎖、其他。
  enum:
  - air_conditioning
  - plumbing_electrical
  - furniture_equipment
  - door_lock
  - other
CreateRepairPhotoRequest:
  type: object
  required:
  - purpose
  - takenAt
  properties:
    purpose:
      type: string
      enum:
      - report
      - completion
      description: report 是報修照片；completion 是完修照片。
    roomId:
      type: string
      format: uuid
    takenAt:
      type: string
      format: date-time
      description: 拍攝時間。從相簿選取的照片用檔案時間；這個值和 App 加上的浮水印一致。
RepairPhoto:
  type: object
  required:
  - id
  - status
  properties:
    id:
      type: string
      format: uuid
    status:
      type: string
      enum:
      - pending
      - uploaded
    takenAt:
      type: string
      format: date-time
RepairTicketPrecheckRequest:
  type: object
  required:
  - sourceTaskId
  - category
  properties:
    sourceTaskId:
      type: string
      format: uuid
    category:
      $ref: '#/RepairCategory'
UrgentJudgement:
  type: object
  description: >-
    系統依飯店設定規則判定急件的結果（例如 VIP 或今日入住）。房務不能更改這個判定，只能由主管事後降級。
    suggested=false 時 rule 為 null；沒有命中任何規則時判定為一般件。
  required:
  - suggested
  properties:
    suggested:
      type: boolean
      description: true 表示系統判定為急件。
    rule:
      type: string
      nullable: true
      description: 命中的判定規則說明，例如「VIP · 15:00 入住」；判定為一般件時為 null。
RepairTicketPrecheckResponse:
  type: object
  required:
  - urgentJudgement
  properties:
    duplicate:
      type: object
      allOf:
      - $ref: './shared.yaml#/RepairTicketSummary'
      nullable: true
      description: 同房、同類別、未結案的工務單；沒有時為 null。
    urgentJudgement:
      $ref: '#/UrgentJudgement'
CreateRepairTicketRequest:
  type: object
  description: >-
    不接受急件欄位：急件由系統依飯店設定規則判定（UrgentJudgement），房務不能在開單時指定或更改。
    三種開單路徑擇一：①房務從自己未取消的任務開單，帶 sourceTaskId，房號由原任務帶入；
    ②工務不經過任何房務任務直接開單，或櫃檯交辦開單，sourceTaskId 留空，改帶 roomId 或 isPublicArea=true
    （兩者擇一，不可同時帶 sourceTaskId 與 roomId／isPublicArea，否則回 422 repair_source_conflict；
    三者都沒帶回 422 repair_source_missing）。呼叫者部門決定 tasks.source：房務報修與工務自開都是 staff，
    櫃檯交辦是 desk。
  required:
  - category
  - photoIds
  properties:
    sourceTaskId:
      type: string
      format: uuid
      nullable: true
      description: 原任務。提供時房號由原任務帶入；與 roomId／isPublicArea 互斥。
    roomId:
      type: string
      format: uuid
      nullable: true
      description: 工務自開或櫃檯交辦時指定客房；與 sourceTaskId、isPublicArea 互斥。
    isPublicArea:
      type: boolean
      description: true 表示開給公共區域（無房號），省略視為 false；與 sourceTaskId、roomId 互斥。
    category:
      $ref: '#/RepairCategory'
    description:
      type: string
    photoIds:
      type: array
      minItems: 1
      maxItems: 3
      items:
        type: string
        format: uuid
      description: 0 張回 422 photo_required，提示「至少需要 1 張照片」；超過 3 張回 422 photo_limit，提示「最多 3 張」；有任一張還沒上傳回 422 photo_not_uploaded。
    interruptSourceTask:
      type: boolean
      description: true 表示「中斷 → 需要工務協助」模式；只有帶 sourceTaskId 時才有意義，省略視為 false。
    assigneeId:
      type: string
      format: uuid
      nullable: true
      description: >-
        只用於工務自開或櫃檯交辦路徑：直接指定處理人，略過工務待認領與審核，單直接轉為 accepted 給該人。
        房務報修路徑（帶 sourceTaskId）不支援這個欄位。
AppendRepairPhotosRequest:
  type: object
  required:
  - photoIds
  properties:
    photoIds:
      type: array
      minItems: 1
      maxItems: 3
      items:
        type: string
        format: uuid
RepairTicket:
  description: 工務單詳情。工務單本身就是一筆修繕任務，taskId 可以直接用在 tasksClaim、tasksStart、tasksComplete。
  allOf:
  - $ref: './shared.yaml#/RepairTicketSummary'
  - type: object
    required:
    - photoCount
    - urgentJudgement
    properties:
      description:
        type: string
      photos:
        type: array
        items:
          $ref: '#/RepairPhoto'
      photoCount:
        type: integer
        format: int32
      sourceTaskId:
        type: string
        format: uuid
        nullable: true
      assigneeName:
        type: string
        nullable: true
        description: 處理人。
      completionPhotos:
        type: array
        items:
          $ref: '#/RepairPhoto'
      resolutionNote:
        type: string
        nullable: true
      urgentJudgement:
        allOf:
        - $ref: '#/UrgentJudgement'
        description: >-
          開單當下系統判定的原始結果與理由；主管降級後這筆紀錄仍保留（追溯用），目前是否仍視為急件看 isUrgent。
      urgentDowngradeReason:
        type: string
        nullable: true
        description: 主管將急件降級為一般件時附的原因；未降級為 null。
      rejectReason:
        type: string
        nullable: true
        description: >-
          主管退回一般件（state=rejected）時附的原因，例如「照片看不清楚，請補拍」；房務補資料重新送出
          （回到 pending_review）後清空。非 rejected 狀態為 null。本 plan 新增，待 /data-plan 補對應欄位。
      verifiedBy:
        type: string
        nullable: true
        description: 驗收通過的主管顯示名稱；尚未驗收為 null。本 plan 新增，待 /data-plan 補驗收人欄位。
      verifiedAt:
        type: string
        format: date-time
        nullable: true
        description: 主管驗收通過的時間；尚未驗收為 null。本 plan 新增，待 /data-plan 補驗收時間欄位。
      originTicketNo:
        type: string
        pattern: ^W-\d{4}$
        nullable: true
        description: >-
          若本單是完修回報「暫時處理」時系統自動建立的追蹤單，這裡是原單的單號；非追蹤單為 null。
          本 plan 新增，待 /data-plan 補原單關聯欄位。
DowngradeRepairTicketUrgencyRequest:
  type: object
  required:
  - note
  properties:
    note:
      type: string
      minLength: 1
      description: 降級原因，必填，例如「已確認不影響入住」。
RejectRepairTicketRequest:
  type: object
  required:
  - reason
  properties:
    reason:
      type: string
      minLength: 1
      description: 退回原因，必填，例如「照片看不清楚，請補拍」；空白回 422 reject_reason_required。
