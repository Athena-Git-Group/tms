RepairCategory:
  type: string
  description: 冷氣、水電、家具／設備、門鎖、其他。
  enum:
  - air_conditioning
  - plumbing_electrical
  - furniture_equipment
  - door_lock
  - other
CreateRepairPhotoRequest:
  type: object
  required:
  - purpose
  - takenAt
  properties:
    purpose:
      type: string
      enum:
      - report
      - completion
      description: report 是報修照片；completion 是完修照片。
    roomId:
      type: string
      format: uuid
    takenAt:
      type: string
      format: date-time
      description: 拍攝時間。從相簿選取的照片用檔案時間；這個值和 App 加上的浮水印一致。
RepairPhoto:
  type: object
  required:
  - id
  - status
  properties:
    id:
      type: string
      format: uuid
    status:
      type: string
      enum:
      - pending
      - uploaded
    takenAt:
      type: string
      format: date-time
RepairTicketPrecheckRequest:
  type: object
  required:
  - sourceTaskId
  - category
  properties:
    sourceTaskId:
      type: string
      format: uuid
    category:
      $ref: '#/RepairCategory'
UrgentJudgement:
  type: object
  description: >-
    系統依飯店設定規則判定急件的結果（例如 VIP 或今日入住）。房務不能更改這個判定，只能由主管事後降級。
    suggested=false 時 rule 為 null；沒有命中任何規則時判定為一般件。
  required:
  - suggested
  properties:
    suggested:
      type: boolean
      description: true 表示系統判定為急件。
    rule:
      type: string
      nullable: true
      description: 命中的判定規則說明，例如「VIP · 15:00 入住」；判定為一般件時為 null。
RepairTicketPrecheckResponse:
  type: object
  required:
  - urgentJudgement
  properties:
    duplicate:
      type: object
      allOf:
      - $ref: './shared.yaml#/RepairTicketSummary'
      nullable: true
      description: 同房、同類別、未結案的工務單；沒有時為 null。
    urgentJudgement:
      $ref: '#/UrgentJudgement'
CreateRepairTicketRequest:
  type: object
  description: >-
    不接受急件欄位：急件由系統依飯店設定規則判定（UrgentJudgement），房務不能在開單時指定或更改。
  required:
  - sourceTaskId
  - category
  - photoIds
  - interruptSourceTask
  properties:
    sourceTaskId:
      type: string
      format: uuid
      description: 原任務。房號由原任務帶入。
    category:
      $ref: '#/RepairCategory'
    description:
      type: string
    photoIds:
      type: array
      minItems: 1
      maxItems: 3
      items:
        type: string
        format: uuid
      description: 0 張回 422 photo_required，提示「至少需要 1 張照片」；超過 3 張回 422 photo_limit，提示「最多 3 張」；有任一張還沒上傳回 422 photo_not_uploaded。
    interruptSourceTask:
      type: boolean
      description: true 表示「中斷 → 需要工務協助」模式。
AppendRepairPhotosRequest:
  type: object
  required:
  - photoIds
  properties:
    photoIds:
      type: array
      minItems: 1
      maxItems: 3
      items:
        type: string
        format: uuid
RepairTicket:
  description: 工務單詳情。工務單本身就是一筆修繕任務，taskId 可以直接用在 tasksClaim、tasksStart、tasksComplete。
  allOf:
  - $ref: './shared.yaml#/RepairTicketSummary'
  - type: object
    required:
    - photoCount
    - urgentJudgement
    properties:
      description:
        type: string
      photos:
        type: array
        items:
          $ref: '#/RepairPhoto'
      photoCount:
        type: integer
        format: int32
      sourceTaskId:
        type: string
        format: uuid
        nullable: true
      assigneeName:
        type: string
        nullable: true
        description: 處理人。
      completionPhotos:
        type: array
        items:
          $ref: '#/RepairPhoto'
      resolutionNote:
        type: string
        nullable: true
      urgentJudgement:
        allOf:
        - $ref: '#/UrgentJudgement'
        description: >-
          開單當下系統判定的原始結果與理由；主管降級後這筆紀錄仍保留（追溯用），目前是否仍視為急件看 isUrgent。
      urgentDowngradeReason:
        type: string
        nullable: true
        description: 主管將急件降級為一般件時附的原因；未降級為 null。
DowngradeRepairTicketUrgencyRequest:
  type: object
  required:
  - note
  properties:
    note:
      type: string
      minLength: 1
      description: 降級原因，必填，例如「已確認不影響入住」。
