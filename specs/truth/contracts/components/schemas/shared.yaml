Error:
  type: object
  description: >-
    錯誤回應。message 用業務原文句型，App 直接顯示。
    本 plan 新增的 code：
    doing_task_exists（409，context 帶 taskId、roomNo，例：「305 還在進行中」）；
    reason_invalid（422，原因空白或超過 60 字）；
    photo_required（422，「至少需要 1 張照片」）；
    photo_limit（422，「最多 3 張」）；
    photo_not_uploaded（422，有照片還沒上傳成功）；
    completion_photo_required（422，「需要完修照片」）；
    already_claimed（409，「已被工務認領」）；
    ticket_closed（409，工務單已結案）；
    credentials_invalid（401，「員工編號或密碼不正確」；員工編號不存在時提示相同，不洩漏是否存在）；
    account_locked（429，context 帶 lockedUntil、remainingMinutes）；
    account_disabled（403，帳號停用，即使密碼正確也被拒）；
    reject_reason_required（422，主管退回工務單時原因空白）；
    repair_source_missing（422，createRepairTicket 沒有提供 sourceTaskId、roomId 或 isPublicArea 任何一種來源）；
    repair_source_conflict（422，同時提供 sourceTaskId 與 roomId 或 isPublicArea）；
    room_ticket_not_requeueable（409，客房工務單不能放回工務待認領，只能暫停）；
    current_password_required（422，自願變更密碼時沒有帶目前密碼）；
    current_password_invalid（401，「目前密碼不正確」）；
    new_password_invalid（422，新密碼與目前密碼相同）；
    dept_required（422，主管或老闆呼叫 listDeptPool 沒有帶 dept，無法判斷要看哪一池）；
    forbidden_dept_pool（403，現場員工帶了自己部門以外的 dept 查待認領）。
    違反狀態機守衛時沿用 state_conflict（409）。
  required:
  - code
  - message
  properties:
    code:
      type: string
      example: VALIDATION_FAILED
    message:
      type: string
    details:
      type: array
      items:
        type: object
        properties:
          field:
            type: string
          issue:
            type: string
    context:
      type: object
      additionalProperties: true
      description: 錯誤的業務脈絡，例如 doing_task_exists 的 {taskId, roomNo}。
