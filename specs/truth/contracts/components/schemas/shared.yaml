RepairTicketSummary:
  type: object
  description: 工務單摘要。任務詳情、開單前檢查與工務單 API 共用。
  required:
  - taskId
  - ticketNo
  - roomNo
  - category
  - isUrgent
  - state
  - reporterName
  - createdAt
  properties:
    taskId:
      type: string
      format: uuid
    ticketNo:
      type: string
      pattern: ^W-\d{4}$
      example: W-0410
    roomNo:
      type: string
    category:
      $ref: './工務單.yaml#/RepairCategory'
    isUrgent:
      type: boolean
      description: >-
        目前是否仍視為急件；由系統依飯店設定規則判定，房務不能更改，主管可事後降級為 false（見 RepairTicket.urgentDowngradeReason）。
    state:
      type: string
      enum:
      - pending_review
      - rejected
      - pool
      - accepted
      - doing
      - done
      - cancelled
      description: >-
        等主管審核、主管未核准、待認領、已接單、維修中、已完修、已撤回（cancelled 且原因為 staff_withdrew）。
        pending_review／rejected 是本 plan 新增的狀態值，只有房務報修的一般件（非急件、tasks.source=staff
        且帶 sourceTaskId）送出後會先進 pending_review；急件（不論來源）、工務自開、櫃檯交辦開單一律直接進 pool，
        不經過審核。已完修（done）之後是否已驗收是另一組欄位（見 RepairTicket.verifiedBy／verifiedAt），
        不新增獨立狀態值。
    reporterName:
      type: string
    createdAt:
      type: string
      format: date-time
PushPayload:
  type: object
  description: >-
    非同步契約：outbox kind=push 的內容，由推播消費者送到裝置（MVP 只寫日誌與資料列，不接 APNS/FCM）。
    沒有對應的 HTTP 端點，這裡列出它的形狀，作為 App 解析推播與後端 E2E 斷言的依據。
    unclaimed_reminder_staff／unclaimed_reminder_manager 是待認領未接超時兩段提醒（一般單與急件門檻各自可設定，
    各段只發一次，認領後不再發）；標題例如「319 退房清潔 已等 10 分，還沒人接」、「319 退房清潔 已通知主管」。
  required:
  - recipientStaffId
  - event
  - title
  - target
  properties:
    recipientStaffId:
      type: string
      format: uuid
    event:
      type: string
      enum:
      - pool_new_request
      - inspection_passed
      - inspection_failed
      - spot_check_failed
      - task_cancelled
      - reassigned_away
      - reassigned_to_me
      - shift_end_returned
      - guest_withdrew
      - leave_takeover
      - repair_completed
      - repair_urgent
      - kb_reply
      - kb_unhelpful
      - shift_end_still_interrupted
      - unclaimed_reminder_staff
      - unclaimed_reminder_manager
    title:
      type: string
      description: 推播標題全文，例如「305 水電已修好」。
    body:
      type: string
      nullable: true
    target:
      $ref: '#/PushTarget'
PushTarget:
  type: object
  description: >-
    點開推播後的去處。屬於本人的任務帶 taskId：打掃／備品任務用 task（App 開任務頁）、
    修繕任務（工務單）用 ticket（App 開工務單詳情）——去處種類由後端在發推播時依任務類別決定，
    App 照 kind 機械導頁，不自己查任務類別推演。不屬於本人的帶待認領入口。
    通知中心的每一筆（NotificationItem.target）共用這個 schema，點通知項的導頁規則相同。
  required:
  - kind
  properties:
    kind:
      type: string
      enum:
      - task
      - ticket
      - pool
      - home
    taskId:
      type: string
      format: uuid
      nullable: true
      description: kind=task 或 kind=ticket 時必填；ticket 帶的是該修繕任務的 task id（與工務單詳情端點的路徑參數同一個 id）。
    dept:
      type: string
      enum:
      - housekeeping
      - engineering
      - frontdesk
      nullable: true
      description: kind=pool 時必填。
    highlightTaskId:
      type: string
      format: uuid
      nullable: true
      description: kind=pool 時選填，要標亮的單。
PmsRoomStatusWriteback:
  type: object
  description: >-
    非同步契約：outbox kind=pms_status 的內容，由 PMS 回寫消費者送到 PMS adapter。
    查房通過時回寫 vacant_clean（可售）；免查結案時回寫 occupied_clean（OC，住客房・已整理），不得回寫為可售。
  required:
  - roomNo
  - status
  properties:
    roomNo:
      type: string
    status:
      type: string
      enum:
      - vacant_clean
      - occupied_clean
