      description: 'CHECK: system|manager'
    algoVersion:
      type: string
      description: v1=樓層×工時一層一人；Q4 v2 對照用
    generatedAt:
      type: string
      format: date-time
    publishedAt:
      type: string
      format: date-time
  required:
  - tenantId
  - workDate
  - shift
  - status
  - generatedBy
  - algoVersion
  - generatedAt
