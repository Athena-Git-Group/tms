cleaning_plans:
  type: object
  properties:
    id:
      type: string
      format: uuid
    tenantId:
      type: integer
      format: int64
    workDate:
      type: string
      format: date
    shift:
      type: string
      description: 值域從租戶設定 shift_times 來
    status:
      type: string
      description: 'CHECK: draft|published|superseded'
    generatedBy:
      type: string
      description: 'CHECK: system|manager'
    algoVersion:
      type: string
      description: v1=樓層×工時一層一人；Q4 v2 對照用
    generatedAt:
      type: string
      format: date-time
    publishedAt:
      type: string
      format: date-time
  required:
  - id
  - tenantId
  - workDate
  - shift
  - status
  - generatedBy
  - algoVersion
  - generatedAt
