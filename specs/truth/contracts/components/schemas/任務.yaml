HoldReasonRequest:
  type: object
  description: 延後或中斷的原因。可以是預設原因（例如「請勿打擾」、「缺備品，去拿」、「住客回房」）或自填文字。
  required:
  - reason
  properties:
    reason:
      type: string
      minLength: 1
      maxLength: 60
      description: 去掉頭尾空白後 1–60 字；全是空白視為空。
CompleteTaskRequest:
  type: object
  description: 打掃與一般任務不需要 body。修繕任務（工務單）必須附完修照片。
  properties:
    photoIds:
      type: array
      minItems: 1
      maxItems: 3
      items:
        type: string
        format: uuid
      description: 修繕任務必填，至少 1 張已上傳（status=uploaded）、purpose=completion 的照片。
    resolutionNote:
      type: string
      description: 處理說明，選填。判斷不需維修時在這裡註明，例如「不需維修：已重新設定門鎖，測試正常」。
    resolutionType:
      type: string
      enum:
      - fixed
      - temporary
      - cannot_fix
      description: >-
        處理結果，只對修繕任務（工務單）有意義；省略視為 fixed（已修好）。
        temporary（暫時處理）：工務單仍轉 done，系統另外自動建立一張房號、類別都相同的追蹤單進工務待認領
        （見 RepairTicket.originTicketNo）。cannot_fix（無法修復）：工務單轉 done，該房 rooms.hk_state
        轉為 out_of_order（停用待確認）。
CancelTaskRequest:
  type: object
  required:
  - reason
  properties:
    reason:
      type: string
      enum:
      - manager_void
      - plan_superseded
    note:
      type: string
      description: 給負責人的說明，會帶進推播。
SopCheckRequest:
  type: object
  required:
  - sopItemId
  - result
  properties:
    sopItemId:
      type: string
      format: uuid
    result:
      type: string
      enum:
      - checked
      - skipped
HandoverEntry:
  type: object
  description: 任務詳情中合併後的一則交辦。
  required:
  - kind
  - author
  - at
  - content
  properties:
    kind:
      type: string
      enum:
      - manager_note
      - requeue_progress
      - shift_handover
      - desk_note
      description: manager_note 主管交代；requeue_progress 接手進度（原負責人或主管附交代退池）；shift_handover 交班單中該房的項目；desk_note 櫃檯備註。
    author:
      type: string
      description: 作者顯示名稱。
    at:
      type: string
      format: date-time
    content:
      type: string
ReturnInfo:
  type: object
  description: 查房退回或抽查退回的合併資訊；換人原因併在這裡，不另列為主管交代。
  required:
  - failedItems
  - redoCount
  - summary
  properties:
    failedItems:
      type: array
      items:
        type: string
    redoCount:
      type: integer
      format: int32
    reassignReason:
      type: string
      enum:
      - original_cleaner_off_shift
      nullable: true
    summary:
      type: string
      description: 例如「查房退回：換床單鋪床不合格 · 第 1 次重做 · 原清房者小林已下班，改由您接手」。
TaskDetail:
  description: 員工視角的任務詳情。
  allOf:
  - $ref: '#/tasks'
  - type: object
    properties:
      roomNo:
        type: string
      elapsedMinutes:
        type: integer
        format: int32
        description: 已做分鐘。accepted 與 deferred 為 0，doing 為目前累計，interrupted 為中斷前累計。
      segmentStartedAt:
        type: string
        format: date-time
        nullable: true
        description: >-
          目前這一段計時的起算時刻（對應 tasks.segment_started_at）。只有 doing 有值，
          其餘狀態為 null。與 accumulatedSeconds 搭配給任務頁的計時走秒用，公式是
          `accumulatedSeconds + (現在時間 − segmentStartedAt)`，畫面依此逐秒重算，
          不必為了跳動的秒數反覆打端點。
          **不要拿 elapsedMinutes 當這個公式的基準**——它在 doing 時已經含了本段，
          再加一次本段就會重複計算。elapsedMinutes 仍然是分鐘層級的權威值，
          畫面算出來的秒數換成分鐘後與它不一致時以它為準。
      accumulatedSeconds:
        type: integer
        format: int32
        minimum: 0
        description: >-
          **進入目前這一段之前**的累計秒數（對應 tasks.worked_sec），不含中斷期間、
          也不含目前這一段。這是 segmentStartedAt 那條走秒公式的基準值。
          doing 以外的狀態就是全部的累計秒數（因為沒有進行中的段落）。
          與 accumulatedMinutes 的差別：後者是**含本段**的分鐘數，兩者不能互換。
      checkedSopItems:
        type: array
        items:
          type: string
          format: uuid
      skippedSopItems:
        type: array
        items:
          type: string
          format: uuid
      handovers:
        type: array
        items:
          $ref: '#/HandoverEntry'
      handoverRead:
        type: boolean
        description: 呼叫者是否已讀這張任務的交辦。
      returnInfo:
        type: object
        allOf:
        - $ref: '#/ReturnInfo'
        nullable: true

NextStep:
  description: >-
    完成一間之後，員工接下來該去哪裡。三種去向用 kind 明確分辨，**不是**靠
    taskId 是不是 null 推斷——後者會讓「查不到下一間」與「今天都清完了」在畫面上
    長得一模一樣，員工看到的結論卻完全相反。
    挑選口徑：先找本人今日 accepted 的單（沿用 MyToday.nextTasks 的排序，兩處必須指向同一間）；
    沒有時再找本人今日未結束的單（doing、interrupted、deferred），
    依 doing→interrupted→deferred、同組房號遞增取第一筆；兩者皆無即為 all_clear。
    「今日」的判定沿用 MyToday 的口徑：work_date 有值時比 work_date，
    沒有值（非打掃類）時未結束狀態算今天、已結束看 doneAt 是否落在今天。
  type: object
  required:
  - kind
  properties:
    kind:
      type: string
      enum:
      - next_task
      - unfinished_task
      - all_clear
      description: >-
        next_task＝還有待開始的下一張任務；unfinished_task＝沒有待開始的單，
        但今天還有停在一半的單（進行中、已中斷或已延後）；all_clear＝今天排定的房都清完了。
    taskId:
      type: string
      format: uuid
      description: kind 為 next_task 或 unfinished_task 時必有；all_clear 時不出現。
    roomNo:
      type: string
      description: kind 為 next_task 或 unfinished_task 時必有；all_clear 時不出現。

TaskCompletion:
  description: >-
    完成一間之後回給 App 的東西：剛完成的那張任務詳情，加上完成畫面要用的兩個值。
    兩個值都在完成這一次往返內給完，App 不為了畫完成畫面再打一次 MyToday——
    多一次往返會讓完成畫面在訊號差的樓層卡住，而那正是員工最需要立刻看到回饋的時候。
  allOf:
  - $ref: '#/TaskDetail'
  - type: object
    required:
    - nextStep
    properties:
      nextStep:
        $ref: '#/NextStep'
      cleaningDoneToday:
        type: integer
        format: int32
        minimum: 0
        description: >-
          這是呼叫者今天完成的第幾張打掃單（含開工時鎖定免查房而直接結案的單）。
          與 MyToday.cleaningDone 同一套口徑，兩個畫面的數字必須一致。
          **只有打掃類任務的完成會帶這個欄位**；備品等其他類別不帶，完成畫面據此整塊不呈現今日進度。
      celebrationEnabled:
        type: boolean
        description: >-
          租戶是否開啟完成慶祝的氣氛呈現（對應 tenant_config 的 completion_celebration_enabled）。
          false 時完成畫面仍然出現、接續按鈕仍然可用，只是不呈現飾帶、彩屑、入場動態與今日進度——
          關掉的是氣氛，不是接力。省略時視為 true。
