  - type
  - source
  - roomId
  - dept
  - state
  - eventSeq
  - title
  - redoCount
HoldReasonRequest:
  type: object
  description: 延後或中斷的原因。可以是預設原因（例如「請勿打擾」、「缺備品，去拿」、「住客回房」）或自填文字。
  required:
  - reason
  properties:
    reason:
      type: string
      minLength: 1
      maxLength: 60
      description: 去掉頭尾空白後 1–60 字；全是空白視為空。
CompleteTaskRequest:
  type: object
  description: 打掃與一般任務不需要 body。修繕任務（工務單）必須附完修照片。
  properties:
    photoIds:
      type: array
      minItems: 1
      maxItems: 3
      items:
        type: string
        format: uuid
      description: 修繕任務必填，至少 1 張已上傳（status=uploaded）、purpose=completion 的照片。
    resolutionNote:
      type: string
      description: 處理說明，選填。判斷不需維修時在這裡註明，例如「不需維修：已重新設定門鎖，測試正常」。
    resolutionType:
      type: string
      enum:
      - fixed
      - temporary
      - cannot_fix
      description: >-
        處理結果，只對修繕任務（工務單）有意義；省略視為 fixed（已修好）。
        temporary（暫時處理）：工務單仍轉 done，系統另外自動建立一張房號、類別都相同的追蹤單進工務待認領
        （見 RepairTicket.originTicketNo）。cannot_fix（無法修復）：工務單轉 done，該房 rooms.hk_state
        轉為 out_of_order（停用待確認）。
CancelTaskRequest:
  type: object
  required:
  - reason
  properties:
    reason:
      type: string
      enum:
      - manager_void
      - plan_superseded
    note:
      type: string
      description: 給負責人的說明，會帶進推播。
SopCheckRequest:
  type: object
  required:
  - sopItemId
  - result
  properties:
    sopItemId:
      type: string
      format: uuid
    result:
      type: string
      enum:
      - checked
      - skipped
HandoverEntry:
  type: object
  description: 任務詳情中合併後的一則交辦。
  required:
  - kind
  - author
  - at
  - content
  properties:
    kind:
      type: string
      enum:
      - manager_note
      - requeue_progress
      - shift_handover
      - desk_note
      description: manager_note 主管交代；requeue_progress 接手進度（原負責人或主管附交代退池）；shift_handover 交班單中該房的項目；desk_note 櫃檯備註。
    author:
      type: string
      description: 作者顯示名稱。
    at:
      type: string
      format: date-time
    content:
      type: string
ReturnInfo:
  type: object
  description: 查房退回或抽查退回的合併資訊；換人原因併在這裡，不另列為主管交代。
  required:
  - failedItems
  - redoCount
  - summary
  properties:
    failedItems:
      type: array
      items:
        type: string
    redoCount:
      type: integer
      format: int32
    reassignReason:
      type: string
      enum:
      - original_cleaner_off_shift
      nullable: true
    summary:
      type: string
      description: 例如「查房退回：換床單鋪床不合格 · 第 1 次重做 · 原清房者小林已下班，改由您接手」。
TaskDetail:
  description: 員工視角的任務詳情。
  allOf:
  - $ref: '#/tasks'
  - type: object
    properties:
      roomNo:
        type: string
      elapsedMinutes:
        type: integer
        format: int32
        description: 已做分鐘。accepted 與 deferred 為 0，doing 為目前累計，interrupted 為中斷前累計。
      checkedSopItems:
        type: array
        items:
          type: string
          format: uuid
      skippedSopItems:
        type: array
        items:
          type: string
          format: uuid
      handovers:
        type: array
        items:
          $ref: '#/HandoverEntry'
      handoverRead:
        type: boolean
        description: 呼叫者是否已讀這張任務的交辦。
      returnInfo:
        type: object
        allOf:
        - $ref: '#/ReturnInfo'
        nullable: true
