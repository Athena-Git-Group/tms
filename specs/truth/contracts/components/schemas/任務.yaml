tasks:
  type: object
  properties:
    id:
      type: string
      format: uuid
    tenantId:
      type: integer
      format: int64
    type:
      type: string
      description: 'CHECK: amenity|repair|cleaning|other'
    source:
      type: string
      description: 'CHECK: guest|desk|system|staff（staff 為本 plan 新增：房務開立的工務單）'
    roomId:
      type: string
      format: uuid
    reservationId:
      type: string
      format: uuid
      description: guest 來源必填；住客查詢一律以它過濾（不按房號）
    dept:
      type: string
      description: 'CHECK: housekeeping|engineering|frontdesk（triage 時掛 frontdesk）'
    state:
      type: string
      description: 'CHECK 十一值: triage|pending_review|rejected|pool|accepted|doing|done|inspected|deferred|interrupted|cancelled（pending_review／rejected 為本 plan 新增：工務單審核流程專用）'
    eventSeq:
      type: integer
      format: int32
      description: 事件取號器：守衛 UPDATE 同句 +1 RETURNING
    assigneeId:
      type: string
      format: uuid
      description: 池中為空
    title:
      type: string
    note:
      type: string
      description: 住客原文/翻譯/交代/當場回答——PII 去識別化範圍
    estMin:
      type: integer
      format: int32
      nullable: true
      description: >-
        預估工時（分鐘）。排房帶入；credit 換算屬 Q1 未決。
        不是每一種建單路徑都會填——排房建出來的打掃類有值，臨時需求與自建單可能沒有，
        所以為 null 是合法的。畫面遇到 null 時不顯示預估，也不要拿它算超時。
    startedAt:
      type: string
      format: date-time
      description: 查房退回清空重計
    doneAt:
      type: string
      format: date-time
      description: 完成時間。實際分鐘改以 accumulatedMinutes 為準（不含中斷期間）。
    redoCount:
      type: integer
      format: int32
    rating:
      type: integer
      format: int32
      description: CHECK 1–5；低分觸發老闆推播；一次性（假設 A5）
    planId:
      type: string
      format: uuid
      description: 打掃任務回鏈排房計畫
    workDate:
      type: string
      format: date
      description: 打掃必填（發佈抄自計畫日）——支撐一房一天約束與班末掃描
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
    inspection:
      type: string
      nullable: true
      enum:
      - passed
      - waived
      - failed
      description: 打掃任務的查房結果。全部通過為 passed，免查結案為 waived，查房或抽查退回為 failed。查房合格率只計 passed 與 failed。
    inspectionWaived:
      type: boolean
      description: 開工當下依租戶設定鎖定是否免查房；之後設定變更不影響。
    accumulatedMinutes:
      type: integer
      format: int32
      description: 各段 doing 期間的累計分鐘，不含中斷期間。實際工時以它為準（取代 done_at − started_at）。
    holdReason:
      type: string
      nullable: true
      description: 停住原因。本人延後或中斷的原因、「等工務：<類別>」或「工務已修好：<類別>」。
    deferredBySelf:
      type: boolean
      description: deferred 時是否為本人延後（有負責人）。主管延後為 false。
    linkedRepairTicketId:
      type: string
      format: uuid
      nullable: true
      description: 以中斷模式開立工務單時連結的工務單。
    cancelReason:
      type: string
      nullable: true
      enum:
      - guest_withdrew
      - manager_void
      - plan_superseded
      - staff_withdrew
      description: staff_withdrew 是本 plan 新增的值：報修人在工務認領前撤回工務單。
  required:
  - id
  - tenantId
  - type
  - source
  - roomId
  - dept
  - state
  - eventSeq
  - title
  - redoCount
  - createdAt
  - updatedAt
