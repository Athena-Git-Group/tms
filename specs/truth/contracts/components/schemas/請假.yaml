leaves:
  type: object
  properties:
    id:
      type: string
      format: uuid
    tenantId:
      type: integer
      format: int64
    staffId:
      type: string
      format: uuid
    fromAt:
      type: string
      format: date-time
    toAt:
      type: string
      format: date-time
    createdBy:
      type: string
      format: uuid
      description: 登記的主管
    createdAt:
      type: string
      format: date-time
  description: 請假。登記當下觸發連鎖：accepted→pool、doing→interrupted（效果記事件，不回寫本表）。
  required:
  - id
  - tenantId
  - staffId
  - fromAt
  - toAt
  - createdBy
  - createdAt
leavesRequest:
  type: object
  properties:
    tenantId:
      type: integer
      format: int64
    staffId:
      type: string
      format: uuid
    fromAt:
      type: string
      format: date-time
    toAt:
      type: string
      format: date-time
  required:
  - tenantId
  - staffId
  - fromAt
  - toAt
