MyToday:
  type: object
  required:
  - cleaningDone
  - cleaningTotal
  - inspectedCount
  - completedCount
  - adHocCompleted
  - remainingMinutes
  - todayTasks
  - nextTasks
  - zeroReturnStreakDays
  properties:
    cleaningDone:
      type: integer
      format: int32
    cleaningTotal:
      type: integer
      format: int32
    inspectedCount:
      type: integer
      format: int32
      description: >-
        查房通過數。計算口徑：本人今日 inspection=passed 的任務數（排除免查，只計通過查房的單）。
        首頁今日進度第四格顯示這個值。
    completedCount:
      type: integer
      format: int32
      description: >-
        今天完成單數：本人 done 或 inspected 的任務數。首頁四格不顯示，供完成慶祝頁「第 N 單」使用。
    adHocCompleted:
      type: integer
      format: int32
    remainingMinutes:
      type: integer
      format: int32
    todayTasks:
      type: array
      description: >-
        本人今日的全部任務，供首頁任務列與「繼續處理」使用。
        收錄口徑：負責人是本人、屬於今天、狀態不是 cancelled 的任務。
        「屬於今天」依 work_date 有無分兩種算法：有 work_date 的（排房建出來的打掃類）比
        work_date 等於今天；work_date 為 null 的（備品、其他、修繕這幾類建單時不填工作日）
        改看狀態——未結束（accepted、doing、deferred、interrupted）就算今天手上的單，
        已結束（done、inspected）看 done_at 是否落在今天。
        這兩把尺與同一支端點的其他欄位一致：未結束的那把與 nextTasks、remainingMinutes 相同，
        已結束的那把與今日完成單數相同。只比 work_date 會讓不填工作日的三類任務永遠不在清單裡，
        與「nextTasks 是 todayTasks 的子集」這條契約自相矛盾。
        因此 accepted（已接單）、doing（進行中）、deferred（已延後）、interrupted（已中斷）、
        done（今天已完成）、inspected（今天已查房通過）全部都在裡面；池中還沒人接的單不在這裡（見 listDeptPool）。
        排序口徑與首頁任務列呈現順序一致，由後端排好後直接依序呈現，App 不再重排：
        未結束的單（accepted、doing、deferred、interrupted）排在已結束的單（done、inspected）之前；
        同一組內 doing 最前，其餘依房號遞增；已結束的單依完成時間由新到舊。
        和 nextTasks 的關係：nextTasks 是本陣列中 accepted 那些單的推薦子集，另有自己的推薦排序，
        只用於首頁「下一間」卡；需要列出或進入今天任何一張單一律用 todayTasks。
      items:
        $ref: '#/TodayTask'
    nextTasks:
      type: array
      description: 待開始的單，已依推薦順序排好。
      items:
        $ref: '#/NextTask'
    zeroReturnStreakDays:
      type: integer
      format: int32
      minimum: 0
      description: >-
        連續零退回天數。計算口徑由後端唯一定義，見
        `specs/truth/features/backend/今日進度/dsl.md` 的「連續零退回天數的計算口徑」章節：
        以有出勤的工作日連續計，退回＝tasks.inspection=failed（含抽查退回），
        沒出勤的日子跳過不中斷，今天計入且當天一有退回即歸零。App 只呈現、不重算。
    engineeringSummary:
      type: object
      nullable: true
      description: 只有工務部門（dept=engineering）的呼叫者才有值；其他部門為 null。本 plan 新增，供工務視角今日進度卡使用。
      required:
      - openCount
      - completedToday
      - urgentCount
      - tickets
      properties:
        openCount:
          type: integer
          format: int32
          description: 手上張數：本人目前 accepted／doing 的工務單筆數。
        completedToday:
          type: integer
          format: int32
          description: 今天已完修：本人今天 done 的工務單筆數。
        urgentCount:
          type: integer
          format: int32
          description: >-
            急件數：手上單（accepted／doing）中 isUrgent=true 的筆數。
            急不急的權威欄位是 repair_tickets.is_urgent；沒有對應工務單列的 repair 任務
            （見 EngineeringTicket.ticketNo 的 null 情形）退回讀 tasks.urgent。
            本欄與 tickets[].isUrgent 必須同源，不得各讀各的欄位。
        tickets:
          type: array
          description: >-
            本人手上與今天結案的工務單清單，供工務首頁的單列與進入工務單詳情使用。
            收錄口徑：處理人是本人且狀態為 accepted 或 doing 的工務單，加上處理人是本人、今天完修（done）的工務單
            ——今天已完修的也要給，工務才能打開它看主管驗收狀態（RepairTicket.verifiedBy／verifiedAt）。
            還在待認領（pool）、等審核（pending_review）、被退回（rejected）、已撤回（cancelled）的單不在這裡。
            排序：急件（isUrgent=true）在前，其次未結案（accepted、doing）在已完修（done）之前，
            同組內依開單時間由舊到新。
            筆數關係：openCount 等於本陣列中 accepted 與 doing 的筆數，completedToday 等於其中 done 的筆數。
          items:
            $ref: '#/EngineeringTicket'
TodayTask:
  type: object
  description: >-
    首頁任務列的一張單。欄位與任務詳情（TaskDetail）共用同一組名稱與值，
    App 可以直接拿 taskId 呼叫 readTasks 進入任務頁。
  required:
  - taskId
  - roomNo
  - title
  - type
  - state
  - redoCount
  - inspectionWaived
  properties:
    taskId:
      type: string
      format: uuid
    roomNo:
      type: string
    title:
      type: string
    type:
      type: string
      enum:
      - cleaning
      - amenity
      - repair
      - other
    state:
      type: string
      enum:
      - accepted
      - doing
      - deferred
      - interrupted
      - done
      - inspected
      description: >-
        與 tasks.state 同一套值；本陣列只會出現有負責人且今日有效的這六個值，
        cancelled 不收錄，還在池中（pool）、等審核（pending_review）、被退回（rejected）的單也不在這裡。
    redoCount:
      type: integer
      format: int32
      description: 被查房退回重做的次數；大於 0 時單卡標示「重做第 N 次」。
    estMin:
      type: integer
      format: int32
      nullable: true
      description: 預估分鐘，由排房計畫帶入；沒有預估值時為 null。與 TaskDetail.estMin 同一個值。
    workedMinutes:
      type: integer
      format: int32
      description: >-
        已做分鐘，等同 TaskDetail.elapsedMinutes 的口徑：accepted 與 deferred 為 0，
        doing 為目前累計，interrupted 為中斷前累計，done 與 inspected 為完成時的累計（不含中斷期間）。
    holdReason:
      type: string
      nullable: true
      description: >-
        停住原因，與 tasks.holdReason 同一個值。延後（deferred）或中斷（interrupted）時帶本人填的原因
        或「等工務：<類別>」、「工務已修好：<類別>」；其他狀態為 null。單卡直接顯示這段文字。
    inspection:
      type: string
      nullable: true
      enum:
      - passed
      - waived
      - failed
      description: >-
        查房結果，與 tasks.inspection 同一套值：全部通過 passed、免查結案 waived、查房或抽查退回 failed；
        還沒有查房結果為 null。
    inspectionWaived:
      type: boolean
      description: 開工當下鎖定的是否免查房，與 tasks.inspectionWaived 同一個值；完成後據此決定要不要顯示等待查房。
EngineeringTicket:
  type: object
  description: >-
    工務首頁單列的一張工務單。欄位名與 RepairTicketSummary 一致，
    App 可以直接拿 taskId 呼叫 readRepairTicket 進入工務單詳情，或呼叫 tasksStart／tasksComplete。
  required:
  - taskId
  - isPublicArea
  - title
  - state
  - isUrgent
  - source
  properties:
    ticketNo:
      type: string
      nullable: true
      pattern: ^W-\d{4}$
      example: W-0412
      description: >-
        工務單號。為 null 的情況：type=repair 的任務不保證有對應的 repair_tickets 列
        （排程規則可以建出沒有工務單的 repair 任務），而 tickets 的筆數必須與
        openCount＋今天完修數一致，所以這種邊角任務仍然收進清單、單號留空。
        App 遇到 null 時以房號或標題指認該列，不要據此把它從清單裡濾掉。
    taskId:
      type: string
      format: uuid
      description: 工務單本身就是一筆修繕任務，這個 id 可以直接用在任務 API 上。
    roomNo:
      type: string
      nullable: true
      description: 客房單的房號；開給公共區域的單沒有房號，為 null。
    isPublicArea:
      type: boolean
      description: true 表示這張單開給公共區域（沒有房號），此時 roomNo 為 null。
    title:
      type: string
    state:
      type: string
      enum:
      - accepted
      - doing
      - done
      description: >-
        與 RepairTicketSummary.state 同一套值；本陣列只會出現已接單（accepted）、維修中（doing）
        與今天已完修（done）這三個值。
    isUrgent:
      type: boolean
      description: 目前是否仍視為急件；主管降級後為 false，口徑與 RepairTicketSummary.isUrgent 相同。
    source:
      $ref: '#/PoolSource'
NextTask:
  type: object
  required:
  - taskId
  - roomNo
  - title
  - type
  - redoCount
  properties:
    taskId:
      type: string
      format: uuid
    roomNo:
      type: string
    title:
      type: string
    type:
      type: string
      enum:
      - cleaning
      - amenity
      - repair
      - other
    redoCount:
      type: integer
      format: int32
PoolCategory:
  type: string
  description: 打掃 cleaning、備品 amenity、修繕 repair（工務池）、其他 other。
  enum:
  - cleaning
  - amenity
  - repair
  - other
PoolSource:
  type: string
  description: 來源標籤，依序對應：住客掃碼、櫃檯轉單、主管退回、請假退回、班末退池、查房退回、房務報修、系統準備。
  enum:
  - guest_scan
  - desk_forward
  - manager_requeue
  - leave_return
  - shift_end_return
  - inspection_return
  - staff_report
  - system
PoolItem:
  type: object
  required:
  - taskId
  - roomNo
  - floor
  - title
  - category
  - source
  - urgent
  - priorityNotify
  - sameFloor
  - createdAt
  properties:
    taskId:
      type: string
      format: uuid
    ticketNo:
      type: string
      nullable: true
      description: 只有工務單有值，例如 W-0412。
    roomNo:
      type: string
    floor:
      type: integer
      format: int32
    title:
      type: string
    category:
      $ref: '#/PoolCategory'
    source:
      $ref: '#/PoolSource'
    urgent:
      type: boolean
    priorityNotify:
      type: boolean
    sameFloor:
      type: boolean
    reminderStage:
      type: string
      nullable: true
      enum:
      - staff_reminded
      - manager_notified
      description: >-
        未接提醒已到達的階段；還沒進入提醒階段為 null。排序時依優先序排在最前（彼此間依房號），
        App 單卡標示為「未接 · 已提醒同仁」或「未接 · 已通知主管」。
    returnReason:
      type: string
      nullable: true
      description: 退池原因，例如「小陳請假」、「班末退池 · 交給下一班」。
    handoverNote:
      type: string
      nullable: true
      description: 接手進度交代，例如「浴室已刷完，還沒換床單」。
    createdAt:
      type: string
      format: date-time
DeptPool:
  type: object
  required:
  - items
  - counts
  - activeStaffCount
  properties:
    activeStaffCount:
      type: integer
      format: int32
      minimum: 0
      description: >-
        這個部門目前在職、可以搶單的員工數。在職的定義沿用 `specs/truth/features/backend/dsl.md`
        的狀態對照：帳號啟用（active=true）且已開通；待開通與停用的員工不能搶單，不計入。
        主管與老闆的部門為 null，本來就不屬於任何部門池，同樣不計入。
        用途是讓畫面分辨兩種都「沒有單可以接」的情況：
        activeStaffCount 大於 0 而 items 是空的＝池是空的（單都被接走了）；
        activeStaffCount 等於 0＝這個部門沒有在職員工，沒有人可以搶單，畫面要提示主管補人而不是提示「都接完了」。
    items:
      type: array
      items:
        $ref: '#/PoolItem'
    counts:
      type: object
      required:
      - all
      properties:
        all:
          type: integer
          format: int32
        cleaning:
          type: integer
          format: int32
        amenity:
          type: integer
          format: int32
        repair:
          type: integer
          format: int32
        other:
          type: integer
          format: int32
