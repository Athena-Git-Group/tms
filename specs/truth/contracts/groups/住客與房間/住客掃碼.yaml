guestSessionsScan:
  post:
    operationId: guestSessionsScan
    summary: scan
    tags:
    - 住客掃碼 API
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/住客掃碼.yaml#/guest_sessionsRequest'
    responses:
      '200':
        description: 成功
        content:
          application/json:
            schema:
              $ref: '../../components/schemas/住客掃碼.yaml#/guest_sessions'
      '400':
        $ref: '../../components/responses.yaml#/BadRequest'
      '409':
        $ref: '../../components/responses.yaml#/Conflict'
listGuestRequestsAndcreateGuestRequest:
  get:
    operationId: listGuestRequests
    summary: 住客查看自己本次住宿的需求
    description: 只用 session 綁定的 reservation_id 過濾，不按房號查（基線 FR-005）。
    tags:
    - 住客掃碼 API
    parameters:
    - $ref: '../../components/parameters.yaml#/GuestSession'
    responses:
      '200':
        description: 成功
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../../components/schemas/住客掃碼.yaml#/GuestRequest'
      '401':
        $ref: '../../components/responses.yaml#/Unauthorized'
  post:
    operationId: createGuestRequest
    summary: 住客建立需求
    description: >-
      支援兩種需求：
      勾選單：帶 itemId，依 tenant_config.request_menu 預先對應的部門直接進 pool，source=guest。
      自由文字：帶 text，可帶 lang；先過規則引擎，命中單一部門就進 pool，否則進 triage。
      LLM 只做翻譯與建議，不直接決定歸屬（基線 FR-003）。
      進 pool 時推播該部門員工（PushPayload.event=pool_new_request），並標示是否與收件人同樓層（FR-047）。
      同一房 10 分鐘內第 4 筆回 429（基線 E-01）。
    tags:
    - 住客掃碼 API
    parameters:
    - $ref: '../../components/parameters.yaml#/GuestSession'
    - $ref: '../../components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/住客掃碼.yaml#/CreateGuestRequestRequest'
    responses:
      '201':
        description: 已建立
        content:
          application/json:
            schema:
              $ref: '../../components/schemas/住客掃碼.yaml#/GuestRequest'
      '401':
        $ref: '../../components/responses.yaml#/Unauthorized'
      '422':
        $ref: '../../components/responses.yaml#/UnprocessableEntity'
      '429':
        $ref: '../../components/responses.yaml#/TooManyRequests'
cancelGuestRequest:
  post:
    operationId: cancelGuestRequest
    summary: 住客撤回需求
    description: >-
      只有 state 是 triage 或 pool 時能撤回，轉為 cancelled，cancel_reason=guest_withdrew；
      其他狀態回 409 state_conflict（基線 FR-006、E-04）。
      撤回 pool 中的需求時推播該部門員工（PushPayload.event=guest_withdrew），去處為待接池（FR-047）。
      只能撤回自己這次住宿（session 綁定的 reservation）的需求，其他的回 404。
    tags:
    - 住客掃碼 API
    parameters:
    - $ref: '../../components/parameters.yaml#/GuestSession'
    - $ref: '../../components/parameters.yaml#/GuestRequestId'
    - $ref: '../../components/parameters.yaml#/IdempotencyKey'
    responses:
      '200':
        description: 成功
        content:
          application/json:
            schema:
              $ref: '../../components/schemas/住客掃碼.yaml#/GuestRequest'
      '401':
        $ref: '../../components/responses.yaml#/Unauthorized'
      '404':
        $ref: '../../components/responses.yaml#/NotFound'
      '409':
        $ref: '../../components/responses.yaml#/Conflict'
