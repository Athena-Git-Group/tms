guestSessionsScan:
  post:
    operationId: guestSessionsScan
    summary: 櫃檯替住客開一個住客 session
    description: >-
      櫃檯或主管替某間房的住客開一個住客 session，住客拿回應裡的 sessionToken 就能提需求、看進度。
      只有 frontdesk、manager、duty_manager 可以呼叫；沒登入回 401 unauthorized，其他角色回 403 forbidden。
      飯店一律取自呼叫者登入的那家飯店，請求內容不帶飯店。
      roomId 必須是這家飯店的房間；有帶 reservationId 時，這筆訂單也必須屬於這家飯店而且是這間房的，
      任一條不符都回 404 not_found，不透露別家飯店有沒有這筆資料。
      沒帶 reservationId 時用這間房目前入住中的訂單；這間房目前沒有住客時回 409 room_vacant。
      session 什麼時候到期由後端決定，呼叫端不能指定：到期時間就是綁定那筆訂單的退房時刻（reservations_cache.checkout_at，
      PMS 給的退房日期與時刻，不是退房日的午夜），和住客自己掃房間 QR 開的 session 用同一條規則，兩個入口開出來的 session 一樣時候失效。
      綁定的訂單已經過了退房時刻（checkout_at 不晚於現在）時回 409 reservation_ended，不開一個一出生就過期的 session。
      回應的 expiresAt 就是這個到期時間。
      sessionToken 由伺服器產生，格式是「飯店編號.隨機字串」（例如 1.Qm9hdC1zaGVk…），
      隨機字串是 32 個位元組的安全亂數，呼叫端不能自己指定。
      這個前綴讓伺服器在查 session 之前就知道該在哪家飯店的資料裡找。
    tags:
    - 住客掃碼 API
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/住客掃碼.yaml#/guest_sessionsRequest'
    responses:
      '200':
        description: 成功，回剛開好的住客 session，sessionToken 就是住客之後要帶的權杖，expiresAt 是後端定的到期時間（綁定訂單的退房時刻）。
        content:
          application/json:
            schema:
              $ref: '../../components/schemas/住客掃碼.yaml#/guest_sessions'
      '401':
        $ref: '../../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../../components/responses.yaml#/NotFound'
      '409':
        $ref: '../../components/responses.yaml#/Conflict'
      '422':
        $ref: '../../components/responses.yaml#/UnprocessableEntity'
listGuestRequestsAndcreateGuestRequest:
  get:
    operationId: listGuestRequests
    summary: 住客查看自己本次住宿的需求
    description: >-
      只用 session 綁定的 reservation_id 過濾，不按房號查（基線 FR-005）。
      櫃檯當場回答的需求，回應的 answer 帶回覆全文，住客的進度頁據此顯示櫃檯的回覆。
    tags:
    - 住客掃碼 API
    parameters:
    - $ref: '../../components/parameters.yaml#/GuestSession'
    responses:
      '200':
        description: 成功
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../../components/schemas/住客掃碼.yaml#/GuestRequest'
      '401':
        $ref: '../../components/responses.yaml#/Unauthorized'
  post:
    operationId: createGuestRequest
    summary: 住客建立需求
    description: >-
      支援兩種需求：
      勾選單：帶 itemId，依 tenant_config.request_menu 預先對應的部門直接進 pool，source=guest。
      自由文字：帶 text，可帶 lang；先過規則引擎，命中單一部門就進 pool，否則進 triage。
      LLM 只做翻譯與建議，不直接決定歸屬（基線 FR-003）。
      進 pool 時推播該部門員工（PushPayload.event=pool_new_request），並標示是否與收件人同樓層（FR-047）。
      同一房 10 分鐘內第 4 筆回 429（基線 E-01）。
    tags:
    - 住客掃碼 API
    parameters:
    - $ref: '../../components/parameters.yaml#/GuestSession'
    - $ref: '../../components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/住客掃碼.yaml#/CreateGuestRequestRequest'
    responses:
      '201':
        description: 已建立
        content:
          application/json:
            schema:
              $ref: '../../components/schemas/住客掃碼.yaml#/GuestRequest'
      '401':
        $ref: '../../components/responses.yaml#/Unauthorized'
      '422':
        $ref: '../../components/responses.yaml#/UnprocessableEntity'
      '429':
        $ref: '../../components/responses.yaml#/TooManyRequests'
cancelGuestRequest:
  post:
    operationId: cancelGuestRequest
    summary: 住客撤回需求
    description: >-
      只有 state 是 triage 或 pool 時能撤回，轉為 cancelled，cancel_reason=guest_withdrew；
      其他狀態回 409 state_conflict（基線 FR-006、E-04）。
      撤回 pool 中的需求時推播該部門員工（PushPayload.event=guest_withdrew），去處為待認領（FR-047）。
      只能撤回自己這次住宿（session 綁定的 reservation）的需求，其他的回 404。
    tags:
    - 住客掃碼 API
    parameters:
    - $ref: '../../components/parameters.yaml#/GuestSession'
    - $ref: '../../components/parameters.yaml#/GuestRequestId'
    - $ref: '../../components/parameters.yaml#/IdempotencyKey'
    responses:
      '200':
        description: 成功
        content:
          application/json:
            schema:
              $ref: '../../components/schemas/住客掃碼.yaml#/GuestRequest'
      '401':
        $ref: '../../components/responses.yaml#/Unauthorized'
      '404':
        $ref: '../../components/responses.yaml#/NotFound'
      '409':
        $ref: '../../components/responses.yaml#/Conflict'
