listStaffAccounts:
  get:
    operationId: listStaffAccounts
    summary: list staff_accounts
    tags:
    - 員工帳號與登入 API
    responses:
      '200':
        description: 成功
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../../components/schemas/員工帳號與登入.yaml#/staff_accounts'
staffAccountsLogin:
  post:
    operationId: staffAccountsLogin
    summary: 員工登入
    description: >-
      用員工編號（loginId）＋明文密碼登入，後端雜湊比對 staff_accounts.passwordHash，換發 JWT（TTL 12h）。
      密碼錯誤或員工編號不存在一律回 401 credentials_invalid，提示「員工編號或密碼不正確」，不洩漏員工編號是否存在。
      連續輸入錯誤密碼達 5 次鎖定 15 分鐘，鎖定期間即使密碼正確也回 429 account_locked
      （context 帶 lockedUntil、remainingMinutes）。帳號停用（active=false）一律回 403 account_disabled，
      即使密碼正確也不放行，歷史資料保留。臨時密碼登入成功仍回 200，body 的 mustChangePassword=true，
      完成改密前這組憑證呼叫其他需要身分的 API 一律被拒。
    tags:
    - 員工帳號與登入 API
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/員工帳號與登入.yaml#/LoginRequest'
    responses:
      '200':
        description: 成功
        content:
          application/json:
            schema:
              $ref: '../../components/schemas/員工帳號與登入.yaml#/LoginResponse'
      '400':
        $ref: '../../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../../components/responses.yaml#/Forbidden'
      '429':
        $ref: '../../components/responses.yaml#/TooManyRequests'
changeOwnPassword:
  post:
    operationId: changeOwnPassword
    summary: 設定新密碼
    description: >-
      本人變更自己的密碼：後端重新雜湊 newPassword 寫入 staff_accounts.passwordHash，
      清掉 must_change_password 旗標，並換發一組新的 JWT（TTL 12h）回傳，
      App 直接拿換發的 token 進首頁，不必再跑一次登入。
      這條端點在 mustChangePassword=true 時一定要能用——臨時密碼登入後其他需要身分的業務端點一律被拒（403），
      但這條是完成改密的唯一合法路徑，必須放行，否則員工會卡死在改密畫面。
      強制改密情境（mustChangePassword=true）身分已由登入換得的 token 證明，不需要帶 currentPassword；
      自願變更情境必須帶，省略或空白回 422 current_password_required，比對不符回 401 current_password_invalid。
      新密碼與目前密碼相同回 422 new_password_invalid；密碼強度規則（長度下限、字元組成）
      truth 目前沒有定義，待 `/dsl-refine` 補口徑後再加，不在此處發明門檻。
      改密成功後舊 token 立即失效，其他裝置上的既有登入要重新登入。
    tags:
    - 員工帳號與登入 API
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/員工帳號與登入.yaml#/ChangePasswordRequest'
    responses:
      '200':
        description: 成功。形狀與登入相同，帶換發的 token，且 mustChangePassword 必為 false。
        content:
          application/json:
            schema:
              $ref: '../../components/schemas/員工帳號與登入.yaml#/LoginResponse'
      '400':
        $ref: '../../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../../components/responses.yaml#/Forbidden'
      '422':
        $ref: '../../components/responses.yaml#/UnprocessableEntity'
registerPushTokenAndRevokePushToken:
  put:
    operationId: registerPushToken
    summary: 登記本人這台手機的推播地址
    description: >-
      App 向 FCM 取得推播地址（token）後回報給後端，之後 outbox 的推播事件由推播消費者送到這台手機。
      身分取自登入憑證，請求不帶員工 id。以 deviceFingerprint 認「哪一台手機」：同一台重複登記只更新
      pushToken 與 platform、並清掉 revoked_at，不新增列（staff_devices 一台手機一列）。
      地址會因為 App 重裝、FCM 輪替而變，App 每次啟動與 token 更新時都應呼叫一次，
      登出時呼叫 DELETE 解除。缺 deviceFingerprint、pushToken 或 platform，或 platform 不是 ios／android，回 422。
    tags:
    - 員工帳號與登入 API
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/員工帳號與登入.yaml#/PushTokenRegisterRequest'
    responses:
      '204':
        description: 已登記
      '401':
        $ref: '../../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../../components/responses.yaml#/Forbidden'
      '422':
        $ref: '../../components/responses.yaml#/UnprocessableEntity'
  delete:
    operationId: revokePushToken
    summary: 解除本人這台手機的推播
    description: >-
      App 登出時呼叫：把 staff_devices 該列的 revoked_at 標上，之後的推播不再送這台手機。
      只標記不刪列，之後同一台重新登入再 PUT 一次即恢復。沒有這台手機的登記也回 204。
    tags:
    - 員工帳號與登入 API
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/員工帳號與登入.yaml#/PushTokenRevokeRequest'
    responses:
      '204':
        description: 已解除
      '401':
        $ref: '../../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../../components/responses.yaml#/Forbidden'
      '422':
        $ref: '../../components/responses.yaml#/UnprocessableEntity'
