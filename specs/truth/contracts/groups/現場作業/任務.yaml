              $ref: '../../components/schemas/任務.yaml#/tasks'
      '400':
        $ref: '../../components/responses.yaml#/BadRequest'
readTasks:
  get:
    operationId: readTasks
    summary: 查看任務詳情
    description: >-
      回傳任務本體，加上本 plan 新增的員工視角欄位：
      inspection、免查鎖定值、已做分鐘、停住原因、SOP 勾記與跳過項；
      同房交辦（主管交代或接手進度、交班單中該房的項目、櫃檯備註；樓層層級的項目不併入）；
      呼叫者的交辦已讀狀態；
      查房退回資訊（不合格項、重做次數、換人原因合併成一則，不另列為主管交代）；
      同房未撤回的工務單。
      這個查詢不寫交辦已讀紀錄。
    tags:
    - 任務 API
    parameters:
    - $ref: '../../components/parameters.yaml#/TaskId'
    responses:
      '200':
        description: 成功
        content:
          application/json:
            schema:
              $ref: '../../components/schemas/任務.yaml#/TaskDetail'
      '404':
        $ref: '../../components/responses.yaml#/NotFound'
