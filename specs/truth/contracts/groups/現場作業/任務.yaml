tasksDefer:
  post:
    operationId: tasksDefer
    summary: 延後任務
    description: >-
      有兩種呼叫者：
      (1) 主管把 pool 的任務延後，pool→deferred，沒有負責人；隔日自動回池，也可以 undefer。
      (2) 負責人把自己名下 accepted 的任務延後，accepted→deferred，保留負責人；由班末掃描退池，不適用隔日回池與 undefer。
      reason 是預設原因或自填文字，去掉頭尾空白後必須是 1–60 字，否則回 422 reason_invalid。
      延後也視為已讀交辦。
    tags:
    - 任務 API
    parameters:
    - $ref: '../../components/parameters.yaml#/TaskId'
    - $ref: '../../components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/任務.yaml#/HoldReasonRequest'
    responses:
      '200':
        description: 成功
        content:
          application/json:
            schema:
              $ref: '../../components/schemas/任務.yaml#/TaskDetail'
      '403':
        $ref: '../../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../../components/responses.yaml#/NotFound'
      '409':
        $ref: '../../components/responses.yaml#/Conflict'
      '422':
        $ref: '../../components/responses.yaml#/UnprocessableEntity'
tasksUndefer:
  post:
    operationId: tasksUndefer
    summary: 主管取消延後
    description: 主管把主管延後（沒有負責人）的 deferred 任務送回 pool。本人延後（有負責人）的任務回 409 state_conflict。
    tags:
    - 任務 API
    parameters:
    - $ref: '../../components/parameters.yaml#/TaskId'
    - $ref: '../../components/parameters.yaml#/IdempotencyKey'
    responses:
      '200':
