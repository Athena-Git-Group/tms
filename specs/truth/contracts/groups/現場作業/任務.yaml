tasksStart:
  post:
    operationId: tasksStart
    summary: 開始任務
    description: >-
      負責人開工，接受 accepted→doing，也接受本人延後的 deferred→doing。
      開工當下依租戶設定 inspection_waived_cleaning_types 鎖定是否免查房，並把交辦標為已讀。
      同一位員工已有另一筆 doing 時，回 409 doing_task_exists，context 帶那一筆的 taskId 與 roomNo，
      message 例如「305 還在進行中」。
      主管延後（沒有負責人）的 deferred 不能直接開工。
    tags:
    - 任務 API
    parameters:
    - $ref: '../../components/parameters.yaml#/TaskId'
    - $ref: '../../components/parameters.yaml#/IdempotencyKey'
    responses:
      '200':
        description: 成功
        content:
          application/json:
            schema:
              $ref: '../../components/schemas/任務.yaml#/TaskDetail'
      '403':
        $ref: '../../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../../components/responses.yaml#/NotFound'
      '409':
        $ref: '../../components/responses.yaml#/Conflict'
tasksComplete:
  post:
    operationId: tasksComplete
    summary: 完成任務
    description: >-
      負責人完成 doing 的任務。實際工時等於各段 doing 期間的總和，不含中斷期間。
      打掃任務：未勾也未跳過的 SOP 項記為跳過。開工時鎖定為免查的，直接轉 inspected、inspection=waived，
      PMS 回寫 occupied_clean（OC）；其他的轉 done 等查房。
      修繕任務（工務單）：photoIds 至少 1 張，否則回 422 completion_photo_required；resolutionNote 選填。
      判斷不需維修也用完成結案，並在 resolutionNote 註明。resolutionType 選填（fixed／temporary／cannot_fix，
      省略視為 fixed）：temporary 會自動建立追蹤單並進工務待認領；cannot_fix 會把房況轉為停用待確認
      （rooms.hk_state=out_of_order）。
      工務單完成時推播報修人，連結的原任務停住原因改為「工務已修好：<類別>」，但原任務不自動恢復。
      完修後的工務單新增「等主管驗收」子狀態（不開新狀態值，見 RepairTicket.verifiedBy／verifiedAt）；
      主管驗收通過後呼叫 verifyRepairTicket。
      回應除了剛完成的任務詳情，另外帶完成畫面要用的兩個值（見 TaskCompletion）：
      nextStep 是接下來該去哪一間（next_task／unfinished_task／all_clear 三種去向），
      cleaningDoneToday 是今天完成的第幾張打掃單（只有打掃類帶）。
      兩者都在這一次往返內給完，App 不為了畫完成畫面再查一次今日進度。
    tags:
    - 任務 API
    parameters:
    - $ref: '../../components/parameters.yaml#/TaskId'
    - $ref: '../../components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/任務.yaml#/CompleteTaskRequest'
    responses:
      '200':
        description: 成功
        content:
          application/json:
            schema:
              $ref: '../../components/schemas/任務.yaml#/TaskCompletion'
      '404':
        $ref: '../../components/responses.yaml#/NotFound'
      '409':
        $ref: '../../components/responses.yaml#/Conflict'
      '422':
        $ref: '../../components/responses.yaml#/UnprocessableEntity'
tasksCancel:
  post:
    operationId: tasksCancel
    summary: 主管作廢任務
    description: >-
      主管把任何未完成態的任務轉為 cancelled，必須附原因 manager_void 或 plan_superseded。
      note 是給負責人的說明，例如「住客延後退房」。
      任務有負責人時，推播「<房號> 已被主管作廢」，去處是該任務頁。
      作廢因工務單而中斷的原任務時，工務單維持原狀（推定，見 spec 邊界情況的 NEEDS CLARIFICATION）。
      員工撤回工務單請用 withdrawRepairTicket；住客撤回需求請用 cancelGuestRequest。
    tags:
    - 任務 API
    parameters:
    - $ref: '../../components/parameters.yaml#/TaskId'
    - $ref: '../../components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/任務.yaml#/CancelTaskRequest'
    responses:
      '200':
        description: 成功
        content:
          application/json:
            schema:
              $ref: '../../components/schemas/任務.yaml#/tasks'
      '403':
        $ref: '../../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../../components/responses.yaml#/NotFound'
      '409':
        $ref: '../../components/responses.yaml#/Conflict'
