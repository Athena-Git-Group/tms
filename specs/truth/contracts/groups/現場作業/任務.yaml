              type: array
              items:
                $ref: '../../components/schemas/任務.yaml#/tasks'
  post:
    operationId: createTasks
    summary: create tasks
    tags:
    - 任務 API
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/任務.yaml#/tasksRequest'
    responses:
