      '409':
        $ref: '../../components/responses.yaml#/Conflict'
tasksInterrupt:
  post:
    operationId: tasksInterrupt
    summary: 中斷自己進行中的任務
    description: >-
      負責人把自己 doing 的任務轉為 interrupted：暫停計時，已做分鐘停在當下；保留 SOP 勾記與負責人。
      reason 的規則同 tasksDefer。
      要開工務單並同時中斷原任務，請用 createRepairTicket 並設 interruptSourceTask=true，
      停住原因由系統記為「等工務：<類別>」。
    tags:
    - 任務 API
    parameters:
    - $ref: '../../components/parameters.yaml#/TaskId'
    - $ref: '../../components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/任務.yaml#/HoldReasonRequest'
    responses:
      '200':
        description: 成功
        content:
          application/json:
            schema:
              $ref: '../../components/schemas/任務.yaml#/TaskDetail'
      '403':
        $ref: '../../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../../components/responses.yaml#/NotFound'
      '409':
        $ref: '../../components/responses.yaml#/Conflict'
      '422':
        $ref: '../../components/responses.yaml#/UnprocessableEntity'
tasksResume:
  post:
    operationId: tasksResume
    summary: 恢復自己中斷的任務
    description: >-
      負責人把自己 interrupted 的任務轉回 doing。已做分鐘從中斷前的累計接續，不含中斷期間。
      中斷時記下的停住原因在這一步清空（回應的 holdReason 為 null）——
      那張單已經接回來做了，停住原因留著會讓任務頁繼續顯示一個已經不成立的理由。
      同一位員工已有另一筆 doing 時，回 409 doing_task_exists，規則同 tasksStart：
      context 帶那一筆的 taskId 與 roomNo，message 例如「302 還在進行中」。
    tags:
    - 任務 API
    parameters:
    - $ref: '../../components/parameters.yaml#/TaskId'
    - $ref: '../../components/parameters.yaml#/IdempotencyKey'
    responses:
      '200':
        description: 成功
        content:
          application/json:
            schema:
              $ref: '../../components/schemas/任務.yaml#/TaskDetail'
      '403':
        $ref: '../../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../../components/responses.yaml#/NotFound'
      '409':
        $ref: '../../components/responses.yaml#/Conflict'
