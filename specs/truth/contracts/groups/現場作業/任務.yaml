listTasksAndcreateTasks:
  get:
    operationId: listTasks
    summary: list tasks
    tags:
    - 任務 API
    responses:
      '200':
        description: 成功
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../../components/schemas/任務.yaml#/tasks'
  post:
    operationId: createTasks
    summary: create tasks
    tags:
    - 任務 API
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/任務.yaml#/tasksRequest'
    responses:
      '201':
        description: 成功
        content:
          application/json:
            schema:
              $ref: '../../components/schemas/任務.yaml#/tasks'
      '400':
        $ref: '../../components/responses.yaml#/BadRequest'
readTasks:
  get:
    operationId: readTasks
    summary: 查看任務詳情
    description: >-
      回傳任務本體，加上本 plan 新增的員工視角欄位：
      inspection、免查鎖定值、已做分鐘、停住原因、SOP 勾記與跳過項；
      同房交辦（主管交代或接手進度、交班單中該房的項目、櫃檯備註；樓層層級的項目不併入）；
      呼叫者的交辦已讀狀態；
      查房退回資訊（不合格項、重做次數、換人原因合併成一則，不另列為主管交代）；
      同房未撤回的工務單。
      這個查詢不寫交辦已讀紀錄。
    tags:
    - 任務 API
    parameters:
    - $ref: '../../components/parameters.yaml#/TaskId'
    responses:
      '200':
        description: 成功
        content:
          application/json:
            schema:
              $ref: '../../components/schemas/任務.yaml#/TaskDetail'
      '404':
        $ref: '../../components/responses.yaml#/NotFound'
tasksClaim:
  post:
    operationId: tasksClaim
    summary: claim
    description: >-
      把部門待認領裡的單認領到自己名下，pool→accepted。現場員工認領自己部門的池。
      主管也能認領，讓人手不夠時主管自己下場做：房務主管（role=manager 且 dept 不是 engineering，含沒有部門的主管）
      認領房務池的單，工務主管（role=manager 且 dept=engineering）認領工務池的單；
      主管認領另一個部門的單回 403 forbidden，單與事件都不變。
      同一張單兩人同時認領時只有先到的成立，後到的回 409 state_conflict，message 帶先搶到的人，例如「這單已被小美認領」。
    tags:
    - 任務 API
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/任務.yaml#/tasksRequest'
    responses:
      '200':
        description: 成功
        content:
          application/json:
            schema:
              $ref: '../../components/schemas/任務.yaml#/tasks'
      '400':
        $ref: '../../components/responses.yaml#/BadRequest'
      '403':
        $ref: '../../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../../components/responses.yaml#/NotFound'
      '409':
        $ref: '../../components/responses.yaml#/Conflict'
tasksStart:
  post:
    operationId: tasksStart
    summary: 開始任務
    description: >-
      負責人開工，接受 accepted→doing，也接受本人延後的 deferred→doing。
      開工當下依飯店的「需要房務主管查房」鎖定是否免查房，並把交辦標為已讀：
      開關關掉時（tenant_config.inspection_waived_enabled 為 true，即 DeskSettings.inspectionRequired 為 false），
      打掃單的 tasks.inspection_waived 鎖成 true，其他類型一律 false。不分打掃種類。鎖定之後改設定不影響這一次的完成；
      查房或抽查退回重做的單回到 accepted，重新開工時照那一刻的開關再決定一次。
      同一位員工已有另一筆 doing 時，回 409 doing_task_exists，context 帶那一筆的 taskId 與 roomNo，
      message 例如「305 還在進行中」。
      主管延後（沒有負責人）的 deferred 不能直接開工。
    tags:
    - 任務 API
    parameters:
    - $ref: '../../components/parameters.yaml#/TaskId'
    - $ref: '../../components/parameters.yaml#/IdempotencyKey'
    responses:
      '200':
        description: 成功
        content:
          application/json:
            schema:
              $ref: '../../components/schemas/任務.yaml#/TaskDetail'
      '403':
        $ref: '../../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../../components/responses.yaml#/NotFound'
      '409':
        $ref: '../../components/responses.yaml#/Conflict'
tasksComplete:
  post:
    operationId: tasksComplete
    summary: 完成任務
    description: >-
      負責人完成 doing 的任務。實際工時等於各段 doing 期間的總和，不含中斷期間。
      打掃任務：未勾也未跳過的 SOP 項記為跳過。開工時鎖定為免查的，直接轉 inspected、inspection=waived，
      不回寫 PMS 房況（沒有人查過，不能讓 PMS 當成可售）；其他的轉 done 等查房。
      修繕任務（工務單）：resolutionType 選填，四選一（fixed／temporary／cannot_fix／no_action_needed，省略視為 fixed）；
      resolutionNote 選填。fixed、temporary、cannot_fix 這一次請求的 photoIds 至少 1 張，否則回 422 completion_photo_required；
      每張的檢查與錯誤碼（photo_not_uploaded、photo_purpose_mismatch、photo_already_attached）見 CompleteTaskRequest.photoIds；
      完成後工務單轉 done（已完修、等主管驗收），之後由主管呼叫 verifyRepairTicket 通過或不通過。
      飯店把「需要工務主管驗收」關掉時（tenant_config.repair_verification_required 為 false，即 DeskSettings.repairVerificationRequired 為 false），
      這三種結果改成直接轉 closed（已結案）並寫入結束時間，不進待驗收，驗收人與驗收時間留空，
      completed 事件的 payload 另帶 verificationWaived: true。這個開關在按完成這一刻讀：開工時是開、完成前被關掉的單照樣直接結案。
      temporary 另外自動建立追蹤單並進工務待認領；cannot_fix 會把房況轉為停用待確認（rooms.hk_state=out_of_order）；兩者不論要不要驗收都照做。
      no_action_needed（不需處理）的 photoIds 可省略或為空陣列，不建追蹤單、不改房況，工務單直接轉 closed（已結案），
      不進待驗收、不計入任何主管的待驗收。
      驗收不通過退回重修的工務單，再完修時以這一次的完修結果、說明與照片為準。
      工務單完成時（四種結果都一樣）推播報修人，連結的原任務停住原因改為「工務已修好：<類別>」，但原任務不自動恢復。
      回應 TaskCompletion 的 state 就說明結果：done 是進入待驗收，closed 是直接結案。
      回應除了剛完成的任務詳情，另外帶完成畫面要用的兩個值（見 TaskCompletion）：
      nextStep 是接下來該去哪一間（next_task／unfinished_task／all_clear 三種去向），
      cleaningDoneToday 是今天完成的第幾張打掃單（只有打掃類帶）。
      兩者都在這一次往返內給完，App 不為了畫完成畫面再查一次今日進度。
    tags:
    - 任務 API
    parameters:
    - $ref: '../../components/parameters.yaml#/TaskId'
    - $ref: '../../components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/任務.yaml#/CompleteTaskRequest'
    responses:
      '200':
        description: 成功
        content:
          application/json:
            schema:
              $ref: '../../components/schemas/任務.yaml#/TaskCompletion'
      '404':
        $ref: '../../components/responses.yaml#/NotFound'
      '409':
        $ref: '../../components/responses.yaml#/Conflict'
      '422':
        $ref: '../../components/responses.yaml#/UnprocessableEntity'
tasksCancel:
  post:
    operationId: tasksCancel
    summary: 主管作廢任務
    description: >-
      主管把任何未完成態的任務轉為 cancelled，必須附原因 manager_void 或 plan_superseded。
      note 是給負責人的說明，例如「住客延後退房」。
      任務有負責人時，推播「<房號> 已被主管作廢」，去處是該任務頁。
      作廢因工務單而中斷的原任務時，工務單維持原狀（推定，見 spec 邊界情況的 NEEDS CLARIFICATION）。
      員工撤回工務單請用 withdrawRepairTicket；住客撤回需求請用 cancelGuestRequest。
    tags:
    - 任務 API
    parameters:
    - $ref: '../../components/parameters.yaml#/TaskId'
    - $ref: '../../components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/任務.yaml#/CancelTaskRequest'
    responses:
      '200':
        description: 成功
        content:
          application/json:
            schema:
              $ref: '../../components/schemas/任務.yaml#/tasks'
      '403':
        $ref: '../../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../../components/responses.yaml#/NotFound'
      '409':
        $ref: '../../components/responses.yaml#/Conflict'
tasksRate:
  post:
    operationId: tasksRate
    summary: rate
    description: >-
      住客為一張需求評 1 到 5 星，一張只能評一次。只在需求已經結束時收：tasks.ended_at 有值，而且 state 是 done、inspected 或 closed。
      還在等房務主管查房或等主管驗收的單（state 為 done 而 ended_at 為 null）、已取消的單、已評過的單回 409 state_conflict。
      這和住客頁顯示「已完成」的時機相同（見 GuestRequest.endedAt）。櫃檯當場回答的單後端不另外擋，住客頁不顯示評分卡。
      住客頁實際呼叫的 /guest/requests/{id}/rating 照同一條規則。
    tags:
    - 任務 API
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/任務.yaml#/tasksRequest'
    responses:
      '200':
        description: 成功
        content:
          application/json:
            schema:
              $ref: '../../components/schemas/任務.yaml#/tasks'
      '400':
        $ref: '../../components/responses.yaml#/BadRequest'
      '404':
        $ref: '../../components/responses.yaml#/NotFound'
      '409':
        $ref: '../../components/responses.yaml#/Conflict'
