createRepairPhoto:
  post:
    operationId: createRepairPhoto
    summary: 建立一張工務單照片的上傳位置
    description: >-
      照片採兩段式：先建立照片 id，再用 uploadRepairPhotoContent 上傳內容，最後在開單、補照片或完修時引用 id。
      壓縮（長邊 1600px、JPEG）與「房號 · 拍攝時間」浮水印在 App 端完成，後端不做影像處理。
    tags:
    - 工務單 API
    parameters:
    - $ref: '../../components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/工務單.yaml#/CreateRepairPhotoRequest'
    responses:
      '201':
        description: 已建立，status=pending。
        content:
          application/json:
            schema:
              $ref: '../../components/schemas/工務單.yaml#/RepairPhoto'
      '422':
        $ref: '../../components/responses.yaml#/UnprocessableEntity'
uploadRepairPhotoContent:
  put:
    operationId: uploadRepairPhotoContent
    summary: 上傳或重試一張照片的內容
    description: 上傳成功後 status=uploaded。上傳失敗時用同一個照片 id 重送，只需重試失敗的那張。這個操作是冪等的。
    tags:
    - 工務單 API
    parameters:
    - $ref: '../../components/parameters.yaml#/PhotoId'
    requestBody:
      required: true
      content:
        image/jpeg:
          schema:
            type: string
            format: binary
    responses:
      '200':
        description: 成功
        content:
          application/json:
            schema:
              $ref: '../../components/schemas/工務單.yaml#/RepairPhoto'
      '404':
        $ref: '../../components/responses.yaml#/NotFound'
      '422':
        $ref: '../../components/responses.yaml#/UnprocessableEntity'
precheckRepairTicket:
  post:
    operationId: precheckRepairTicket
    summary: 開單前檢查（選類別時呼叫）
    description: >-
      報修人選定類別時呼叫。這個操作不建立工務單。
      重複提示：同房、同類別、還沒完修也沒結案（不是 done、closed 也不是 cancelled）的工務單存在時，回傳它的單號與狀態，
      並記錄呼叫者可以對那張單補照片。
      急件判定：系統依飯店設定規則判定是否為急件（例如房間今日有入住或是 VIP），回傳 urgentJudgement，
      suggested=true 時 rule 附判定理由，例如「VIP · 15:00 入住」；房務不能更改這個判定結果，只能由主管事後降級。
    tags:
    - 工務單 API
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/工務單.yaml#/RepairTicketPrecheckRequest'
    responses:
      '200':
        description: 成功
        content:
          application/json:
            schema:
              $ref: '../../components/schemas/工務單.yaml#/RepairTicketPrecheckResponse'
      '404':
        $ref: '../../components/responses.yaml#/NotFound'
listRepairTicketsAndcreateRepairTicket:
  get:
    operationId: listRepairTickets
    summary: 列出同房的工務單
    description: >-
      依房間列出未撤回的工務單，給原任務頁的工務單區使用（FR-021）。
      這是同房工務單清單的唯一來源——readTasks 的任務詳情**不**另外帶一份，
      任務頁要列同房工務單就打這一支，避免同一筆資料有兩個權威來源。
    tags:
    - 工務單 API
    parameters:
    - name: roomId
      in: query
      required: true
      schema:
        type: string
        format: uuid
    responses:
      '200':
        description: 成功
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../../components/schemas/shared.yaml#/RepairTicketSummary'
  post:
    operationId: createRepairTicket
    summary: 開立工務單
    description: >-
      工務單是工務部門的修繕任務（dept=engineering、type=repair）。三種開單路徑：
      ①房務從自己未取消的任務開立（帶 sourceTaskId，房號由原任務帶入，tasks.source=staff）；
      ②工務不經過任何房務任務直接為房間或公共區域開單（帶 roomId 或 isPublicArea，tasks.source=staff）；
      ③櫃檯交辦開單（帶 roomId 或 isPublicArea，tasks.source=desk，PoolItem.source 顯示「櫃檯」）。
      照片 1–3 張，而且每張都必須已上傳（status=uploaded）；否則回 422，不建立工務單，原任務也不變。
      interruptSourceTask=true 時同時把 doing 的原任務轉為 interrupted，停住原因記為「等工務：<類別>」並連結單號；
      只有帶 sourceTaskId 時才有意義。
      assigneeId 有值時（僅限路徑②③）直接指派處理人、accepted 給該人，略過工務待認領。
      請求不接受急件欄位：急件由系統依飯店設定規則判定（寫入 isUrgent 與 urgentJudgement），
      判定為急件時排在工務待認領的所有非急件之前，並推播該租戶所有工務與主管；判定結果開單時房務不能更改，
      只能由主管事後呼叫 downgradeRepairTicketUrgency 降級為一般件。
      送出後的去向：assigneeId 有值時直接 accepted；其他一律直接進工務待認領（pool），不分一般件與急件、不分三種開單路徑。
      工務單沒有主管審核這一關，完修後才由主管驗收（verifyRepairTicket）。
      必須帶 Idempotency-Key；離線重送時回放第一次的回應，不會產生第二張單。
    tags:
    - 工務單 API
    parameters:
    - $ref: '../../components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/工務單.yaml#/CreateRepairTicketRequest'
    responses:
      '201':
        description: 已建立
        content:
          application/json:
            schema:
              $ref: '../../components/schemas/工務單.yaml#/RepairTicket'
      '403':
        $ref: '../../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../../components/responses.yaml#/NotFound'
      '409':
        $ref: '../../components/responses.yaml#/Conflict'
      '422':
        $ref: '../../components/responses.yaml#/UnprocessableEntity'
readRepairTicket:
  get:
    operationId: readRepairTicket
    summary: 查看工務單詳情
    description: >-
      回傳照片、類別、說明、處理進度、完修照片、完修結果與處理說明、驗收人，以及最近一次驗收不通過的原因、判定人與時間。
      報修人、原任務負責人、工務，以及所有主管（房務主管與工務主管，不分部門）都可以查看；
      主管不論從待驗收、推播或其他畫面進來，任何狀態的工務單都能打開。主管動作（驗收通過、驗收不通過）只在
      state=done（已完修、等主管驗收）時出現，其他狀態沒有主管動作。
      viewerIsAssignee 告訴 App 目前登入者是不是這張單的處理人，App 用它決定主管版要不要同時疊上處理人的動作。
      公共區域的單 roomNo 為 null、isPublicArea 為 true，地點說明在 title 或 description 裡。
    tags:
    - 工務單 API
    parameters:
    - $ref: '../../components/parameters.yaml#/RepairTicketId'
    responses:
      '200':
        description: 成功
        content:
          application/json:
            schema:
              $ref: '../../components/schemas/工務單.yaml#/RepairTicket'
      '404':
        $ref: '../../components/responses.yaml#/NotFound'
appendRepairTicketPhotos:
  post:
    operationId: appendRepairTicketPhotos
    summary: 補照片到工務單
    description: >-
      報修人，以及在該房開單前檢查時觸發這張單重複提示的員工，可以在工務單完修前補照片，每次 1–3 張，而且都必須已上傳。
      工務單已完修（done）、已結案（closed）或已撤回（cancelled）時回 409 ticket_closed；其他員工回 403。
      事件只記補了幾張，不含照片本體。
    tags:
    - 工務單 API
    parameters:
    - $ref: '../../components/parameters.yaml#/RepairTicketId'
    - $ref: '../../components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/工務單.yaml#/AppendRepairPhotosRequest'
    responses:
      '200':
        description: 成功
        content:
          application/json:
            schema:
              $ref: '../../components/schemas/工務單.yaml#/RepairTicket'
      '403':
        $ref: '../../components/responses.yaml#/Forbidden'
      '409':
        $ref: '../../components/responses.yaml#/Conflict'
      '422':
        $ref: '../../components/responses.yaml#/UnprocessableEntity'
withdrawRepairTicket:
  post:
    operationId: withdrawRepairTicket
    summary: 撤回工務單
    description: >-
      報修人在工務認領前撤回：pool→cancelled，原因 staff_withdrew，之後不再出現在工務待認領。
      已經被認領時回 409 already_claimed，message 為「已被工務認領」；
      已完修（done）、已結案（closed）或已撤回（cancelled）等其他狀態回 409 state_conflict。
    tags:
    - 工務單 API
    parameters:
    - $ref: '../../components/parameters.yaml#/RepairTicketId'
    - $ref: '../../components/parameters.yaml#/IdempotencyKey'
    responses:
      '200':
        description: 成功
        content:
          application/json:
            schema:
              $ref: '../../components/schemas/工務單.yaml#/RepairTicket'
      '403':
        $ref: '../../components/responses.yaml#/Forbidden'
      '409':
        $ref: '../../components/responses.yaml#/Conflict'
downgradeRepairTicketUrgency:
  post:
    operationId: downgradeRepairTicketUrgency
    summary: 主管將急件降級為一般件
    description: >-
      主管對既有急件工務單降級為一般件，必須附原因。急件判定本身是系統依飯店設定規則算出的，
      房務開單時不能更改，只有主管可以事後用這個操作降級；不能反向把一般件升為急件。
      降級後 isUrgent 轉為 false、urgentDowngradeReason 寫入原因；開單當下系統判定的原始結果與理由
      （urgentJudgement）維持不變，供追溯「當時為什麼被判定為急件」。
    tags:
    - 工務單 API
    parameters:
    - $ref: '../../components/parameters.yaml#/RepairTicketId'
    - $ref: '../../components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/工務單.yaml#/DowngradeRepairTicketUrgencyRequest'
    responses:
      '200':
        description: 成功
        content:
          application/json:
            schema:
              $ref: '../../components/schemas/工務單.yaml#/RepairTicket'
      '403':
        $ref: '../../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../../components/responses.yaml#/NotFound'
      '409':
        $ref: '../../components/responses.yaml#/Conflict'
      '422':
        $ref: '../../components/responses.yaml#/UnprocessableEntity'
verifyRepairTicket:
  post:
    operationId: verifyRepairTicket
    summary: 主管驗收已完修的工務單：通過或不通過
    description: >-
      一支端點、請求帶結果（VerifyRepairTicketRequest.result）。只開放主管角色（staff_accounts.role=manager），
      房務主管與工務主管都能呼叫，不分部門、不限開單人，工務主管也能驗收自己完修的單；其他角色回 403 forbidden。
      只有 state=done（已完修、等主管驗收）的工務單能被驗收；其他狀態（已結案 closed、退回重修中 accepted／pool、
      維修中、已撤回）回 409 state_conflict，與查房送出同一個錯誤碼，App 顯示「這張單已被處理」並刷新清單。
      兩位主管同時送出時，不論各自送的是通過還是不通過，只有先到的那一次成立，後到的拿到這個 409。
      通過（passed）：done→closed，同一交易寫入驗收人與驗收時間（RepairTicket.verifiedBy／verifiedAt），
      寫一筆任務事件 repair_verified；不推播任何人，不改房況（cannot_fix 的房間維持 out_of_order）。
      不通過（failed）：reason 去掉頭尾空白後為空回 422 verification_reason_required，單維持 done。
      成立時同一交易寫入最近一次不通過的原因、判定人與時間（RepairTicket.lastVerifyFailedReason／By／At），
      清空完修時間、完修結果與處理說明，寫一筆任務事件 repair_verification_failed，然後依換人判定退回工務重修：
      原處理人在班時回到他名下待開始（state=accepted，destination=assignee），並推播原處理人
      （PushPayload.event=repair_verification_failed）；原處理人接不了時（與查房退回同一套換人判定：
      請假中、現在落在飯店所有班別時段之外，或已過他最近一份排房班次的下班時間），回到工務待認領（state=pool，destination=pool），不推播原處理人，也不推播工務池。
      換人判定由後端做，App 不自己看班表，結果畫面照回應的 destination 與 assigneeName 說明單去了哪裡。
      不通過不改房況，也不動連結的原房務任務。重修後再完修會重新進入待驗收。
      必須帶 Idempotency-Key；訊號不穩重送時回放第一次的回應，不會判兩次。
      驗收用一支帶結果而不是通過、不通過各一支：兩種結果共用同一個前置狀態（done）與同一道先到先決的守衛，
      一支端點時兩位主管一個按通過、一個按不通過也只會撞同一個 409；App 也只需要一套送出、離線阻擋與冪等重送的寫法，
      結果卡直接讀同一個回應形狀。代價是請求多一個必填的 result 欄位。
    tags:
    - 工務單 API
    parameters:
    - $ref: '../../components/parameters.yaml#/RepairTicketId'
    - $ref: '../../components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/工務單.yaml#/VerifyRepairTicketRequest'
    responses:
      '200':
        description: 已記錄這次驗收，回應說明結果與單的去處。
        content:
          application/json:
            schema:
              $ref: '../../components/schemas/工務單.yaml#/RepairVerificationOutcome'
      '403':
        $ref: '../../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../../components/responses.yaml#/NotFound'
      '409':
        $ref: '../../components/responses.yaml#/Conflict'
      '422':
        $ref: '../../components/responses.yaml#/UnprocessableEntity'
releaseRepairTicketToPool:
  post:
    operationId: releaseRepairTicketToPool
    summary: 工務自行把公共區域的工務單放回工務待認領
    description: >-
      負責人（工務）自行放回，只允許公共區域（無房號）的工務單；客房工務單回 409
      room_ticket_not_requeueable，只能用既有的中斷／恢復機制暫停。與既有 tasksRequeue
      （主管在班末附交代幫整批退池）用途不同，不能混用。成功時 accepted／doing 轉為 pool，assignee 清空。
    tags:
    - 工務單 API
    parameters:
    - $ref: '../../components/parameters.yaml#/RepairTicketId'
    - $ref: '../../components/parameters.yaml#/IdempotencyKey'
    responses:
      '200':
        description: 成功
        content:
          application/json:
            schema:
              $ref: '../../components/schemas/工務單.yaml#/RepairTicket'
      '403':
        $ref: '../../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../../components/responses.yaml#/NotFound'
      '409':
        $ref: '../../components/responses.yaml#/Conflict'
