createRepairPhoto:
  post:
    operationId: createRepairPhoto
    summary: 建立一張工務單照片的上傳位置
    description: >-
      照片採兩段式：先建立照片 id，再用 uploadRepairPhotoContent 上傳內容，最後在開單、補照片或完修時引用 id。
      壓縮（長邊 1600px、JPEG）與「房號 · 拍攝時間」浮水印在 App 端完成，後端不做影像處理。
    tags:
    - 工務單 API
    parameters:
    - $ref: '../../components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/工務單.yaml#/CreateRepairPhotoRequest'
    responses:
      '201':
        description: 已建立，status=pending。
        content:
          application/json:
            schema:
              $ref: '../../components/schemas/工務單.yaml#/RepairPhoto'
      '422':
        $ref: '../../components/responses.yaml#/UnprocessableEntity'
uploadRepairPhotoContent:
  put:
    operationId: uploadRepairPhotoContent
    summary: 上傳或重試一張照片的內容
    description: 上傳成功後 status=uploaded。上傳失敗時用同一個照片 id 重送，只需重試失敗的那張。這個操作是冪等的。
    tags:
    - 工務單 API
    parameters:
    - $ref: '../../components/parameters.yaml#/PhotoId'
    requestBody:
      required: true
      content:
        image/jpeg:
          schema:
            type: string
            format: binary
    responses:
      '200':
        description: 成功
        content:
          application/json:
            schema:
              $ref: '../../components/schemas/工務單.yaml#/RepairPhoto'
      '404':
        $ref: '../../components/responses.yaml#/NotFound'
      '422':
        $ref: '../../components/responses.yaml#/UnprocessableEntity'
precheckRepairTicket:
  post:
    operationId: precheckRepairTicket
    summary: 開單前檢查（選類別時呼叫）
    description: >-
      報修人選定類別時呼叫。這個操作不建立工務單。
      重複提示：同房、同類別、還沒結案（不是 done 也不是 cancelled）的工務單存在時，回傳它的單號與狀態，
      並記錄呼叫者可以對那張單補照片。
      急件判定：系統依飯店設定規則判定是否為急件（例如房間今日有入住或是 VIP），回傳 urgentJudgement，
      suggested=true 時 rule 附判定理由，例如「VIP · 15:00 入住」；房務不能更改這個判定結果，只能由主管事後降級。
    tags:
    - 工務單 API
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/工務單.yaml#/RepairTicketPrecheckRequest'
    responses:
      '200':
        description: 成功
        content:
          application/json:
            schema:
              $ref: '../../components/schemas/工務單.yaml#/RepairTicketPrecheckResponse'
      '404':
        $ref: '../../components/responses.yaml#/NotFound'
listRepairTicketsAndcreateRepairTicket:
  get:
    operationId: listRepairTickets
    summary: 列出同房的工務單
    description: >-
      依房間列出未撤回的工務單，給原任務頁的工務單區使用（FR-021）。
      這是同房工務單清單的唯一來源——readTasks 的任務詳情**不**另外帶一份，
      任務頁要列同房工務單就打這一支，避免同一筆資料有兩個權威來源。
    tags:
    - 工務單 API
    parameters:
    - name: roomId
      in: query
      required: true
      schema:
        type: string
        format: uuid
    responses:
      '200':
        description: 成功
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../../components/schemas/shared.yaml#/RepairTicketSummary'
  post:
    operationId: createRepairTicket
    summary: 開立工務單
    description: >-
      工務單是工務部門的修繕任務（dept=engineering、type=repair）。三種開單路徑：
      ①房務從自己未取消的任務開立（帶 sourceTaskId，房號由原任務帶入，tasks.source=staff）；
      ②工務不經過任何房務任務直接為房間或公共區域開單（帶 roomId 或 isPublicArea，tasks.source=staff）；
      ③櫃檯交辦開單（帶 roomId 或 isPublicArea，tasks.source=desk，PoolItem.source 顯示「櫃檯」）。
      照片 1–3 張，而且每張都必須已上傳（status=uploaded）；否則回 422，不建立工務單，原任務也不變。
      interruptSourceTask=true 時同時把 doing 的原任務轉為 interrupted，停住原因記為「等工務：<類別>」並連結單號；
      只有帶 sourceTaskId 時才有意義。
      assigneeId 有值時（僅限路徑②③）直接指派處理人、accepted 給該人，略過工務待認領與審核。
      請求不接受急件欄位：急件由系統依飯店設定規則判定（寫入 isUrgent 與 urgentJudgement），
      判定為急件時排在工務待認領的所有非急件之前，並推播該租戶所有工務與主管；判定結果開單時房務不能更改，
      只能由主管事後呼叫 downgradeRepairTicketUrgency 降級為一般件。
      送出後的去向：assigneeId 有值時直接 accepted；系統判定急件、或路徑②③（工務自開／櫃檯交辦）一律直接進
      工務待認領（pool），不經主管審核；只有路徑①（房務報修）且非急件時先進 pending_review（等主管審核），
      主管核准（approveRepairTicket）後才轉 pool。
      必須帶 Idempotency-Key；離線重送時回放第一次的回應，不會產生第二張單。
    tags:
    - 工務單 API
    parameters:
    - $ref: '../../components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/工務單.yaml#/CreateRepairTicketRequest'
    responses:
      '201':
        description: 已建立
        content:
          application/json:
            schema:
              $ref: '../../components/schemas/工務單.yaml#/RepairTicket'
      '403':
        $ref: '../../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../../components/responses.yaml#/NotFound'
      '409':
        $ref: '../../components/responses.yaml#/Conflict'
      '422':
        $ref: '../../components/responses.yaml#/UnprocessableEntity'
readRepairTicket:
  get:
    operationId: readRepairTicket
    summary: 查看工務單詳情
    description: >-
      回傳照片、類別、說明、處理進度、完修照片、完修結果與處理說明。報修人、原任務負責人、工務，以及主管都可以查看；
      主管不論從待審核、待驗收、推播或其他畫面進來，任何狀態的工務單都能打開（FR-032），主管動作只在
      pending_review（核准／退回）與 done 且尚未驗收（驗收）兩種狀態出現，其他狀態沒有主管動作。
      公共區域的單 roomNo 為 null、isPublicArea 為 true，地點說明在 title 或 description 裡。
    tags:
    - 工務單 API
    parameters:
    - $ref: '../../components/parameters.yaml#/RepairTicketId'
    responses:
      '200':
        description: 成功
        content:
          application/json:
            schema:
              $ref: '../../components/schemas/工務單.yaml#/RepairTicket'
      '404':
        $ref: '../../components/responses.yaml#/NotFound'
appendRepairTicketPhotos:
  post:
    operationId: appendRepairTicketPhotos
    summary: 補照片到工務單
    description: >-
      報修人，以及在該房開單前檢查時觸發這張單重複提示的員工，可以在工務單結案前補照片，每次 1–3 張，而且都必須已上傳。
      工務單已 done 或 cancelled 時回 409 ticket_closed；其他員工回 403。
      事件只記補了幾張，不含照片本體。
    tags:
    - 工務單 API
    parameters:
    - $ref: '../../components/parameters.yaml#/RepairTicketId'
    - $ref: '../../components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/工務單.yaml#/AppendRepairPhotosRequest'
    responses:
      '200':
        description: 成功
        content:
          application/json:
            schema:
              $ref: '../../components/schemas/工務單.yaml#/RepairTicket'
      '403':
        $ref: '../../components/responses.yaml#/Forbidden'
      '409':
        $ref: '../../components/responses.yaml#/Conflict'
      '422':
        $ref: '../../components/responses.yaml#/UnprocessableEntity'
withdrawRepairTicket:
  post:
    operationId: withdrawRepairTicket
    summary: 撤回工務單
    description: >-
      報修人在工務認領前撤回：pool 或 pending_review（等主管審核）→cancelled，原因 staff_withdrew，
      之後不再出現在工務待認領。已經被認領時回 409 already_claimed，message 為「已被工務認領」；
      rejected（主管未核准）或已結案（done／cancelled）等其他狀態回 409 state_conflict。
    tags:
    - 工務單 API
    parameters:
    - $ref: '../../components/parameters.yaml#/RepairTicketId'
    - $ref: '../../components/parameters.yaml#/IdempotencyKey'
    responses:
      '200':
        description: 成功
        content:
          application/json:
            schema:
              $ref: '../../components/schemas/工務單.yaml#/RepairTicket'
      '403':
        $ref: '../../components/responses.yaml#/Forbidden'
      '409':
        $ref: '../../components/responses.yaml#/Conflict'
downgradeRepairTicketUrgency:
  post:
    operationId: downgradeRepairTicketUrgency
    summary: 主管將急件降級為一般件
    description: >-
      主管對既有急件工務單降級為一般件，必須附原因。急件判定本身是系統依飯店設定規則算出的，
      房務開單時不能更改，只有主管可以事後用這個操作降級；不能反向把一般件升為急件。
      降級後 isUrgent 轉為 false、urgentDowngradeReason 寫入原因；開單當下系統判定的原始結果與理由
      （urgentJudgement）維持不變，供追溯「當時為什麼被判定為急件」。
    tags:
    - 工務單 API
    parameters:
    - $ref: '../../components/parameters.yaml#/RepairTicketId'
    - $ref: '../../components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/工務單.yaml#/DowngradeRepairTicketUrgencyRequest'
    responses:
      '200':
        description: 成功
        content:
          application/json:
            schema:
              $ref: '../../components/schemas/工務單.yaml#/RepairTicket'
      '403':
        $ref: '../../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../../components/responses.yaml#/NotFound'
      '409':
        $ref: '../../components/responses.yaml#/Conflict'
      '422':
        $ref: '../../components/responses.yaml#/UnprocessableEntity'
approveRepairTicket:
  post:
    operationId: approveRepairTicket
    summary: 主管核准等審核中的一般件工務單
    description: >-
      只有 pending_review（等主管審核）的工務單能被核准；核准後轉為 pool（工務待認領）。
      其他狀態回 409 state_conflict；非主管呼叫回 403。寫入核准事件，記錄核准人。
    tags:
    - 工務單 API
    parameters:
    - $ref: '../../components/parameters.yaml#/RepairTicketId'
    - $ref: '../../components/parameters.yaml#/IdempotencyKey'
    responses:
      '200':
        description: 成功
        content:
          application/json:
            schema:
              $ref: '../../components/schemas/工務單.yaml#/RepairTicket'
      '403':
        $ref: '../../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../../components/responses.yaml#/NotFound'
      '409':
        $ref: '../../components/responses.yaml#/Conflict'
rejectRepairTicket:
  post:
    operationId: rejectRepairTicket
    summary: 主管退回等審核中的一般件工務單，須附原因
    description: >-
      只有 pending_review（等主管審核）的工務單能被退回；退回後轉為 rejected，寫入 rejectReason，
      不進入工務待認領。同一交易推播報修人（PushPayload.event=repair_rejected，body 帶退回原因，去處為這張工務單詳情）。
      原因空白回 422 reject_reason_required；其他狀態回 409 state_conflict；
      非主管呼叫回 403。
    tags:
    - 工務單 API
    parameters:
    - $ref: '../../components/parameters.yaml#/RepairTicketId'
    - $ref: '../../components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/工務單.yaml#/RejectRepairTicketRequest'
    responses:
      '200':
        description: 成功
        content:
          application/json:
            schema:
              $ref: '../../components/schemas/工務單.yaml#/RepairTicket'
      '403':
        $ref: '../../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../../components/responses.yaml#/NotFound'
      '409':
        $ref: '../../components/responses.yaml#/Conflict'
      '422':
        $ref: '../../components/responses.yaml#/UnprocessableEntity'
resubmitRepairTicket:
  post:
    operationId: resubmitRepairTicket
    summary: 房務補資料後重新送出被退回的工務單
    description: >-
      只有原報修人可以呼叫；只有 rejected（主管未核准）的工務單能轉回 pending_review（等主管審核），
      rejectReason 清空。其他狀態回 409 state_conflict；非原報修人回 403。
    tags:
    - 工務單 API
    parameters:
    - $ref: '../../components/parameters.yaml#/RepairTicketId'
    - $ref: '../../components/parameters.yaml#/IdempotencyKey'
    responses:
      '200':
        description: 成功
        content:
          application/json:
            schema:
              $ref: '../../components/schemas/工務單.yaml#/RepairTicket'
      '403':
        $ref: '../../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../../components/responses.yaml#/NotFound'
      '409':
        $ref: '../../components/responses.yaml#/Conflict'
verifyRepairTicket:
  post:
    operationId: verifyRepairTicket
    summary: 主管驗收通過已完修的工務單
    description: >-
      只有已完修（state=done）且尚未驗收（verifiedBy 為 null）的工務單能被驗收；驗收後記錄 verifiedBy、
      verifiedAt，state 仍維持 done，不開新狀態值。已驗收或非 done 狀態回 409 state_conflict；
      非主管呼叫回 403。原型未描繪「驗收退回」，本輪不支援這個分支。
    tags:
    - 工務單 API
    parameters:
    - $ref: '../../components/parameters.yaml#/RepairTicketId'
    - $ref: '../../components/parameters.yaml#/IdempotencyKey'
    responses:
      '200':
        description: 成功
        content:
          application/json:
            schema:
              $ref: '../../components/schemas/工務單.yaml#/RepairTicket'
      '403':
        $ref: '../../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../../components/responses.yaml#/NotFound'
      '409':
        $ref: '../../components/responses.yaml#/Conflict'
releaseRepairTicketToPool:
  post:
    operationId: releaseRepairTicketToPool
    summary: 工務自行把公共區域的工務單放回工務待認領
    description: >-
      負責人（工務）自行放回，只允許公共區域（無房號）的工務單；客房工務單回 409
      room_ticket_not_requeueable，只能用既有的中斷／恢復機制暫停。與既有 tasksRequeue
      （主管在班末附交代幫整批退池）用途不同，不能混用。成功時 accepted／doing 轉為 pool，assignee 清空。
    tags:
    - 工務單 API
    parameters:
    - $ref: '../../components/parameters.yaml#/RepairTicketId'
    - $ref: '../../components/parameters.yaml#/IdempotencyKey'
    responses:
      '200':
        description: 成功
        content:
          application/json:
            schema:
              $ref: '../../components/schemas/工務單.yaml#/RepairTicket'
      '403':
        $ref: '../../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../../components/responses.yaml#/NotFound'
      '409':
        $ref: '../../components/responses.yaml#/Conflict'
